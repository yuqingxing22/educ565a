ations can be arranged. Lecture videos have captions. Transcripts are available on request."}, {"title": "Technology", "body": "You need a reliable internet connection and a recent browser. Technical problems are not an excuse for late work unless reported to the IT Help Desk with a ticket number before the deadline."}], "ai_policy": "AI use must be disclosed. If you use generative AI tools in any work for this course, you must disclose that use to the instructor. Failure to disclose AI use will be treated as a violation of the University Academic Integrity Policy. Work you submit must be your own. If you are unsure about this policy, please contact your TA.", "weekly_rhythm": "Weeks open on Monday at 8:00 am ET. Read the assigned OpenStax sections and watch the two lecture videos early in the week. Initial discussion posts are due Wednesday at 11:59 pm ET, and two replies are due Sunday at 11:59 pm ET. Reading checks, in the weeks that have them, are due Sunday at 11:59 pm ET. There is no discussion in midterm week or finals week."}, "weeks": [{"n": 1, "title": "What Is Sociology?", "overview": "This week introduces sociology as the systematic study of groups and group interactions and the sociological imagination. You will also meet the three major theoretical perspectives that we return to all semester. Read the syllabus before you post.", "objectives": ["Define sociology and the sociological imagination.", "Describe the functionalist, conflict, and symbolic interactionist perspectives.", "Explain how personal experiences connect to larger social forces."], "readings": [{"title": "1.1 What Is Sociology?", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/1-1-what-is-sociology", "note": "required"}, {"title": "1.3 Theoretical Perspectives in Sociology", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/1-3-theoretical-perspectives-in-sociology", "note": "required"}], "media": [{"title": "Week 1 lecture: What Is Sociology?", "kind": "video", "length": "18 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available. Examples refer to remote learning in 2021 as a recent change."}, {"title": "Week 1 lecture: Three Theoretical Perspectives", "kind": "video", "length": "22 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available."}, {"title": "Week 1 slides", "kind": "slides", "length": "PDF, about 25 slides", "note": "Lecture slides from the Fall 2021 recording. Download only; no speaker notes."}], "tasks": [{"type": "discussion", "title": "Discussion 1: Introductions and the Sociological Imagination", "due": "Initial post Wed Aug 26, 11:59 pm; two replies Sun Aug 30, 11:59 pm", "points": 10, "prompt": "Introduce yourself to the class (name you prefer, major, and where you are logging in from). Then use the sociological imagination to explain how one personal choice you have made, such as choosing to attend college, was shaped by larger social forces.", "requirements": "Initial post of 150–200 words by Wednesday 11:59 pm ET. Reply to two classmates (at least 75 words each) by Sunday 11:59 pm ET. Use at least one key term from the week's reading. Posts are graded on content, use of course concepts, and clear, professional writing (5 points for the initial post, 2.5 points for each reply). Late posts lose 20%.", "post_count": 168, "posts": [{"author": "Aaliyah T.", "time": "Aug 26, 11:22 pm", "body": "Hello everyone! My name is Aaliyah, and I am a first-year student majoring in nursing. Using the sociological imagination, I can see that my decision to attend college is not only a personal choice, but is also shaped by larger social forces such as my family's expectations and the current economy. Furthermore, the rising cost of tuition shows how social structures influence individual lives. Overall, the sociological imagination helps me understand that my personal troubles are connected to public issues. I look forward to learning from all of you this semester!", "replies": [{"author": "Ethan P.", "time": "Aug 30, 8:14 pm", "body": "Great post, Aaliyah! I agree with your point about the economy. Thank you for sharing!"}]}, {"author": "Brandon K.", "time": "Aug 26, 11:47 pm", "body": "Hi everyone, my name is Brandon and I am a sophomore studying business. In today's society, many people believe that choosing a college is a purely individual decision. However, the sociological imagination shows that my choice was influenced by social factors such as my parents' education and the job market in my hometown. Furthermore, this perspective helps me see that individual experiences are connected to broader social patterns. In conclusion, I am excited to explore these ideas in this course."}, {"author": "Camila R.", "time": "Aug 26, 11:56 pm", "body": "Hello classmates! I am Camila, a first-year student who is still undeclared. Through the lens of the sociological imagination, my decision to attend a public university was shaped by social forces such as financial aid policies and the expectations of my community. Overall, this concept helps me see that my personal story is part of a larger social context. I am looking forward to a great semester with everyone!"}]}], "label": "Week 1", "dates": "Aug 24 – Aug 30"}, {"n": 2, "title": "Sociological Research", "overview": "Sociologists use a range of methods to study the social world. This week covers research approaches, the main research methods, and the ethical rules researchers follow. Reading Check 1 covers Weeks 1 and 2.", "objectives": ["Distinguish quantitative and qualitative approaches.", "Identify the strengths and limits of surveys, experiments, field research, and secondary data analysis.", "Describe why informed consent and confidentiality matter in research."], "readings": [{"title": "2.1 Approaches to Sociological Research", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/2-1-approaches-to-sociological-research", "note": "required"}, {"title": "2.2 Research Methods", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/2-2-research-methods", "note": "required"}, {"title": "2.3 Ethical Concerns", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/2-3-ethical-concerns", "note": "required"}], "media": [{"title": "Week 2 lecture: Asking Sociological Questions", "kind": "video", "length": "20 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available."}, {"title": "Week 2 lecture: Methods and Ethics", "kind": "video", "length": "24 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available. Includes a brief clip from a 1970s film that is not captioned in the original."}, {"title": "Week 2 slides", "kind": "slides", "length": "PDF, about 25 slides", "note": "Lecture slides from the Fall 2021 recording. Download only; no speaker notes."}], "tasks": [{"type": "quiz", "title": "Reading Check 1: Weeks 1–2", "due": "Sun Sep 6, 11:59 pm", "points": 10, "settings": "10 questions drawn from a pool, auto-graded; 2 attempts, 20 minutes each, highest score kept. Questions are multiple choice. The questions shown here are examples from the pool.", "questions": [{"q": "Which thinker is credited with coining the term 'sociology' in 1838?", "options": ["Karl Marx", "Auguste Comte", "Max Weber", "Herbert Spencer"], "answer": 1}, {"q": "C. Wright Mills used the term 'sociological imagination' to describe the ability to:", "options": ["Predict future social trends with statistics", "See the connection between personal experiences and larger social forces", "Imagine how a perfect society would work", "Study social groups without any bias"], "answer": 1}, {"q": "A researcher spends a year living in a neighborhood, taking notes on daily life and joining community events. This is an example of:", "options": ["A controlled experiment", "A mail survey", "Participant observation (field research)", "Secondary data analysis"], "answer": 2}, {"q": "In research, 'reliability' refers to:", "options": ["Whether a measure captures the concept it claims to measure", "Whether a measure gives consistent results when repeated", "Whether the sample is large enough", "Whether participants were told the purpose of the study"], "answer": 1}]}, {"type": "discussion", "title": "Discussion 2: Choosing a Research Method", "due": "Initial post Wed Sep 2, 11:59 pm; two replies Sun Sep 6, 11:59 pm", "points": 10, "prompt": "Think of a question about college life that a sociologist could study (for example, how first-year students make friends). Which research method from this week's reading would you use to study it, and why? Name one ethical concern you would need to address.", "requirements": "Initial post of 150–200 words by Wednesday 11:59 pm ET. Reply to two classmates (at least 75 words each) by Sunday 11:59 pm ET. Use at least one key term from the week's reading. Posts are graded on content, use of course concepts, and clear, professional writing (5 points for the initial post, 2.5 points for each reply). Late posts lose 20%.", "post_count": 157, "posts": [{"author": "Daniel M.", "time": "Sep 2, 11:31 pm", "body": "In today's society, college students face many pressures, so I would like to study how first-year students make friends. I would use a survey because it allows a researcher to collect data from a large number of students. Furthermore, a survey could be analyzed statistically to identify patterns. However, one ethical concern is confidentiality, since students may share personal information. In conclusion, researchers must protect participants' privacy and obtain informed consent.", "replies": [{"author": "Grace L.", "time": "Sep 6, 9:02 pm", "body": "Great post, Daniel! I agree that a survey would work well. Thanks for sharing your thoughts!"}, {"author": "Isabella C.", "time": "Sep 6, 10:25 pm", "body": "I like your point about confidentiality. Nice job!"}]}, {"author": "Fatima A.", "time": "Sep 2, 11:44 pm", "body": "I would study how first-year students make friends using field research. Through participant observation, a sociologist could see how friendships form in dorms and classrooms. Furthermore, this method provides rich, detailed information that a survey might miss. Overall, an important ethical concern is informed consent, because the people being observed should know that they are part of a study. This week's reading shows that ethics is a central part of sociological research."}, {"author": "Hiroshi M.", "time": "Sep 2, 11:53 pm", "body": "A sociologist could study how first-year students make friends by conducting interviews. Interviews allow researchers to understand students' experiences in their own words. Furthermore, this qualitative approach can reveal patterns that numbers alone cannot show. One ethical concern is protecting the identity of participants. In conclusion, choosing the right method depends on the research question."}]}], "label": "Week 2", "dates": "Aug 31 – Sep 6"}, {"n": 3, "title": "Culture", "overview": "Culture is the shared set of values, beliefs, norms, symbols, and practices of a group. This week looks at what culture is, its elements, and how the three theoretical perspectives explain it.", "objectives": ["Define culture and distinguish material from nonmaterial culture.", "Explain values, norms, sanctions, and symbols.", "Apply the three perspectives to a cultural practice."], "readings": [{"title": "3.1 What Is Culture?", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/3-1-what-is-culture", "note": "required"}, {"title": "3.2 Elements of Culture", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/3-2-elements-of-culture", "note": "required"}, {"title": "3.4 Theoretical Perspectives on Culture", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/3-4-theoretical-perspectives-on-culture", "note": "required"}], "media": [{"title": "Week 3 lecture: What Is Culture?", "kind": "video", "length": "19 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available. Includes examples from social media platforms popular in 2021."}, {"title": "Week 3 lecture: Norms, Values, and Cultural Change", "kind": "video", "length": "21 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available."}, {"title": "Week 3 slides", "kind": "slides", "length": "PDF, about 25 slides", "note": "Lecture slides from the Fall 2021 recording. Download only; no speaker notes."}], "tasks": [{"type": "discussion", "title": "Discussion 3: A Cultural Practice Through a Sociological Lens", "due": "Initial post Wed Sep 9, 11:59 pm; two replies Sun Sep 13, 11:59 pm", "points": 10, "prompt": "Describe one norm, value, or ritual from a culture or subculture you belong to. Analyze it using one of the three theoretical perspectives from Week 1.", "requirements": "Initial post of 150–200 words by Wednesday 11:59 pm ET. Reply to two classmates (at least 75 words each) by Sunday 11:59 pm ET. Use at least one key term from the week's reading. Posts are graded on content, use of course concepts, and clear, professional writing (5 points for the initial post, 2.5 points for each reply). Late posts lose 20%.", "post_count": 152, "posts": [{"author": "Jordan W.", "time": "Sep 9, 11:18 pm", "body": "One norm in my family's culture is gathering for a large meal every Sunday. From a functionalist perspective, this ritual serves an important function because it strengthens family bonds and passes on shared values. Furthermore, the practice creates stability for family members. In conclusion, this week's reading shows how cultural practices help society function smoothly."}, {"author": "Kayla S.", "time": "Sep 9, 11:39 pm", "body": "In today's society, one value in my culture is respect for elders. Using the conflict perspective, we can see that this value also reinforces a hierarchy in which older family members hold more power. Furthermore, this shows how culture can serve the interests of some groups. Overall, analyzing culture through different perspectives helps us understand it more deeply.", "replies": [{"author": "Liam D.", "time": "Sep 13, 7:45 pm", "body": "Great post, Kayla! I never thought about respect for elders as a form of power. Thanks for sharing!"}]}, {"author": "Mei-Ling Z.", "time": "Sep 9, 11:58 pm", "body": "A ritual in my community is celebrating Lunar New Year with specific foods and greetings. According to symbolic interactionism, these foods and greetings are symbols that carry shared meanings. Furthermore, people create and recreate culture through everyday interactions. In conclusion, this ritual shows how symbols help members of a culture understand one another."}]}], "label": "Week 3", "dates": "Sep 7 – Sep 13"}, {"n": 4, "title": "Society and the Social Construction of Reality", "overview": "This week we move from culture to society. We compare types of societies and examine how people create and maintain what they take to be real through social interaction. Reading Check 2 covers Weeks 3 and 4.", "objectives": ["Describe how societies differ by technology and economy.", "Explain the idea that reality is socially constructed.", "Give an example of a socially constructed category."], "readings": [{"title": "4.1 Types of Societies", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/4-1-types-of-societies", "note": "required"}, {"title": "4.3 Social Constructions of Reality", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/4-3-social-constructions-of-reality", "note": "required"}], "media": [{"title": "Week 4 lecture: Types of Societies", "kind": "video", "length": "17 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available."}, {"title": "Week 4 lecture: How Reality Is Constructed", "kind": "video", "length": "23 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available. Contains a segment on 'digital natives' that reflects 2021 technology."}, {"title": "Week 4 slides", "kind": "slides", "length": "PDF, about 25 slides", "note": "Lecture slides from the Fall 2021 recording. Download only; no speaker notes."}], "tasks": [{"type": "quiz", "title": "Reading Check 2: Weeks 3–4", "due": "Sun Sep 20, 11:59 pm", "points": 10, "settings": "10 questions drawn from a pool, auto-graded; 2 attempts, 20 minutes each, highest score kept. Questions are multiple choice. The questions shown here are examples from the pool.", "questions": [{"q": "Which of the following is an example of nonmaterial culture?", "options": ["A smartphone", "A university campus", "The belief in individual freedom", "A traditional wedding dress"], "answer": 2}, {"q": "Wearing pajamas to a formal lecture would most likely be a violation of a:", "options": ["Law", "Folkway", "Taboo", "Value"], "answer": 1}, {"q": "Judging another culture by the standards of your own culture is called:", "options": ["Cultural relativism", "Ethnocentrism", "Xenocentrism", "Cultural diffusion"], "answer": 1}, {"q": "Sociologists say that race and gender are 'socially constructed.' This means that:", "options": ["They have no effect on people's lives", "Their meanings are created and maintained through social interaction rather than being fixed by biology alone", "They were invented by sociologists in the twentieth century", "They are the same in every society"], "answer": 1}]}, {"type": "discussion", "title": "Discussion 4: What Seems Natural but Is Socially Constructed?", "due": "Initial post Wed Sep 16, 11:59 pm; two replies Sun Sep 20, 11:59 pm", "points": 10, "prompt": "Choose one thing that many people think of as natural or fixed (for example, gender roles, money, or the idea of 'adulthood'). Explain how it is socially constructed, using at least one idea from this week's reading.", "requirements": "Initial post of 150–200 words by Wednesday 11:59 pm ET. Reply to two classmates (at least 75 words each) by Sunday 11:59 pm ET. Use at least one key term from the week's reading. Posts are graded on content, use of course concepts, and clear, professional writing (5 points for the initial post, 2.5 points for each reply). Late posts lose 20%.", "post_count": 149, "posts": [{"author": "Noah B.", "time": "Sep 16, 11:27 pm", "body": "In today's society, many people believe that money has value naturally. However, according to this week's reading, the value of money is socially constructed because it depends on a shared agreement among people. Furthermore, if people stopped trusting a currency, it would lose its value. Overall, this example shows how social interaction creates and maintains what we consider to be real."}, {"author": "Olivia H.", "time": "Sep 16, 11:49 pm", "body": "One thing that seems natural is the idea that certain jobs are for men and others are for women. This week's reading helps us see that gender roles are socially constructed through socialization and everyday interaction. Furthermore, these roles vary across cultures and change over time. In conclusion, understanding social construction allows us to question what we take for granted.", "replies": [{"author": "Priya V.", "time": "Sep 20, 6:30 pm", "body": "Great post, Olivia! I agree that gender roles change over time. Thanks for sharing!"}]}, {"author": "Samuel J.", "time": "Sep 16, 11:57 pm", "body": "The concept of adulthood is often viewed as a natural stage of life. Yet the reading shows that societies define adulthood differently, for example at 18 or at marriage. Furthermore, these definitions are created through laws and cultural expectations. Overall, adulthood is a social construction rather than a purely biological fact."}]}], "label": "Week 4", "dates": "Sep 14 – Sep 20"}, {"n": 5, "title": "Socialization", "overview": "How do we become members of society? This week covers classic theories of self-development and the main agents of socialization: family, school, peers, and media.", "objectives": ["Summarize Cooley's looking-glass self and Mead's stages of self-development.", "Identify the agents of socialization.", "Explain how socialization shapes identity."], "readings": [{"title": "5.1 Theories of Self-Development", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/5-1-theories-of-self-development", "note": "required"}, {"title": "5.3 Agents of Socialization", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/5-3-agents-of-socialization", "note": "required"}], "media": [{"title": "Week 5 lecture: Becoming a Self", "kind": "video", "length": "20 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available."}, {"title": "Week 5 lecture: Agents of Socialization", "kind": "video", "length": "18 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available. Examples about peer groups mention platforms that have since changed."}, {"title": "Week 5 slides", "kind": "slides", "length": "PDF, about 25 slides", "note": "Lecture slides from the Fall 2021 recording. Download only; no speaker notes."}], "tasks": [{"type": "discussion", "title": "Discussion 5: Your Agents of Socialization", "due": "Initial post Wed Sep 23, 11:59 pm; two replies Sun Sep 27, 11:59 pm", "points": 10, "prompt": "Which agent of socialization (family, school, peers, mass media, or another) has had the biggest influence on who you are today? Use one theory of self-development from the reading to explain how.", "requirements": "Initial post of 150–200 words by Wednesday 11:59 pm ET. Reply to two classmates (at least 75 words each) by Sunday 11:59 pm ET. Use at least one key term from the week's reading. Posts are graded on content, use of course concepts, and clear, professional writing (5 points for the initial post, 2.5 points for each reply). Late posts lose 20%.", "post_count": 146, "posts": [{"author": "Tyler N.", "time": "Sep 23, 11:33 pm", "body": "The agent of socialization that has influenced me most is my family. According to Cooley's looking-glass self, we develop our sense of self based on how we think others see us. Furthermore, my parents' expectations taught me to value hard work. In conclusion, my family played the biggest role in shaping my identity.", "replies": [{"author": "Aaliyah T.", "time": "Sep 27, 8:50 pm", "body": "Great post, Tyler! I agree that family is very influential. Thanks for sharing!"}]}, {"author": "Zara F.", "time": "Sep 23, 11:45 pm", "body": "In today's society, mass media is a powerful agent of socialization. Through social media, I learned what is considered popular and acceptable. Furthermore, Mead's idea of the generalized other explains how I take into account the expectations of a larger community. Overall, media has shaped how I see myself and others."}, {"author": "Ben C.", "time": "Sep 23, 11:59 pm", "body": "Peers have had the biggest influence on me. Using Mead's theory, I learned to take the role of others by playing on a team in high school. Furthermore, my teammates taught me about cooperation and fairness. In conclusion, peer groups are a key agent of socialization."}]}], "label": "Week 5", "dates": "Sep 21 – Sep 27"}, {"n": 6, "title": "Groups and Organizations", "overview": "Much of social life takes place in groups. This week covers primary and secondary groups, in-groups and out-groups, and formal organizations, including Weber's bureaucracy. Reading Check 3 covers Weeks 5 and 6.", "objectives": ["Distinguish primary and secondary groups.", "Describe the characteristics of a bureaucracy.", "Explain the idea of McDonaldization."], "readings": [{"title": "6.1 Types of Groups", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/6-1-types-of-groups", "note": "required"}, {"title": "6.3 Formal Organizations", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/6-3-formal-organizations", "note": "required"}], "media": [{"title": "Week 6 lecture: Groups in Social Life", "kind": "video", "length": "19 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available."}, {"title": "Week 6 lecture: Bureaucracy and Formal Organizations", "kind": "video", "length": "22 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available."}, {"title": "Week 6 slides", "kind": "slides", "length": "PDF, about 25 slides", "note": "Lecture slides from the Fall 2021 recording. Download only; no speaker notes."}], "tasks": [{"type": "quiz", "title": "Reading Check 3: Weeks 5–6", "due": "Sun Oct 4, 11:59 pm", "points": 10, "settings": "10 questions drawn from a pool, auto-graded; 2 attempts, 20 minutes each, highest score kept. Questions are multiple choice. The questions shown here are examples from the pool.", "questions": [{"q": "Charles Horton Cooley's concept of the 'looking-glass self' suggests that our sense of self develops from:", "options": ["Our genetic makeup", "How we imagine others see and judge us", "Formal schooling alone", "Our position in the economy"], "answer": 1}, {"q": "In George Herbert Mead's theory, the 'generalized other' refers to:", "options": ["A specific person who is important to us", "Our awareness of the norms and expectations of society as a whole", "A person who is very different from us", "The part of the self that is purely biological"], "answer": 1}, {"q": "Which best describes a primary group?", "options": ["A large, impersonal group formed to achieve a goal", "A small, long-lasting group with strong emotional ties, such as a family", "A group of strangers waiting for a bus", "A group that people leave after a short time"], "answer": 1}, {"q": "The term 'McDonaldization' describes:", "options": ["The spread of American restaurants worldwide only", "The process by which principles of efficiency, calculability, predictability, and control come to dominate more areas of society", "The decline of bureaucracy", "A form of primary group"], "answer": 1}]}, {"type": "discussion", "title": "Discussion 6: Primary and Secondary Groups in Your Life", "due": "Initial post Wed Sep 30, 11:59 pm; two replies Sun Oct 4, 11:59 pm", "points": 10, "prompt": "Compare one primary group and one secondary group you belong to. Then explain one way in which a formal organization you deal with (for example, your university) reflects the features of a bureaucracy.", "requirements": "Initial post of 150–200 words by Wednesday 11:59 pm ET. Reply to two classmates (at least 75 words each) by Sunday 11:59 pm ET. Use at least one key term from the week's reading. Posts are graded on content, use of course concepts, and clear, professional writing (5 points for the initial post, 2.5 points for each reply). Late posts lose 20%.", "post_count": 151}], "label": "Week 6", "dates": "Sep 28 – Oct 4"}, {"n": 7, "title": "Deviance and Social Control", "overview": "Deviance is behavior that violates social norms, and what counts as deviant varies by time and place. This week introduces how the three perspectives explain deviance and crime.", "objectives": ["Define deviance and social control.", "Compare functionalist, conflict, and symbolic interactionist explanations of deviance.", "Explain strain theory and labeling theory."], "readings": [{"title": "7.1 Deviance and Control", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/7-1-deviance-and-control", "note": "required"}, {"title": "7.2 Theoretical Perspectives on Deviance and Crime", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/7-2-theoretical-perspectives-on-deviance-and-crime", "note": "required"}], "media": [{"title": "Week 7 lecture: What Counts as Deviant?", "kind": "video", "length": "18 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available."}, {"title": "Week 7 lecture: Theories of Deviance", "kind": "video", "length": "25 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available."}, {"title": "Week 7 slides", "kind": "slides", "length": "PDF, about 25 slides", "note": "Lecture slides from the Fall 2021 recording. Download only; no speaker notes."}], "tasks": [{"type": "discussion", "title": "Discussion 7: Deviant Here, Normal There", "due": "Initial post Wed Oct 7, 11:59 pm; two replies Sun Oct 11, 11:59 pm", "points": 10, "prompt": "Choose a behavior that is considered deviant in one context but not in another (for example, in different time periods or cultures). Analyze why using one theory from this week's reading.", "requirements": "Initial post of 150–200 words by Wednesday 11:59 pm ET. Reply to two classmates (at least 75 words each) by Sunday 11:59 pm ET. Use at least one key term from the week's reading. Posts are graded on content, use of course concepts, and clear, professional writing (5 points for the initial post, 2.5 points for each reply). Late posts lose 20%.", "post_count": 143, "posts": [{"author": "Chloe R.", "time": "Oct 7, 11:25 pm", "body": "Tattoos were once considered deviant in many parts of American society but are now widely accepted. According to labeling theory, deviance is not inherent in an act but depends on how others react to it. Furthermore, as more people got tattoos, the label changed. In conclusion, this example shows that deviance is socially defined."}, {"author": "Marcus D.", "time": "Oct 7, 11:42 pm", "body": "In today's society, staying up all night to study is often praised, while skipping class is seen as deviant. Using functionalism, deviance can clarify moral boundaries. Furthermore, Durkheim argued that deviance can unite a community in response. Overall, context determines what we see as deviant.", "replies": [{"author": "Sophia L.", "time": "Oct 11, 9:15 pm", "body": "Great post, Marcus! I agree that context matters. Thanks for sharing!"}]}, {"author": "Elena V.", "time": "Oct 7, 11:55 pm", "body": "Using marijuana is a good example because it is legal in some states but illegal in others. From a conflict perspective, laws reflect the interests of powerful groups. Furthermore, enforcement has not been equal across social groups. In conclusion, this example shows how power shapes what is labeled deviant."}]}], "label": "Week 7", "dates": "Oct 5 – Oct 11"}, {"n": 8, "title": "Midterm Exam", "overview": "There are no new readings or discussion this week. Review Weeks 1–7 using the review lecture and your notes. The midterm opens Thursday and closes Sunday.", "objectives": ["Review the key concepts and theories from Weeks 1–7."], "readings": [], "media": [{"title": "Midterm review lecture", "kind": "video", "length": "28 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available. Covers Weeks 1–7 only."}, {"title": "Midterm review sheet", "kind": "slides", "length": "PDF, 4 pages", "note": "List of key terms and theorists. Not a study guide with answers."}], "tasks": [{"type": "quiz", "title": "Midterm Exam (Weeks 1–7)", "due": "Sun Oct 18, 11:59 pm", "points": 100, "settings": "Opens Thu Oct 15, 12:00 am. 40 multiple-choice questions drawn from a pool, one attempt, 75 minutes once started, auto-graded. Open notes, no proctoring software. The five questions shown are posted practice items.", "questions": [{"q": "Which statement best describes the symbolic interactionist perspective?", "options": ["Society is a system of parts that work together to create stability", "Society is shaped by conflict over scarce resources", "Society is created and maintained through everyday interactions and shared meanings", "Society is determined by biology"], "answer": 2}, {"q": "In a study testing whether hours of sleep affect exam scores, the independent variable is:", "options": ["Exam scores", "Hours of sleep", "The students' majors", "The semester"], "answer": 1}, {"q": "Which principle of research ethics requires that participants know the purpose and risks of a study and agree to take part?", "options": ["Replication", "Informed consent", "Validity", "Random sampling"], "answer": 1}, {"q": "Labeling theory argues that deviance:", "options": ["Is a characteristic of certain kinds of people from birth", "Results from how others define and react to an act", "Occurs only in poor communities", "Is always harmful to society"], "answer": 1}, {"q": "A student adopts the slang and dress of a new friend group to fit in. This is best described as socialization by:", "options": ["The mass media", "Peer groups", "A total institution", "The family of orientation"], "answer": 1}]}], "label": "Week 8", "dates": "Oct 12 – Oct 18"}, {"n": 9, "title": "Social Stratification", "overview": "Social stratification is the system of ranking people in society by wealth, power, and prestige. This week focuses on the United States: class, mobility, and the theoretical perspectives. Reading Check 4 covers Weeks 7 and 9.", "objectives": ["Distinguish caste and class systems.", "Define social mobility and describe its types.", "Compare how functionalists and conflict theorists explain inequality."], "readings": [{"title": "9.1 What Is Social Stratification?", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/9-1-what-is-social-stratification", "note": "required"}, {"title": "9.2 Social Stratification and Mobility in the United States", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/9-2-social-stratification-and-mobility-in-the-united-states", "note": "required"}, {"title": "9.4 Theoretical Perspectives on Social Stratification", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/9-4-theoretical-perspectives-on-social-stratification", "note": "required"}], "media": [{"title": "Week 9 lecture: Systems of Stratification", "kind": "video", "length": "21 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available. Income and wealth figures in the lecture are from 2020."}, {"title": "Week 9 lecture: Mobility and Theory", "kind": "video", "length": "23 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available."}, {"title": "Week 9 slides", "kind": "slides", "length": "PDF, about 25 slides", "note": "Lecture slides from the Fall 2021 recording. Download only; no speaker notes."}], "tasks": [{"type": "quiz", "title": "Reading Check 4: Weeks 7 and 9", "due": "Sun Oct 25, 11:59 pm", "points": 10, "settings": "10 questions drawn from a pool, auto-graded; 2 attempts, 20 minutes each, highest score kept. Questions are multiple choice. The questions shown here are examples from the pool.", "questions": [{"q": "According to Durkheim, deviance can be functional for society because it:", "options": ["Reduces the need for laws", "Clarifies moral boundaries and can promote social unity", "Always leads to social collapse", "Ensures everyone is equal"], "answer": 1}, {"q": "A person who accepts the cultural goal of financial success but turns to illegal means to reach it fits Merton's category of:", "options": ["Conformity", "Innovation", "Ritualism", "Retreatism"], "answer": 1}, {"q": "Moving from one social class to another during your own lifetime is called:", "options": ["Intergenerational mobility", "Intragenerational mobility", "Structural mobility", "Horizontal mobility"], "answer": 1}, {"q": "Which best describes a caste system?", "options": ["Social standing is based mainly on individual achievement", "Social standing is determined by birth, and moving between castes is very limited", "Everyone has equal social standing", "Social standing changes every generation by law"], "answer": 1}, {"q": "The Davis-Moore thesis, a functionalist argument, claims that stratification:", "options": ["Is unnecessary in modern societies", "Ensures that the most important positions are filled by the most qualified people", "Exists only because of discrimination", "Is created by the mass media"], "answer": 1}]}, {"type": "discussion", "title": "Discussion 9: Social Class and Opportunity", "due": "Initial post Wed Oct 21, 11:59 pm; two replies Sun Oct 25, 11:59 pm", "points": 10, "prompt": "Reflect on how your family's social class position has shaped one opportunity or constraint in your life. Connect your example to at least one concept from the reading (for example, social mobility, cultural capital, or meritocracy).", "requirements": "Initial post of 150–200 words by Wednesday 11:59 pm ET. Reply to two classmates (at least 75 words each) by Sunday 11:59 pm ET. Use at least one key term from the week's reading. Posts are graded on content, use of course concepts, and clear, professional writing (5 points for the initial post, 2.5 points for each reply). Late posts lose 20%.", "post_count": 139, "posts": [{"author": "Rachel Q.", "time": "Oct 21, 11:36 pm", "body": "My family's social class has shaped my educational opportunities. Because my parents could afford to live in a good school district, I had access to advanced classes. Furthermore, the reading's discussion of social mobility shows that class position at birth strongly influences adult outcomes. In conclusion, my experience reflects how stratification affects opportunities."}, {"author": "Victor A.", "time": "Oct 21, 11:51 pm", "body": "In today's society, many people believe in meritocracy, the idea that success is based on effort and talent. However, my experience as a first-generation student shows that family resources matter. Furthermore, conflict theorists argue that stratification benefits those already in power. Overall, class shapes opportunity in ways we often overlook.", "replies": [{"author": "Camila R.", "time": "Oct 25, 7:10 pm", "body": "Thanks for sharing, Victor! I agree with your points about meritocracy."}]}, {"author": "Hannah G.", "time": "Oct 21, 11:58 pm", "body": "Class has shaped my access to internships. Because I need to work during the summer, I cannot take unpaid positions that build a resume. Furthermore, this shows how economic resources translate into opportunities. In conclusion, stratification affects the paths that students can take."}]}], "label": "Week 9", "dates": "Oct 19 – Oct 25"}, {"n": 10, "title": "Global Inequality", "overview": "This week widens the lens from the United States to the world. We look at how nations are classified, what poverty means in different places, and how global inequality is measured.", "objectives": ["Describe how nations are classified by income and development.", "Distinguish absolute and relative poverty.", "Explain why global inequality persists."], "readings": [{"title": "10.1 Global Stratification and Classification", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/10-1-global-stratification-and-classification", "note": "required"}, {"title": "10.2 Global Wealth and Poverty", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/10-2-global-wealth-and-poverty", "note": "required"}], "media": [{"title": "Week 10 lecture: Classifying Nations", "kind": "video", "length": "19 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available. Uses country classifications and poverty statistics from 2020."}, {"title": "Week 10 lecture: Wealth and Poverty Worldwide", "kind": "video", "length": "22 min", "note": "Recorded Fall 2021; the same video is used in every section. Captions available."}, {"title": "Week 10 slides", "kind": "slides", "length": "PDF, about 25 slides", "note": "Lecture slides from the Fall 2021 recording. Download only; no speaker notes."}], "tasks": [{"type": "discussion", "title": "Discussion 10: Global Inequality in Everyday Life", "due": "Initial post Wed Oct 28, 11:59 pm; two replies Sun Nov 1, 11:59 pm", "points": 10, "prompt": "Choose one everyday item (such as a phone, a shirt, or a cup of coffee) and trace one way it connects you to global inequality. Use at least one concept from this week's reading.", "requirements": "Initial post of 150–200 words by Wednesday 11:59 pm ET. Reply to two classmates (at least 75 words each) by Sunday 11:59 pm ET. Use at least one key term from the week's reading. Posts are graded on content, use of course concepts, and clear, professional writing (5 points for the initial post, 2.5 points for each reply). Late posts lose 20%.", "post_count": 133, "posts": [{"author": "Nathan E.", "time": "Oct 28, 11:14 pm", "body": "A smartphone connects me to global inequality because many of its parts are made in countries where workers earn low wages. According to the reading, wealthy nations often benefit from the labor of people in poorer nations. Furthermore, this shows that global stratification is tied to the global economy. Overall, everyday products reveal larger patterns of inequality."}, {"author": "Mia T.", "time": "Oct 28, 11:40 pm", "body": "In today's society, my morning coffee is an example of global inequality. Coffee is grown in low-income countries but often sold at much higher prices in wealthy nations. Furthermore, the farmers who grow the coffee receive a small share of the profit. In conclusion, this example illustrates how global stratification works."}, {"author": "Oscar L.", "time": "Oct 28, 11:52 pm", "body": "My clothing connects me to global inequality because many garments are manufactured in countries with low labor costs. Furthermore, absolute poverty makes workers willing to accept dangerous conditions. Overall, understanding this connection helps me think about my role as a consumer."}]}], "label": "Week 10", "dates": "Oct 26 – Nov 1"}, {"n": 11, "title": "Race and Ethnicity", "overview": "This week covers how sociologists define race, ethnicity, and minority groups, and how prejudice, discrimination, and racism operate. Please read carefully and keep discussion respectful. Reading Check 5 covers Weeks 10 and 11.", "objectives": ["Define race, ethnicity, and minority group in sociological terms.", "Distinguish prejudice, discrimination, and institutional racism.", "Describe patterns of race and ethnicity in the United States."], "readings": [{"title": "11.1 Racial, Ethnic, and Minority Groups", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/11-1-racial-ethnic-and-minority-groups", "note": "required"}, {"title": "11.3 Prejudice, Discrimination, and Racism", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/11-3-prejudice-discrimination-and-racism", "note": "required"}, {"title": "11.5 Race and Ethnicity in the United States", "source": "OpenStax Introduction to Sociology 3e", "url": "https://openstax.org/books/introduction-sociology-3e/pages/11-5-race-and-ethnicity-in-the-united-states", "note": "required"}], "media": [{"title": "Week 11 lecture: Race, Ethnicity, and Minority Groups", "kind": "video", "leng SYLLABUS
============================================================
Course description
An introduction to the sociological study of society. Topics include sociological theory and research methods, culture, socialization, groups and organizations, deviance, social stratification, race and ethnicity, gender, family, education, and social change. Students learn to use the sociological perspective to analyze social issues. This course satisfies the university's general-education requirement in social and behavioral sciences.

Instructor: Dr. Rosalind Pettigrew, Associate Professor of Sociology · rpettigrew@calderstate.example
Office hours: Thursdays 2:00–3:00 pm ET by Zoom, first come first served; link on the Home page. Questions about grades and assignments should go to your TA first.
Response time: Within 48 hours on weekdays (TAs answer first)
Teaching Assistant (last names A–L): Marcus Hale · mhale@calderstate.example
Teaching Assistant (last names M–Z): Priya Venkataraman · pvenkataraman@calderstate.example

Learning outcomes
- Define and apply key sociological concepts such as the sociological imagination, culture, socialization, and stratification.
- Compare the functionalist, conflict, and symbolic interactionist perspectives and use them to analyze social issues.
- Describe the main methods sociologists use to study social life and evaluate basic research claims.
- Explain how social inequalities based on class, race, and gender are produced and maintained.
- Communicate sociological ideas clearly in writing and in online discussion.

Course materials
- Conerly, T. R., Holmes, K., & Lal Tamang, A. (2021). Introduction to sociology 3e. OpenStax. https://openstax.org/books/introduction-sociology-3e/pages/1-introduction https://openstax.org/books/introduction-sociology-3e/pages/1-introduction (Required; free online. A free PDF and low-cost print copy are also available from OpenStax.)

How a week works
Weeks open on Monday at 8:00 am ET. Read the assigned OpenStax sections and watch the two lecture videos early in the week. Initial discussion posts are due Wednesday at 11:59 pm ET, and two replies are due Sunday at 11:59 pm ET. Reading checks, in the weeks that have them, are due Sunday at 11:59 pm ET. There is no discussion in midterm week or finals week.

Grading
- Weekly discussions (14 × 10 points): 30%
- Reading checks (6 × 10 points): 15%
- Midterm exam: 25%
- Final essay: 30%
A 93–100, A- 90–92, B+ 87–89, B 83–86, B- 80–82, C+ 77–79, C 73–76, C- 70–72, D 60–69, F below 60.

Policies
Late work: Discussion posts submitted late lose 20% of the available points and are not accepted more than 48 hours after the deadline. Reading checks close at the deadline and are not reopened except for documented emergencies. The final essay loses 10% per day late.
Discussion participation: Each week you must write one initial post by Wednesday 11:59 pm ET and reply to two classmates by Sunday 11:59 pm ET. Posts should be respectful, use course concepts, and be written in clear, professional English. Posts that do not meet the length requirement may lose points.
Contacting the teaching team: Email your TA first. TAs will respond within 48 hours on weekdays. Emails sent on weekends will be answered the following Monday or Tuesday. Please check the syllabus and the announcements before emailing. The instructor handles grade appeals after you have contacted your TA.
Academic integrity: All work must be your own. Plagiarism, unauthorized collaboration, and submitting work written by someone or something else without disclosure are violations of the University Academic Integrity Policy and may result in a failing grade for the assignment or the course.
Accessibility and accommodations: Students with documented disabilities should contact the Office of Accessibility Services at the start of the term so accommodations can be arranged. Lecture videos have captions. Transcripts are available on request.
Technology: You need a reliable internet connection and a recent browser. Technical problems are not an excuse for late work unless reported to the IT Help Desk with a ticket number before the deadline.
Use of AI tools: AI use must be disclosed. If you use generative AI tools in any work for this course, you must disclose that use to the instructor. Failure to disclose AI use will be treated as a violation of the University Academic Integrity Policy. Work you submit must be your own. If you are unsure about this policy, please contact your TA.
