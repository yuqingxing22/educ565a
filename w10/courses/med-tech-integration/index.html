<script id="data" type="application/json">{"slug": "med-tech-integration", "site_name": "CourseSpace", "institution": "Hartwell Ridge University", "program": "School of Education / Online M.Ed. in Educational Technology", "code": "EDTC 520", "title": "Technology Integration in K-12 Classrooms", "term": "Fall 2026, Session B (Oct 19 - Dec 13)", "format": "Fully online, asynchronous - 8 weeks", "enrollment": "Cohort of 22 (section 01)", "instructor": {"name": "Dr. Elaine Whitcombe", "title": "Associate Clinical Professor of Educational Technology", "email": "ewhitcombe@hrumail.example", "office_hours": "Optional virtual office hours by appointment, Tuesdays 4:00-6:00 pm ET. Email to book a 15-minute slot. Hours are not recorded.", "response_time": "Within 48 hours on weekdays. Messages sent Friday evening through Sunday are answered Monday."}, "staff": [{"name": "Jordan Ellis", "role": "Graduate Teaching Assistant (discussion grading)", "email": "jellis@hrumail.example"}], "home_message": "Welcome to EDTC 520. This is an 8-week course about how teachers decide what technology to bring into a classroom, why, and how to tell whether it helped. You are all working teachers, so you will be testing the ideas against your own rooms from the first week.\n\nEach week has a short set of readings, one discussion (an initial post and two replies), and, for most weeks, one stage of the course project: a technology-integrated unit plan that you build piece by piece and submit in final form in Week 8. The stages are there so that no one is writing the whole plan in the last weekend.\n\nPlease read the syllabus before Wednesday of Week 1, especially the late work policy and the AI policy. I post a Week Overview announcement every Monday morning. Check it first each week, because it lists exactly what is due and when.\n\nI know most of you are teaching all day and doing coursework at night. Plan your week around the Wednesday and Sunday deadlines and let me know early if something comes up. I look forward to working with you.\n\nDr. Whitcombe", "announcements": [{"date": "Oct 27, 2026", "author": "Course notification (automatic)", "title": "Grades posted: Discussion 1", "body": "Your grade for Discussion 1: Introductions and TPACK in My Classroom has been posted. To see your rubric scores and comments, open Grades."}, {"date": "Oct 26, 2026", "author": "Dr. Elaine Whitcombe", "title": "Week 2 Overview: Evaluating Technology Use (SAMR)", "body": "Good morning, everyone.\n\nThis week we move from the big-picture frameworks to a practical question: when you use a tool, what is it actually doing for learning? We will use the SAMR model from Bates, Chapter 7.\n\nDue this week:\n- Read Bates, Chapter 7 (sections 7.1 to 7.4).\n- Discussion 2: initial post by Wednesday, Oct 28, 11:59 pm ET. Two replies by Sunday, Nov 1, 11:59 pm ET.\n- Project Stage 1 (Unit Context and Learner Profile) is due Sunday, Nov 1, 11:59 pm ET. Please read the rubric before you start.\n\nA reminder that replies should add something to the conversation, such as an example, a question, or a different experience. Thank you for the good first week of posts.\n\nDr. Whitcombe"}, {"date": "Oct 19, 2026", "author": "Dr. Elaine Whitcombe", "title": "Welcome and Week 1 Overview", "body": "Welcome to EDTC 520. I have posted a short welcome video (about 5 minutes) on the Week 1 page, with captions and a transcript, if you would like a quick tour of the course.\n\nDue this week:\n- Read Koehler and Mishra (2009) and skim the ISTE Standards for Educators.\n- Discussion 1: initial post by Wednesday, Oct 21, 11:59 pm ET. Two replies by Sunday, Oct 25, 11:59 pm ET.\n\nThere is no project stage this week. Please read the syllabus and ask any questions about it in the Course Questions forum.\n\nDr. Whitcombe"}], "syllabus": {"description": "This course examines how K-12 teachers plan, select, and evaluate technology for teaching and learning. Students study frameworks for technology integration (TPACK, SAMR, SECTIONS), Universal Design for Learning, technology-supported assessment, and emerging issues including artificial intelligence, privacy, and equity. The course project is a technology-integrated unit plan developed in stages and submitted in Week 8. Prerequisite: admission to the M.Ed. in Educational Technology or permission of the instructor.", "outcomes": ["Explain how technology, pedagogy, and content knowledge interact in a teaching decision, using the TPACK framework.", "Evaluate the role a technology plays in a lesson using the SAMR model and the SECTIONS criteria.", "Apply Universal Design for Learning guidelines to remove barriers in a technology-supported activity.", "Design formative and summative assessments that make appropriate use of technology.", "Analyze issues of access, privacy, and responsible use, including the use of AI tools, in K-12 settings.", "Create and defend a technology-integrated unit plan aligned to the ISTE Standards for Educators."], "materials": [{"citation": "Bates, A. W. (2019). Teaching in a digital age: Guidelines for designing teaching and learning (2nd ed.). BCcampus. https://pressbooks.bccampus.ca/teachinginadigitalagev2/", "url": "https://pressbooks.bccampus.ca/teachinginadigitalagev2/", "note": "Free online. Assigned chapters are listed by week. A 3rd edition was released in 2022; this course still uses the 2nd edition chapter numbers."}, {"citation": "Koehler, M. J., & Mishra, P. (2009). What is technological pedagogical content knowledge? Contemporary Issues in Technology and Teacher Education, 9(1). https://citejournal.org/volume-9/issue-1-09/general/what-is-technological-pedagogicalcontent-knowledge", "url": "https://citejournal.org/volume-9/issue-1-09/general/what-is-technological-pedagogicalcontent-knowledge", "note": "Free online (open access journal)."}, {"citation": "CAST. (2024). Universal Design for Learning guidelines version 3.0. https://udlguidelines.cast.org", "url": "https://udlguidelines.cast.org/", "note": "Free online."}, {"citation": "International Society for Technology in Education. (n.d.). ISTE standards: Educators. https://iste.org/standards/educators", "url": "https://iste.org/standards/educators", "note": "Free to view online. Downloading the PDF asks for an email address."}, {"citation": "U.S. Department of Education, Office of Educational Technology. (2023). Artificial intelligence and the future of teaching and learning: Insights and recommendations. https://www2.ed.gov/documents/ai-report/ai-report.pdf", "url": "https://www2.ed.gov/documents/ai-report/ai-report.pdf", "note": "Free online (PDF, 71 pages). Assigned page ranges are listed by week."}], "grading": [{"item": "Weekly discussions (8 x 10 points)", "weight": "30%"}, {"item": "Unit plan Stages 1-4 (4 x 25 points)", "weight": "20%"}, {"item": "Draft unit plan, Week 7 (50 points)", "weight": "10%"}, {"item": "Final unit plan, Week 8 (100 points)", "weight": "30%"}, {"item": "Final reflection, Week 8 (20 points)", "weight": "10%"}], "grading_scale": "A 93-100, A- 90-92, B+ 87-89, B 83-86, B- 80-82, C 70-79, below 70 is not a passing grade in the graduate program.", "policies": [{"title": "Discussion expectations", "body": "Each week you write one initial post of 250 to 350 words by Wednesday 11:59 pm ET and reply to at least two classmates by Sunday 11:59 pm ET (each reply about 75 to 100 words). Initial posts should refer to the week's readings and to your own teaching context. Replies should add to the conversation. Discussions are graded with the Discussion Rubric: initial post (5 points), replies (3 points), writing and citations (2 points). Scores and brief comments appear in Grades about one week after the Sunday deadline."}, {"title": "Late work", "body": "Project assignments lose 10 percent per day late, for up to 3 days. After 3 days they are not accepted unless you have arranged an extension with me before the deadline. Initial discussion posts submitted after Wednesday lose 2 points. Replies are not accepted after Sunday 11:59 pm ET. Because this is an 8-week course, extensions beyond the end of the term are rarely possible."}, {"title": "Feedback and grading", "body": "Assignments and discussions are graded with the posted rubrics. You will see a score for each rubric criterion and a short comment. Project stages are returned within 7 days. The final unit plan is graded within 10 days of the end of the term. Jordan Ellis grades discussion posts under my supervision."}, {"title": "Thanksgiving week (Week 6, Nov 23-29)", "body": "The university is closed Thursday, Nov 26 and Friday, Nov 27. In Week 6 the initial post is due Tuesday, Nov 24 at 11:59 pm ET and replies are due Sunday, Nov 29. There is no project stage due in Week 6."}, {"title": "Student privacy", "body": "Do not post names, photos, work samples, or other identifiable information about your students or colleagues. Describe your students in general terms (for example, 'a 4th grade class of 24 students'). Do not enter student information into any AI tool or website that is not approved by your district."}, {"title": "Accessibility and accommodations", "body": "Hartwell Ridge University is committed to access for all students. Videos in this course have captions and transcripts. If you need an accommodation, contact the Office of Student Access and send me your accommodation letter in the first two weeks of the term."}, {"title": "Academic integrity", "body": "All work you submit must be your own. Cite sources in APA 7 format. Representing someone else's work, or text produced by a tool you have not disclosed, as your own is a violation of the Hartwell Ridge University Academic Integrity Code."}], "ai_policy": "You may use AI tools such as chatbots and writing assistants to brainstorm ideas, check grammar, or get feedback on a draft. You may not submit text generated by AI as your own writing in discussion posts or in the unit plan. If you use an AI tool in any assignment, add a one-sentence note at the end saying which tool you used and what you used it for. Always check AI-produced facts and citations against the original sources, since these tools can invent references. Do not enter student information into AI tools. Work that does not follow this policy will be handled under the Academic Integrity Code.", "weekly_rhythm": "Each week starts on Monday, when I post the Week Overview announcement. Read the assigned materials during the week. Your discussion initial post is due Wednesday at 11:59 pm ET. Replies to two classmates and any project stage are due Sunday at 11:59 pm ET. In Week 6 the initial post moves to Tuesday because of Thanksgiving, and in Week 8 replies are due Friday so that the final unit plan and reflection can be submitted on Sunday, Dec 13. There are no scheduled live sessions."}, "weeks": [{"n": 1, "label": "Week 1", "dates": "Oct 19 - Oct 25", "title": "Why Integrate? TPACK and the ISTE Standards", "overview": "This week introduces the course and the question that runs through it: how do teachers decide when and how technology belongs in a lesson? You will read about the TPACK framework and look over the ISTE Standards for Educators, then introduce yourself and describe one of your own lessons through the TPACK lens.", "objectives": ["Describe the three kinds of knowledge in the TPACK framework and the ways they overlap.", "Identify which ISTE Standards for Educators are most relevant to your current teaching role.", "Analyze one of your own lessons using TPACK language."], "readings": [{"title": "What is technological pedagogical content knowledge?", "source": "Koehler, M. J., & Mishra, P. (2009). Contemporary Issues in Technology and Teacher Education, 9(1).", "url": "https://citejournal.org/volume-9/issue-1-09/general/what-is-technological-pedagogicalcontent-knowledge", "note": "Required. Read the whole article."}, {"title": "ISTE Standards: Educators", "source": "International Society for Technology in Education", "url": "https://iste.org/standards/educators", "note": "Required. Skim all seven standards; read 2.1 Learner, 2.5 Designer, and 2.6 Facilitator closely."}], "media": [{"title": "Welcome to EDTC 520", "kind": "video", "length": "5 min", "note": "Dr. Whitcombe introduces the course and project. Recorded Aug 2025 for the previous offering; captions and transcript available. Fictional course media: no URL."}], "tasks": [{"type": "discussion", "title": "Discussion 1: Introductions and TPACK in My Classroom", "due": "Initial post Wed Oct 21, 11:59 pm ET; two replies Sun Oct 25, 11:59 pm ET", "points": 10, "prompt": "Introduce yourself to the class: your grade level or subject, your school setting, and what technology your students have access to. Then choose one lesson you have taught recently that used technology. Using the TPACK language from Koehler and Mishra (2009), describe how technology, pedagogy, and content knowledge came together (or did not) in that lesson. End with one question you hope this course will help you answer.", "requirements": "Initial post of 250 to 350 words by Wednesday 11:59 pm ET. Reply to at least two classmates by Sunday 11:59 pm ET. Cite the readings in APA 7 format. Graded with the Discussion Rubric.", "post_count": 64, "posts": [{"author": "Sarah K.", "time": "Oct 21, 10:48 pm", "body": "Hi everyone, I'm Sarah. I teach 4th grade at a public elementary school, and this is my fifth course in the program. My students share a cart of Chromebooks with two other classes, and our district uses an adaptive math program that the kids do for 20 minutes a day.\n\nThe lesson I picked was a unit on fractions where I had students use a free online fraction number line. Honestly, the content knowledge and the technology were fine. Where it fell apart was pedagogy: I used the tool as a worksheet on a screen, so the kids clicked through it and I could not tell who understood the equivalence idea. By TPACK I'd say the technology and content overlapped but I skipped the pedagogy piece. I would do it differently by having pairs explain to each other why two fractions land on the same spot.\n\nQuestion for the course: how do I tell, in the moment, whether a tool is helping or just keeping them busy?", "replies": [{"author": "Dana M.", "time": "Oct 22, 8:15 pm", "body": "Great insight, Sarah! I really appreciate how you connected TPACK to your classroom. Thanks for sharing your perspective!"}, {"author": "Tom R.", "time": "Oct 24, 9:30 pm", "body": "Great post, Sarah. I also teach elementary and can relate to this. Thanks for sharing."}]}, {"author": "Marcus L.", "time": "Oct 21, 7:22 pm", "body": "I teach 10th grade chemistry at a suburban high school where every student has a school laptop. For my lesson I used a virtual lab simulation for titration. TPACK helped me see that the simulation was a good fit for the content because students can repeat the experiment as many times as they want, which is not possible with our limited supply of reagents. The pedagogy piece was a guided worksheet with prediction questions. I think the technology was strongest when it supported the pedagogy rather than replacing the real lab entirely. I hope this course will help me think about when a simulation is not enough.", "replies": [{"author": "Sarah K.", "time": "Oct 23, 9:55 pm", "body": "Marcus, I like that you used the simulation for something the real lab could not do. When you say the prediction questions worked, did the students change their predictions after the first run, or mostly stay with their first guess?"}]}, {"author": "Jen W.", "time": "Oct 21, 11:31 pm", "body": "Technology integration is a transformative approach that empowers educators to enhance student engagement and foster 21st-century skills. The TPACK framework provides a comprehensive lens for understanding how technological, pedagogical, and content knowledge intersect in meaningful ways. In my classroom, I have seen how thoughtfully integrated technology can create dynamic learning environments where students are active participants. Moving forward, I am eager to deepen my understanding of how to leverage technology to support diverse learners and improve outcomes. I look forward to learning from my peers throughout this course.", "replies": [{"author": "Beth A.", "time": "Oct 23, 10:02 pm", "body": "Great insight, Jen! I couldn't agree more."}, {"author": "Carla B.", "time": "Oct 25, 4:40 pm", "body": "Great insight, Jen! This is such an important topic for teachers today."}]}]}]}, {"n": 2, "label": "Week 2", "dates": "Oct 26 - Nov 1", "title": "Evaluating Technology Use: Media, Affordances, and SAMR", "overview": "Last week gave us a framework for the knowledge teachers need. This week we look at the tools themselves. Bates introduces the SAMR model (Substitution, Augmentation, Modification, Redefinition) as a way to ask what a technology is adding to a lesson. You will apply SAMR to a tool you use and begin your unit plan project by describing your teaching context and learners.", "objectives": ["Distinguish media from technology and explain what 'affordances' means for classroom tools.", "Classify a classroom use of technology along the SAMR model and justify the classification.", "Describe a unit context and learner profile that will anchor your unit plan."], "readings": [{"title": "Chapter 7: Understanding technology in education (sections 7.1 to 7.4, including 7.4 Assessing media affordances: the SAMR model)", "source": "Bates, A. W. (2019). Teaching in a digital age (2nd ed.). BCcampus.", "url": "https://pressbooks.bccampus.ca/teachinginadigitalagev2/", "note": "Required. Open the book contents and select Chapter 7."}, {"title": "Chapter 8: Pedagogical differences between media (section 8.1)", "source": "Bates, A. W. (2019). Teaching in a digital age (2nd ed.). BCcampus.", "url": "https://pressbooks.bccampus.ca/teachinginadigitalagev2/", "note": "Optional. A short introduction to comparing text, audio, video, and computing."}], "media": [], "tasks": [{"type": "discussion", "title": "Discussion 2: SAMR in Practice", "due": "Initial post Wed Oct 28, 11:59 pm ET; two replies Sun Nov 1, 11:59 pm ET", "points": 10, "prompt": "Choose one technology tool you currently use with students (for example, a learning management system, a quiz app, a video platform, or an adaptive program). Describe how you use it and place that use on the SAMR model, explaining your reasoning with ideas from Bates, Chapter 7. Then describe one change that would move the use up a level, or explain why staying at the current level is the right choice.", "requirements": "Initial post of 250 to 350 words by Wednesday 11:59 pm ET. Reply to at least two classmates by Sunday 11:59 pm ET. Cite the reading in APA 7 format. Graded with the Discussion Rubric.", "post_count": 14, "posts": [{"author": "Priya S.", "time": "Oct 27, 9:12 pm", "body": "The tool I use most is Google Forms for exit tickets in my 8th grade math class. I would place it at Substitution, maybe Augmentation, because it replaces the paper exit ticket and adds automatic scoring of multiple choice items. It does not really change the task. To move it toward Modification I could add a short video response question or ask students to explain a mistake they found in a sample solution. I'm not sure that is always better, though. On most days the quick check is all I need.", "replies": [{"author": "Luis O.", "time": "Oct 28, 7:40 am", "body": "Great insight, Priya! I love how you thought about this. Thanks for sharing."}]}, {"author": "Hannah T.", "time": "Oct 27, 10:05 pm", "body": "In my 2nd grade class we use a read-aloud app where students can record themselves reading and play it back. I think this is Augmentation because the recording adds something the paper version cannot do: kids hear their own fluency and set goals. The limit is that the feedback still comes only from me. Bates's point that technology should be judged by the learning it enables, not by how new it is, fits what I see with my students.", "replies": []}]}, {"type": "assignment", "title": "Project Stage 1: Unit Context and Learner Profile", "due": "Sun Nov 1, 11:59 pm ET", "points": 25, "instructions": "This is the first stage of your technology-integrated unit plan. In 1 to 2 pages, describe: (1) the grade level, subject, and the topic of the unit you will plan (it should be a unit you will actually teach or could teach within the next year); (2) your school or classroom context, including the devices and internet access your students have and any district rules on tools; (3) a learner profile in general terms, including a range of readiness levels, language needs, and any students with IEPs or 504 plans (do not name or identify any students); (4) the length of the unit and where it fits in the school year. Submit as a Word or PDF file through the assignment link.", "rubric": [{"criterion": "Unit topic, grade level, and length are clearly stated", "points": 5}, {"criterion": "Technology access and school context are described accurately and specifically", "points": 8}, {"criterion": "Learner profile covers a range of needs without identifying students", "points": 8}, {"criterion": "Organization, writing, and format", "points": 4}]}]}, {"n": 3, "label": "Week 3", "dates": "Nov 2 - Nov 8", "title": "Designing for All Learners: Universal Design for Learning", "overview": "Technology can remove barriers for students or add new ones. This week we use the CAST UDL Guidelines to look at how a lesson can offer multiple ways to engage, to represent content, and to let students show what they know. You will state the learning goals for your unit and explain the role technology will play in reaching them.", "objectives": ["Describe the three UDL principles: engagement, representation, and action and expression.", "Identify a barrier in a technology-supported lesson and propose a UDL-based solution.", "Write measurable learning goals for your unit and give a TPACK-based rationale for the technology you plan to use."], "readings": [{"title": "Engagement (Guidelines 7-9)", "source": "CAST. (2024). Universal Design for Learning guidelines version 3.0.", "url": "https://udlguidelines.cast.org/engagement/", "note": "Required."}, {"title": "Representation (Guidelines 1-3)", "source": "CAST. (2024). Universal Design for Learning guidelines version 3.0.", "url": "https://udlguidelines.cast.org/representation/", "note": "Required."}, {"title": "Action & Expression (Guidelines 4-6)", "source": "CAST. (2024). Universal Design for Learning guidelines version 3.0.", "url": "https://udlguidelines.cast.org/action-expression/", "note": "Required."}, {"title": "Chapter 6: Building an effective learning environment (sections 6.1 and 6.3, Learner characteristics)", "source": "Bates, A. W. (2019). Teaching in a digital age (2nd ed.). BCcampus.", "url": "https://pressbooks.bccampus.ca/teachinginadigitalagev2/", "note": "Required."}], "media": [], "tasks": [{"type": "discussion", "title": "Discussion 3: Finding the Barrier", "due": "Initial post Wed Nov 4, 11:59 pm ET; two replies Sun Nov 8, 11:59 pm ET", "points": 10, "prompt": "Think of a lesson or activity from your own teaching that uses technology. Using one UDL guideline from the readings, identify a barrier that some students might face in that lesson. Describe a specific change you could make to reduce the barrier and say how you would know if it worked.", "requirements": "Initial post of 250 to 350 words by Wednesday 11:59 pm ET. Reply to at least two classmates by Sunday 11:59 pm ET. Cite the readings in APA 7 format. Graded with the Discussion Rubric. The sample posts below are from the Summer 2026 section and are kept as examples.", "post_count": 58, "posts": [{"author": "Nia J.", "time": "Aug 12, 9:47 pm", "body": "In my 6th grade ELA class I use a website for weekly vocabulary practice. The barrier I notice is under Guideline 2, Language and Symbols: the definitions on the site are written at a level above what my English learners can read, so they guess instead of learn. I could add picture supports and allow students to choose a home-language translation. I would know it worked if their scores on the weekly check go up and if they stop skipping the practice.", "replies": [{"author": "Greg P.", "time": "Aug 14, 8:10 pm", "body": "Great insight, Nia! This is such an important point."}]}, {"author": "Erin D.", "time": "Aug 12, 11:20 pm", "body": "UDL is a powerful framework for ensuring that every learner has access to meaningful learning experiences. By providing multiple means of engagement, representation, and action and expression, teachers can reduce barriers and support all students. In my classroom, I plan to offer more choices in how students demonstrate understanding. This will help create an inclusive environment where all learners can succeed.", "replies": [{"author": "Kara H.", "time": "Aug 15, 6:22 pm", "body": "Great insight, Erin! I really appreciate your perspective on this."}, {"author": "Omar F.", "time": "Aug 16, 7:05 pm", "body": "Great post! I agree with everything you said."}]}, {"author": "Alyssa V.", "time": "Aug 13, 10:31 pm", "body": "Our adaptive math program has a timer on each problem. For my students who need extra processing time, that is a barrier under Guideline 8, Sustaining Effort and Persistence: the timer turns practice into stress. The setting can be turned off in the teacher dashboard, but I only found it last week. I now turn it off for the whole class and have noticed students stay with a hard problem longer. I'm not sure what else I may be missing in settings I have never opened.", "replies": [{"author": "Will C.", "time": "Aug 16, 9:48 pm", "body": "Great insight, Alyssa! Thanks for sharing your experience."}]}]}, {"type": "assignment", "title": "Project Stage 2: Learning Goals and Technology Rationale", "due": "Sun Nov 8, 11:59 pm ET", "points": 25, "instructions": "In 2 to 3 pages, write: (1) three to five measurable learning goals for your unit, aligned to your state or district standards (cite the standard codes); (2) a short rationale, using TPACK language, for how technology will support those goals (name the types of tools you are considering and what each one does for the content and the pedagogy); (3) one UDL consideration for each learning goal. Use APA 7 format for any citations. Submit as a Word or PDF file through the assignment link.", "rubric": [{"criterion": "Learning goals are measurable and aligned to named standards", "points": 8}, {"criterion": "Technology rationale uses TPACK concepts and connects to the goals", "points": 8}, {"criterion": "UDL considerations are specific and realistic for your learners", "points": 6}, {"criterion": "Writing, citations, and format", "points": 3}]}]}, {"n": 4, "label": "Week 4", "dates": "Nov 9 - Nov 15", "title": "Choosing Tools: Selection Criteria, Access, and Privacy", "overview": "Teachers often get tools chosen for them, or are left to choose from hundreds of options. This week we use Bates's SECTIONS model (Students, Ease of use, Cost, Teaching, Interaction, Organizational issues, Networking, Security and privacy) to compare tools. You will also design the sequence of learning activities for your unit.", "objectives": ["Apply the SECTIONS criteria to compare two or more technology options for a specific lesson.", "Explain how cost, access, and privacy affect tool choice in a K-12 setting.", "Sequence learning activities for your unit and match each to a tool and a UDL support."], "readings": [{"title": "Chapter 9: Choosing and using media in education: the SECTIONS model (sections 9.1 to 9.4 and 9.9)", "source": "Bates, A. W. (2019). Teaching in a digital age (2nd ed.). BCcampus.", "url": "https://pressbooks.bccampus.ca/teachinginadigitalagev2/", "note": "Required. Section 9.9 covers security and privacy."}, {"title": "ISTE Standards: Educators, 2.3 Citizen", "source": "International Society for Technology in Education", "url": "https://iste.org/standards/educators", "note": "Required. Read the indicators under 2.3 on digital citizenship and student data."}], "media": [], "tasks": [{"type": "discussion", "title": "Discussion 4: Comparing Two Tools with SECTIONS", "due": "Initial post Wed Nov 11, 11:59 pm ET; two replies Sun Nov 15, 11:59 pm ET", "points": 10, "prompt": "Pick a task you want students to do (for example, collaborate on a writing project, practice math facts, or present research). Name two tools that could support it. Compare them using at least four of the SECTIONS criteria and explain which you would choose and why. Mention one privacy or access question you would need to answer before using either tool with your students.", "requirements": "Initial post of 250 to 350 words by Wednesday 11:59 pm ET. Reply to at least two classmates by Sunday 11:59 pm ET. Cite Bates in APA 7 format. Graded with the Discussion Rubric. The sample posts below are from the Summer 2026 section and are kept as examples.", "post_count": 61, "posts": [{"author": "Will C.", "time": "Aug 19, 9:03 pm", "body": "My task is peer feedback on 5th grade narrative writing. The two options are Google Docs with comments and a district-licensed writing platform. On Students and Ease of use, Docs wins, since the kids have used it since 3rd grade. On Cost, both are free to me. On Security and privacy, the platform is approved by the district and Docs is approved only for staff. Before I use Docs for peer feedback I need to find out whether our district allows student accounts to share documents with each other. I'll probably email our tech coordinator.", "replies": [{"author": "Joy N.", "time": "Aug 21, 7:15 pm", "body": "Great insight, Will! Thanks for sharing."}, {"author": "Anika V.", "time": "Aug 22, 10:40 pm", "body": "Will, in our district the rule is that only accounts under the district domain can share. It might be worth asking before you build the lesson around it."}]}, {"author": "Ruth Q.", "time": "Aug 19, 11:44 pm", "body": "Choosing the right technology tool requires careful consideration of multiple factors. The SECTIONS model offers a helpful structure for evaluating options. For my lesson, I compared two presentation tools and found that both had strengths and limitations. Ultimately, I would choose the tool that best aligns with my learning goals while ensuring student privacy and accessibility. Using a structured model like SECTIONS can help teachers make more informed decisions.", "replies": [{"author": "Megan Z.", "time": "Aug 22, 8:20 pm", "body": "Great insight, Ruth! I couldn't agree more."}]}]}, {"type": "assignment", "title": "Project Stage 3: Activity Sequence and Tool Selection", "due": "Sun Nov 15, 11:59 pm ET", "points": 25, "instructions": "In 2 to 3 pages, present the sequence of learning activities for your unit in a table with these columns: lesson or day, learning goal addressed, what students do, tool or technology used, UDL support. Include at least one activity in which students create something with technology, not only consume content. Below the table, write a half-page SECTIONS analysis of the main tool you plan to use, including one privacy or access issue and how you will handle it. Submit as a Word or PDF file through the assignment link.", "rubric": [{"criterion": "Activities are clearly sequenced and aligned to the Stage 2 learning goals", "points": 8}, {"criterion": "Tool choices are justified and each activity includes a UDL support", "points": 7}, {"criterion": "SECTIONS analysis addresses cost, access, and privacy specifically", "points": 7}, {"criterion": "Writing, citations, and format", "points": 3}]}]}, {"n": 5, "label": "Week 5", "dates": "Nov 16 - Nov 22", "title": "Assessment and Feedback with Technology", "overview": "This week we look at how technology can support formative assessment and student feedback, using Bates's discussion of assessment of learning and the U.S. Department of Education's report on formative assessment and AI. You will plan how your unit will check for understanding and what students will do to show what they have learned.", "objectives": ["Distinguish formative from summative assessment and give examples of each that use technology.", "Evaluate the strengths and risks of automated feedback in K-12 classrooms.", "Create an assessment plan for your unit with at least two formative checks and one summative task."], "readings": [{"title": "Formative Assessment (pp. 37-43)", "source": "U.S. Department of Education, Office of Educational Technology. (2023). Artificial intelligence and the future of teaching and learning: Insights and recommendations.", "url": "https://www2.ed.gov/documents/ai-report/ai-report.pdf", "note": "Required. Printed page numbers; the PDF page is about 4 higher."}, {"title": "Chapter 6: Building an effective learning environment (section 6.8 Assessment of learning)", "source": "Bates, A. W. (2019). Teaching in a digital age (2nd ed.). BCcampus.", "url": "https://pressbooks.bccampus.ca/teachinginadigitalagev2/", "note": "Required."}], "media": [{"title": "Week 5 narrated slides: Technology-supported assessment", "kind": "slides", "length": "11 min", "note": "Recorded Aug 2025; captions and transcript available. Fictional course media: no URL."}], "tasks": [{"type": "discussion", "title": "Discussion 5: Feedback That Helps", "due": "Initial post Wed Nov 18, 11:59 pm ET; two replies Sun Nov 22, 11:59 pm ET", "points": 10, "prompt": "Describe one way you currently use technology to give students feedback or check their understanding. Using the Department of Education report (pp. 37-43), discuss one opportunity and one risk of automated feedback for your students. What would you want to keep in human hands?", "requirements": "Initial post of 250 to 350 words by Wednesday 11:59 pm ET. Reply to at least two classmates by Sunday 11:59 pm ET. Cite the report in APA 7 format. Graded with the Discussion Rubric. The sample posts below are from the Summer 2026 section and are kept as examples.", "post_count": 60, "posts": [{"author": "Omar F.", "time": "Aug 26, 9:25 pm", "body": "I use an online quiz tool with instant scoring in my middle school science class. The report says AI can enhance feedback loops, and I see this: students get an answer right away and can try again. The risk I see is in the automated essay scoring example on p. 40. My students write short explanations, and a scoring tool could mark a correct idea wrong if the wording is unusual, especially for my English learners. I would keep the final judgment on written explanations with me and use the tool only for multiple choice checks.", "replies": [{"author": "Nia J.", "time": "Aug 28, 8:00 pm", "body": "Omar, your point about English learners is one I had not thought about. Do you let students see why an item was marked wrong, or only the score?"}, {"author": "Greg P.", "time": "Aug 29, 9:12 pm", "body": "Great insight, Omar! Thanks for sharing your thoughts."}]}, {"author": "Joy N.", "time": "Aug 26, 11:52 pm", "body": "Formative assessment is an essential part of effective teaching. Technology can provide timely and personalized feedback that helps students grow. However, it is important to consider the risks of relying too heavily on automated systems. Teachers should remain at the center of the learning process and use technology as a tool to support, not replace, their professional judgment.", "replies": [{"author": "Devon T.", "time": "Aug 29, 7:30 pm", "body": "Great insight, Joy! I completely agree."}]}]}, {"type": "assignment", "title": "Project Stage 4: Assessment Plan", "due": "Sun Nov 22, 11:59 pm ET", "points": 25, "instructions": "In 2 to 3 pages, describe how you will assess student learning in your unit. Include: (1) at least two formative checks, with the tool used and what you will do with the results; (2) one summative task or product, with a rubric or scoring guide (a short version is fine); (3) how the assessment is aligned to each Stage 2 learning goal; (4) one accommodation or choice you will offer in how students show what they know. If you plan to use any automated or AI-based feedback tool, say what you will check by hand. Submit as a Word or PDF file through the assignment link.", "rubric": [{"criterion": "Formative and summative assessments are aligned to the learning goals", "points": 9}, {"criterion": "Use of technology in assessment is justified and the role of the teacher is clear", "points": 6}, {"criterion": "Summative rubric or scoring guide is usable and specific", "points": 6}, {"criterion": "Writing, citations, and format", "points": 4}]}]}, {"n": 6, "label": "Week 6", "dates": "Nov 23 - Nov 29 (Thanksgiving week)", "title": "AI in K-12 Classrooms: Opportunities and Cautions", "overview": "Artificial intelligence is now part of many of the tools teachers use. This week we read the U.S. Department of Education's overview of AI in teaching and learning and discuss what teachers should expect from AI tools before using them with students. Because of Thanksgiving, the initial post is due Tuesday and there is no project stage due this week. Use the time to review your Stage 1 to 4 feedback.", "objectives": ["Summarize the report's main points about the roles of teachers and AI in instruction.", "Explain what it means for an AI tool to be inspectable, explainable, and overridable.", "Develop a short list of questions you would ask before using an AI tool with students."], "readings": [{"title": "Introduction (pp. 1-10)", "source": "U.S. Department of Education, Office of Educational Technology. (2023). Artificial intelligence and the future of teaching and learning: Insights and recommendations.", "url": "https://www2.ed.gov/documents/ai-report/ai-report.pdf", "note": "Required."}, {"title": "Teaching (pp. 25-35)", "source": "U.S. Department of Education, Office of Educational Technology. (2023). Artificial intelligence and the future of teaching and learning: Insights and recommendations.", "url": "https://www2.ed.gov/documents/ai-report/ai-report.pdf", "note": "Required."}, {"title": "Chapter 8: Pedagogical differences between media (section 8.7c Emerging technologies: artificial intelligence)", "source": "Bates, A. W. (2019). Teaching in a digital age (2nd ed.). BCcampus.", "url": "https://pressbooks.bccampus.ca/teachinginadigitalagev2/", "note": "Optional. Written in 2019, so read it as background."}], "media": [], "tasks": [{"type": "discussion", "title": "Discussion 6: Questions Worth Asking About AI", "due": "Initial post Tue Nov 24, 11:59 pm ET; two replies Sun Nov 29, 11:59 pm ET", "points": 10, "prompt": "The report describes questions worth asking about AI for teaching (p. 34) and a key recommendation of AI that is inspectable, explainable, and overridable. Choose an AI feature in a tool you use or have been offered (such as a lesson planner, a feedback assistant, or an adaptive program). Apply two or three of the report's ideas to that feature. What would you want to know about it before using it with students?", "requirements": "Initial post of 250 to 350 words by Tuesday 11:59 pm ET. Reply to at least two classmates by Sunday 11:59 pm ET. Cite the report in APA 7 format. Graded with the Discussion Rubric. Do not enter student information into AI tools."}]}, {"n": 7, "label": "Week 7", "dates": "Nov 30 - Dec 6", "title": "Putting It Into Practice: Supports, Barriers, and Your Draft Unit Plan", "overview": "A strong plan still has to work in a real school. This week we look at what teachers and schools need in order to sustain technology integration (training, support, and time), and you will submit a complete draft of your unit plan for feedback.", "objectives": ["Identify supports and barriers that affect technology integration in your school.", "Describe your own role as a leader or collaborator in integration, using the ISTE Standards.", "Assemble a complete draft unit plan from Stages 1 to 4 and revise it in response to feedback."], "readings": [{"title": "ISTE Standards: Educators, 2.2 Leader and 2.4 Collaborator", "source": "International Society for Technology in Education", "url": "https://iste.org/standards/educators", "note": "Required."}, {"title": "Chapter 13: Supporting teachers and instructors in a digital age (sections 13.1 to 13.3)", "source": "Bates, A. W. (2019). Teaching in a digital age (2nd ed.). BCcampus.", "url": "https://pressbooks.bccampus.ca/teachinginadigitalagev2/", "note": "Required. Written about higher education; read with K-12 schools in mind."}], "media": [], "tasks": [{"type": "discussion", "title": "Discussion 7: What My School Needs", "due": "Initial post Wed Dec 2, 11:59 pm ET; two replies Sun Dec 6, 11:59 pm ET", "points": 10, "prompt": "Think about the technology plan in your unit. What would your school or district need to provide for it to work (devices, training, time, policies, support staff)? Which of those could you change yourself, and which are out of your control? Connect your answer to the ISTE Standards and to Bates, Chapter 13.", "requirements": "Initial post of 250 to 350 words by Wednesday 11:59 pm ET. Reply to at least two classmates by Sunday 11:59 pm ET. Cite the readings in APA 7 format. Graded with the Discussion Rubric."}, {"type": "assignment", "title": "Draft Unit Plan", "due": "Sun Dec 6, 11:59 pm ET", "points": 50, "instructions": "Submit a complete draft of your technology-integrated unit plan (about 8 to 10 pages) that combines your revised Stages 1 to 4: context and learner profile, learning goals and technology rationale, activity sequence with tools and UDL supports, and the assessment plan. Add a one-page implementation section covering the supports you will need (from Discussion 7) and a plan for what you will do if the technology fails on the day. Use APA 7 format for citations and include a reference list. Submit as a Word or PDF file through the assignment link. I will return the draft with comments within 7 days.", "rubric": [{"criterion": "All four stages are included and revised in response to earlier feedback", "points": 15}, {"criterion": "Parts of the plan are consistent with each other (goals, activities, assessment)", "points": 12}, {"criterion": "Implementation section is realistic and specific", "points": 10}, {"criterion": "Use of course frameworks (TPACK, SAMR, SECTIONS, UDL, ISTE)", "points": 8}, {"criterion": "Writing, citations, and format", "points": 5}]}]}, {"n": 8, "label": "Week 8", "dates": "Dec 7 - Dec 13", "title": "Evaluate and Refine: Final Unit Plan", "overview": "In the last week you finish your unit plan and reflect on what you have learned. We also look at how teachers can evaluate whether a technology-integrated unit worked and what to change next time. Replies to the final discussion are due Friday so that everyone can focus on the final submission on Sunday.", "objectives": ["Describe how you would evaluate the success of your unit after teaching it.", "Revise your unit plan using instructor feedback and course frameworks.", "Reflect on how your thinking about technology integration has changed during the course."], "readings": [{"title": "Chapter 12: Ensuring quality teaching in a digital age (section 12.11 Step nine: evaluate and innovate)", "source": "Bates, A. W. (2019). Teaching in a digital age (2nd ed.). BCcampus.", "url": "https://pressbooks.bccampus.ca/teachinginadigitalagev2/", "note": "Required."}, {"title": "What is technological pedagogical content knowledge?", "source": "Koehler, M. J., & Mishra, P. (2009). Contemporary Issues in Technology and Teacher Education, 9(1).", "url": "https://citejournal.org/volume-9/issue-1-09/general/what-is-technological-pedagogicalcontent-knowledge", "note": "Re-read from Week 1. Notice what has changed in how you read it."}, {"title": "Recommendations (pp. 52-60)", "source": "U.S. Department of Education, Office of Educational Technology. (2023). Artificial intelligence and the future of teaching and learning: Insights and recommendations.", "url": "https://www2.ed.gov/documents/ai-report/ai-report.pdf", "note": "Optional."}], "media": [], "tasks": [{"type": "discussion", "title": "Discussion 8: Unit Summary and Evaluation Plan", "due": "Initial post Wed Dec 9, 11:59 pm ET; two replies Fri Dec 11, 11:59 pm ET", "points": 10, "prompt": "Share a short summary of your unit (topic, grade level, main technology, and what students will produce). Then explain how you would evaluate after teaching it whether the technology helped students learn: what evidence you would collect and what result would make you change the plan. Read at least two classmates' summaries and reply with a question or suggestion.", "requirements": "Initial post of 250 to 350 words by Wednesday 11:59 pm ET. Reply to at least two classmates by Friday 11:59 pm ET. Graded with the Discussion Rubric."}, {"type": "assignment", "title": "Final Unit Plan", "due": "Sun Dec 13, 11:59 pm ET", "points": 100, "instructions": "Submit the final version of your technology-integrated unit plan (about 10 to 12 pages plus references), revised using the comments on your draft. The plan should include: context and learner profile; learning goals and standards; technology rationale (TPACK); activity sequence with tools, SAMR level for each major tool use, and UDL supports; assessment plan; implementation and evaluation plan. Use APA 7 format. Submit as a Word or PDF file through the assignment link. Grades and rubric comments are posted within 10 days of the end of the term.", "rubric": [{"criterion": "Learning goals, activities, and assessment are aligned", "points": 20}, {"criterion": "Technology choices are justified with TPACK, SAMR, and SECTIONS", "points": 20}, {"criterion": "UDL supports and attention to access and privacy", "points": 15}, {"criterion": "Assessment plan with usable rubric", "points": 15}, {"criterion": "Implementation and evaluation plan", "points": 15}, {"criterion": "Revision in response to draft feedback", "points": 5}, {"criterion": "Writing, citations, and format", "points": 10}]}, {"type": "assignment", "title": "Final Reflection", "due": "Sun Dec 13, 11:59 pm ET", "points": 20, "instructions": "Write a reflection of 500 to 600 words on what you learned in this course. Describe how your thinking about technology integration changed, which course idea (TPACK, SAMR, SECTIONS, UDL, or a point about AI) you expect to use first in your own classroom, and one question you still have. Submit as a Word or PDF file through the assignment link.", "rubric": [{"criterion": "Specific description of how your thinking changed, with examples from the course", "points": 8}, {"criterion": "Connection to your own teaching context", "points": 6}, {"criterion": "Clarity and organization", "points": 6}]}]}], "sources_checked": [{"url": "https://citejournal.org/volume-9/issue-1-09/general/what-is-technological-pedagogicalcontent-knowledge", "checked": "2026-10-28", "how": "WebFetch: title 'What Is Technological Pedagogical Content Knowledge?', Koehler and Mishra, vol. 9 issue 1 (2009), full text open. Page range not shown on the page, so left out of the citation."}, {"url": "https://udlguidelines.cast.org/", "checked": "2026-10-28", "how": "WebFetch: page loaded, CAST UDL Guidelines version 3.0 (2024)."}, {"url": "https://udlguidelines.cast.org/engagement/", "checked": "2026-10-28", "how": "WebFetch: page title 'Engagement | CAST UDL Guidelines', Guidelines 7-9."}, {"url": "https://udlguidelines.cast.org/representation/", "checked": "2026-10-28", "how": "WebFetch: page title 'Representation', Guidelines 1-3."}, {"url": "https://udlguidelines.cast.org/action-expression/", "checked": "2026-10-28", "how": "WebFetch: page title 'Action & Expression | CAST UDL Guidelines', Guidelines 4-6."}, {"url": "https://iste.org/standards/educators", "checked": "2026-10-28", "how": "WebFetch: page title 'ISTE | 2. Educators', standards 2.1 Learner to 2.7 Analyst viewable without login; PDF download asks for an email."}, {"url": "https://pressbooks.bccampus.ca/teachinginadigitalagev2/", "checked": "2026-10-28", "how": "Direct WebFetch and curl returned 403 (Cloudflare bot check). Verified through a Wayback Machine capture (Dec 18, 2024): title 'Teaching in a Digital Age - Second Edition', author A.W. (Tony) Bates, released Oct 10, 2019, chapter list read from the page. The 2022 3rd edition is mentioned there. Also confirmed the first edition site at https://opentextbc.ca/teachinginadigitalage/ by WebFetch, which names the second edition at this URL."}, {"url": "https://www2.ed.gov/documents/ai-report/ai-report.pdf", "checked": "2026-10-28", "how": "Direct WebFetch and curl returned 403 (ed.gov web firewall blocks automated requests). Verified through a Wayback Machine capture of this URL (Jan 2025): 71-page PDF titled 'Artificial Intelligence and the Future of Teaching and Learning: Insights and Recommendations', May 2023, Office of Educational Technology. Table of contents read for page ranges (Introduction p. 1, Teaching p. 25, Formative Assessment p. 37, Recommendations p. 52). Loads in a normal browser; not tested here in a browser."}, {"url": "https://edtechbooks.org/k12handbook", "checked": "2026-10-28", "how": "Not used. Direct WebFetch and curl returned 403 (bot check); the Wayback capture is a JavaScript shell with only the title 'EdTech Books', so the handbook title and chapters could not be verified."}]}</script>
<script>
(function () {
  var C = JSON.parse(document.getElementById("data").textContent);
  var main = document.getElementById("main");
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); };
  var paras = function (s) { return String(s || "").split(/\n\s*\n/).map(function (p) { return "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>"; }).join(""); };
  var weekName = function (w) { return esc(w.label || ("Week " + w.n)); };
  var TYPE = { quiz: "Quiz", discussion: "Discussion", assignment: "Assignment", code_check: "Code check" };

  document.getElementById("site").textContent = C.site_name || "CourseSpace";
  document.getElementById("crumb").textContent = C.code + " · " + C.title + " · " + C.term;

  var NAV = [["home","Home"],["announcements","Announcements"],["syllabus","Syllabus"],["modules","Modules"],["discussions","Discussions"],["quizzes","Quizzes"],["people","People"]];
  var hasQuiz = C.weeks.some(function (w) { return (w.tasks || []).some(function (t) { return t.type === "quiz"; }); });
  var hasDisc = C.weeks.some(function (w) { return (w.tasks || []).some(function (t) { return t.type === "discussion"; }); });
  NAV = NAV.filter(function (n) { return (n[0] !== "quizzes" || hasQuiz) && (n[0] !== "discussions" || hasDisc); });
  document.getElementById("nav").innerHTML = '<div class="cname">' + esc(C.code) + "<br>" + esc(C.title) + "</div>" +
    NAV.map(function (n) { return '<a href="#' + n[0] + '" data-v="' + n[0] + '">' + n[1] + "</a>"; }).join("");

  function allTasks(type) {
    var out = [];
    C.weeks.forEach(function (w) { (w.tasks || []).forEach(function (t, i) { if (!type || t.type === type) out.push({ w: w, t: t, i: i }); }); });
    return out;
  }
  function taskLine(w, t) {
    return '<span class="pill' + (t.type === "quiz" ? " k-quiz" : "") + '">' + (TYPE[t.type] || t.type) + "</span> " +
      '<a href="#week' + w.n + '">' + esc(t.title) + "</a>" +
      (t.due ? ' <span class="meta">· Due ' + esc(t.due) + "</span>" : "") + (t.points != null ? ' <span class="meta">· ' + esc(t.points) + " pts</span>" : "");
  }

  var V = {};
  V.home = function () {
    var a = (C.announcements || [])[0];
    return "<h1>" + esc(C.title) + "</h1><p class=\"sub\">" + esc(C.code) + " · " + esc(C.institution) + " · " + esc(C.program || "") + "</p>" +
      '<div class="stack"><div class="card">' + paras(C.home_message) + '<p class="meta">— ' + esc(C.instructor.name) + "</p></div>" +
      (a ? '<div class="card"><div class="label">Latest announcement</div><h3>' + esc(a.title) + '</h3><p class="meta">' + esc(a.date) + " · " + esc(a.author) + "</p>" + paras(a.body) + '<a href="#announcements">All announcements</a></div>' : "") +
      '<div class="card"><div class="label">Course at a glance</div><ul class="plain">' +
      "<li>" + esc(C.format) + "</li><li>" + esc(C.enrollment) + "</li><li>Instructor: " + esc(C.instructor.name) + "</li></ul>" +
      '<p style="margin-top:10px"><a href="#modules">Go to Modules</a> · <a href="#syllabus">Read the syllabus</a></p></div></div>';
  };
  V.announcements = function () {
    var list = C.announcements || [];
    return "<h1>Announcements</h1><p class=\"sub\">" + list.length + " posted</p><div class=\"card\">" +
      list.map(function (a) { return '<div class="ann"><h3>' + esc(a.title) + '</h3><p class="meta">' + esc(a.date) + " · " + esc(a.author) + "</p>" + paras(a.body) + "</div>"; }).join("") + "</div>";
  };
  V.syllabus = function () {
    var S = C.syllabus, I = C.instructor;
    var h = "<h1>Syllabus</h1><p class=\"sub\">" + esc(C.code) + " · " + esc(C.title) + " · " + esc(C.term) + "</p><div class=\"stack\">";
    h += '<div class="card"><h2 style="margin-top:0">Course description</h2>' + paras(S.description) + "<p class=\"meta\">" + esc(C.format) + " · " + esc(C.enrollment) + "</p></div>";
    h += '<div class="card"><h2 style="margin-top:0">Instructor</h2><ul class="plain"><li><strong>' + esc(I.name) + "</strong>, " + esc(I.title) + "</li><li>Email: " + esc(I.email) + "</li><li>Office hours: " + esc(I.office_hours) + "</li><li>Response time: " + esc(I.response_time) + "</li></ul>" +
      ((C.staff || []).length ? "<h3>Course staff</h3><ul class=\"plain\">" + C.staff.map(function (s) { return "<li>" + esc(s.name) + ", " + esc(s.role) + (s.email ? " · " + esc(s.email) : "") + "</li>"; }).join("") + "</ul>" : "") + "</div>";
    h += '<div class="card"><h2 style="margin-top:0">Learning outcomes</h2><ul>' + S.outcomes.map(function (o) { return "<li>" + esc(o) + "</li>"; }).join("") + "</ul></div>";
    h += '<div class="card"><h2 style="margin-top:0">Course materials</h2><ul>' + S.materials.map(function (m) { return "<li>" + esc(m.citation) + (m.url ? ' <a href="' + esc(m.url) + '" target="_blank" rel="noopener">' + esc(m.url) + "</a>" : "") + (m.note ? ' <span class="meta">(' + esc(m.note) + ")</span>" : "") + "</li>"; }).join("") + "</ul></div>";
    h += '<div class="card"><h2 style="margin-top:0">How a week works</h2>' + paras(S.weekly_rhythm) + "</div>";
    h += '<div class="card"><h2 style="margin-top:0">Grading</h2><div class="tablewrap"><table><tr><th>Component</th><th>Weight</th></tr>' + S.grading.map(function (g) { return "<tr><td>" + esc(g.item) + '</td><td class="num">' + esc(g.weight) + "</td></tr>"; }).join("") + "</table></div>" + (S.grading_scale ? '<p class="meta" style="margin-top:8px">' + esc(S.grading_scale) + "</p>" : "") + "</div>";
    h += '<div class="card"><h2 style="margin-top:0">Policies</h2>' + S.policies.map(function (p) { return "<h3>" + esc(p.title) + "</h3>" + paras(p.body); }).join("") + "<h3>Use of AI tools</h3>" + paras(S.ai_policy) + "</div>";
    h += '<div class="card"><h2 style="margin-top:0">Schedule</h2><div class="tablewrap"><table><tr><th>' + (C.weeks[0] && C.weeks[0].dates ? "Week" : "Module") + "</th>" + (C.weeks[0] && C.weeks[0].dates ? "<th>Dates</th>" : "") + "<th>Topic</th><th>Due</th></tr>" +
      C.weeks.map(function (w) { return "<tr><td class=\"num\"><a href=\"#week" + w.n + "\">" + weekName(w) + "</a></td>" + (w.dates ? '<td class="num">' + esc(w.dates) + "</td>" : "") + "<td>" + esc(w.title) + "</td><td>" + (w.tasks || []).map(function (t) { return esc(t.title); }).join("<br>") + "</td></tr>"; }).join("") + "</table></div></div>";
    return h + "</div>";
  };
  V.modules = function () {
    return "<h1>Modules</h1><p class=\"sub\">" + C.weeks.length + " modules · open one to see its pages</p><div class=\"stack\">" + C.weeks.map(function (w) {
      var items = '<div class="item"><span class="ic"><span class="pill">Page</span></span><span class="t"><a href="#week' + w.n + '">Overview: ' + esc(w.title) + "</a></span></div>";
      (w.readings || []).forEach(function (r) { items += '<div class="item"><span class="ic"><span class="pill">Reading</span></span><span class="t"><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.title) + "</a></span></div>"; });
      (w.media || []).forEach(function (m) { items += '<div class="item"><span class="ic"><span class="pill">' + esc(m.kind || "Media") + '</span></span><span class="t">' + esc(m.title) + ' <span class="meta">· ' + esc(m.length || "") + "</span></span></div>"; });
      (w.tasks || []).forEach(function (t) { items += '<div class="item"><span class="ic"></span><span class="t">' + taskLine(w, t) + "</span></div>"; });
      return '<section class="module"><a class="mh" href="#week' + w.n + '"><strong>' + weekName(w) + ": " + esc(w.title) + '</strong><span class="meta">' + esc(w.dates || "") + "</span></a>" + items + "</section>";
    }).join("") + "</div>";
  };
  function renderTask(w, t, i) {
    var id = "w" + w.n + "t" + i;
    var h = '<div class="card" id="' + id + '"><div class="row"><span class="pill' + (t.type === "quiz" ? " k-quiz" : "") + '">' + (TYPE[t.type] || t.type) + "</span>" +
      (t.due ? '<span class="meta">Due ' + esc(t.due) + "</span>" : "") + (t.points != null ? '<span class="meta">· ' + esc(t.points) + " points</span>" : "") + "</div><h3>" + esc(t.title) + "</h3>";
    if (t.settings) h += '<p class="meta">' + esc(t.settings) + "</p>";
    if (t.type === "quiz") {
      h += '<form class="quiz" data-w="' + w.n + '" data-i="' + i + '">' + (t.questions || []).map(function (q, qi) {
        return '<div class="q"><div><strong>' + (qi + 1) + ".</strong> " + esc(q.q) + "</div>" + q.options.map(function (o, oi) {
          var oid = id + "q" + qi + "o" + oi;
          return '<label for="' + oid + '"><input type="radio" id="' + oid + '" name="' + id + "q" + qi + '" value="' + oi + '"> <span>' + esc(o) + "</span></label>";
        }).join("") + '<div class="fb" aria-live="polite"></div></div>';
      }).join("") + '<div class="row" style="margin-top:10px"><button class="btn" type="submit">Submit quiz</button><button class="btn ghost" type="reset">Clear</button><span class="meta score" aria-live="polite"></span></div></form>';
    }
    if (t.type === "discussion") {
      h += '<div class="label" style="margin-top:6px">Prompt</div>' + paras(t.prompt) + '<div class="label">Requirements</div>' + paras(t.requirements);
      if (t.post_count != null) h += '<p class="meta">' + esc(t.post_count) + " posts in this discussion" + ((t.posts || []).length ? " · showing " + t.posts.length : "") + "</p>";
      (t.posts || []).forEach(function (p) {
        h += '<div class="post"><div><span class="who">' + esc(p.author) + '</span> <span class="meta">· ' + esc(p.time) + "</span></div>" + paras(p.body) +
          (p.replies || []).map(function (r) { return '<div class="post reply"><div><span class="who">' + esc(r.author) + '</span> <span class="meta">· ' + esc(r.time) + "</span></div>" + paras(r.body) + "</div>"; }).join("") + "</div>";
      });
    }
    if (t.type === "assignment") {
      h += paras(t.instructions);
      if ((t.rubric || []).length) h += '<div class="tablewrap"><table><tr><th>Criterion</th><th>Points</th></tr>' + t.rubric.map(function (r) { return "<tr><td>" + esc(r.criterion) + '</td><td class="num">' + esc(r.points) + "</td></tr>"; }).join("") + "</table></div>";
    }
    if (t.type === "code_check") {
      h += paras(t.instructions);
      if (t.starter_code) h += '<div class="label">Starter code</div><pre><code>' + esc(t.starter_code) + "</code></pre>";
      if ((t.tests || []).length) h += '<div class="label">The autograder checks</div><ul>' + t.tests.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
    }
    return h + "</div>";
  }
  function weekView(n) {
    var idx = C.weeks.findIndex(function (w) { return String(w.n) === String(n); });
    if (idx < 0) return V.modules();
    var w = C.weeks[idx], prev = C.weeks[idx - 1], next = C.weeks[idx + 1];
    var h = '<p class="meta"><a href="#modules">Modules</a> › ' + weekName(w) + "</p><h1>" + weekName(w) + ": " + esc(w.title) + "</h1><p class=\"sub\">" + esc(w.dates || "Self-paced") + "</p><div class=\"stack\">";
    h += '<div class="card"><h2 style="margin-top:0">Overview</h2>' + paras(w.overview) + ((w.objectives || []).length ? "<h3>This week you will</h3><ul>" + w.objectives.map(function (o) { return "<li>" + esc(o) + "</li>"; }).join("") + "</ul>" : "") + "</div>";
    if ((w.readings || []).length) h += '<div class="card"><h2 style="margin-top:0">Readings</h2><ul>' + w.readings.map(function (r) { return '<li><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.title) + "</a> <span class=\"meta\">· " + esc(r.source) + (r.note ? " · " + esc(r.note) : "") + "</span></li>"; }).join("") + "</ul></div>";
    if ((w.media || []).length) h += '<div class="card"><h2 style="margin-top:0">Watch / listen</h2><div class="stack">' + w.media.map(function (m) { return '<div class="media"><span class="play" aria-hidden="true">▶</span><div style="min-width:0"><strong>' + esc(m.title) + '</strong><div class="meta">' + esc([m.kind, m.length, m.note].filter(Boolean).join(" · ")) + "</div></div></div>"; }).join("") + "</div></div>";
    (w.tasks || []).forEach(function (t, i) { h += renderTask(w, t, i); });
    h += "</div><div class=\"pager\">" + (prev ? '<a href="#week' + prev.n + '">← ' + weekName(prev) + "</a>" : "<span></span>") + (next ? '<a href="#week' + next.n + '">' + weekName(next) + " →</a>" : "") + "</div>";
    return h;
  }
  function listView(type, title, sub) {
    var rows = allTasks(type);
    return "<h1>" + title + "</h1><p class=\"sub\">" + sub + "</p><div class=\"card\"><div class=\"tablewrap\"><table><tr><th>" + (C.weeks[0] && C.weeks[0].dates ? "Week" : "Module") + "</th><th>Title</th><th>Due</th>" + (type === "discussion" ? "<th>Posts</th>" : "<th>Points</th>") + "</tr>" +
      rows.map(function (r) { return '<tr><td class="num">' + weekName(r.w) + '</td><td><a href="#week' + r.w.n + '">' + esc(r.t.title) + "</a></td><td>" + esc(r.t.due || "—") + '</td><td class="num">' + esc(type === "discussion" ? (r.t.post_count != null ? r.t.post_count : "—") : (r.t.points != null ? r.t.points : "—")) + "</td></tr>"; }).join("") + "</table></div></div>";
  }
  V.discussions = function () { return listView("discussion", "Discussions", "Every discussion in the course"); };
  V.quizzes = function () { return listView("quiz", "Quizzes", "Auto-graded; open a quiz from its week"); };
  V.people = function () {
    return "<h1>People</h1><p class=\"sub\">" + esc(C.enrollment) + '</p><div class="card"><ul class="plain"><li><strong>' + esc(C.instructor.name) + "</strong> · " + esc(C.instructor.title) + "</li>" +
      (C.staff || []).map(function (s) { return "<li><strong>" + esc(s.name) + "</strong> · " + esc(s.role) + "</li>"; }).join("") + '</ul><p class="meta" style="margin-top:10px">Student roster hidden in this copy.</p></div>';
  };

  function route() {
    var h = (location.hash || "#home").slice(1);
    var navKey = /^week\d+$/.test(h) ? "modules" : h;
    main.innerHTML = /^week\d+$/.test(h) ? weekView(h.slice(4)) : (V[h] || V.home)();
    document.querySelectorAll("nav.course a").forEach(function (a) { if (a.dataset.v === (V[navKey] ? navKey : "home")) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    window.scrollTo(0, 0);
  }
  main.addEventListener("submit", function (e) {
    var f = e.target.closest("form.quiz"); if (!f) return;
    e.preventDefault();
    var w = C.weeks.find(function (x) { return String(x.n) === f.dataset.w; }), t = w.tasks[+f.dataset.i], right = 0;
    f.querySelectorAll(".q").forEach(function (qd, qi) {
      var q = t.questions[qi], sel = qd.querySelector("input:checked"), ok = sel && +sel.value === q.answer;
      if (ok) right++;
      qd.classList.toggle("right", !!ok); qd.classList.toggle("wrong", !ok);
      qd.querySelector(".fb").textContent = ok ? "Correct" : (sel ? "Incorrect. " : "No answer. ") + "Correct answer: " + q.options[q.answer];
    });
    f.querySelector(".score").textContent = "Score: " + right + " / " + t.questions.length;
  });
  main.addEventListener("reset", function (e) {
    var f = e.target.closest("form.quiz"); if (!f) return;
    f.querySelectorAll(".q").forEach(function (qd) { qd.classList.remove("right", "wrong"); qd.querySelector(".fb").textContent = ""; });
    f.querySelector(".score").textContent = "";
  });
  window.addEventListener("hashchange", route);
  route();
})();
</script>
