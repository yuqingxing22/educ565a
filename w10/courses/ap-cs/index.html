e.", "questions": [{"q": "What does \"Hello\".substring(1, 3) return?", "options": ["He", "el", "ell", "ello"], "answer": 1}, {"q": "What type of value does Math.pow(2, 3) return?", "options": ["int, with value 8", "double, with value 8.0", "int, with value 6", "double, with value 9.0"], "answer": 1}, {"q": "Which values can (int)(Math.random() * 5) produce?", "options": ["1 to 5", "0 to 5", "0 to 4", "1 to 4"], "answer": 2}, {"q": "What does the following code print?\nString s = \"AP CSA\";\nSystem.out.println(s.indexOf(\"CSA\"));", "options": ["2", "3", "4", "-1"], "answer": 1}]}]}, {"n": 3, "label": "Module 3", "dates": null, "title": "Boolean Expressions and Selection, and the Pair Project", "overview": "Programs make decisions. You will learn boolean expressions, relational and logical operators, and if, else if, and else statements, including nested and compound conditions. You will also practice De Morgan's laws for simplifying conditions. Suggested pace: about 2 weeks. This module also includes the course's one pair programming project: you will be matched with a student from another school and write and test a small decision-making program together. Allow about 3 weeks for this module, because pairs have to coordinate.", "objectives": ["Write boolean expressions using ==, !=, <, >, <=, >=, &&, ||, and !.", "Trace and write if / else if / else statements, including nested ones.", "Apply De Morgan's laws to rewrite a condition.", "Collaborate with a remote partner to write, test, and document code."], "readings": [{"title": "CSAwesome2 Unit 2: Selection and Iteration, topics 2.1 to 2.6 (algorithms, booleans, if statements, nested ifs, compound conditions, comparing booleans)", "source": "CSAwesome2 (Runestone Academy)", "url": "https://runestone.academy/ns/books/published/csawesome2/csawesome2.html", "note": "Required. Open the book and pick the unit from the left-hand menu."}, {"title": "The if-then and if-then-else Statements", "source": "The Java Tutorials <script>
(function () {
  var C = JSON.parse(document.getElementById("data").textContent);
  var main = document.getElementById("main");
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); };
  var paras = function (s) { return String(s || "").split(/\n\s*\n/).map(function (p) { return "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>"; }).join(""); };
  var weekName = function (w) { return esc(w.label || ("Week " + w.n)); };
  var TYPE = { quiz: "Quiz", discussion: "Discussion", assignment: "Assignment", code_check: "Code check" };

  document.getElementById("site").textContent = C.site_name || "CourseSpace";
  document.getElementById("crumb").textContent = C.code + " · " + C.title + " · " + C.term;

  var NAV = [["home","Home"],["announcements","Announcements"],["syllabus","Syllabus"],["modules","Modules"],["discussions","Discussions"],["quizzes","Quizzes"],["people","People"]];
  var hasQuiz = C.weeks.some(function (w) { return (w.tasks || []).some(function (t) { return t.type === "quiz"; }); });
  var hasDisc = C.weeks.some(function (w) { return (w.tasks || []).some(function (t) { return t.type === "discussion"; }); });
  NAV = NAV.filter(function (n) { return (n[0] !== "quizzes" || hasQuiz) && (n[0] !== "discussions" || hasDisc); });
  document.getElementById("nav").innerHTML = '<div class="cname">' + esc(C.code) + "<br>" + esc(C.title) + "</div>" +
    NAV.map(function (n) { return '<a href="#' + n[0] + '" data-v="' + n[0] + '">' + n[1] + "</a>"; }).join("");

  function allTasks(type) {
    var out = [];

    return out;
  }
  function taskLine(w, t) {
    return '<span class="pill' + (t.type === "quiz" ? " k-quiz" : "") + '">' + (TYPE[t.type] || t.type) + "</span> " +
      '<a href="#week' + w.n + '">' + esc(t.title) + "</a>" +
      (t.due ? ' <span class="meta">· Due ' + esc(t.due) + "</span>" : "") + (t.points != null ? ' <span class="meta">· ' + esc(t.points) + " pts</span>" : "");
  }

  var V = {};
  V.home = function () {
    var a = (C.announcements || [])[0];
    return "<h1>" + esc(C.title) + "</h1><p class=\"sub\">" + esc(C.code) + " · " + esc(C.institution) + " · " + esc(C.program || "") + "</p>" +
      '<div class="stack"><div class="card">' + paras(C.home_message) + '<p class="meta">— ' + esc(C.instructor.name) + "</p></div>" +
      (a ? '<div class="card"><div class="label">Latest announcement</div><h3>' + esc(a.title) + '</h3><p class="meta">' + esc(a.date) + " · " + esc(a.author) + "</p>" + paras(a.body) + '<a href="#announcements">All announcements</a></div>' : "") +
      '<div class="card"><div class="label">Course at a glance</div><ul class="plain">' +
      "<li>" + esc(C.format) + "</li><li>" + esc(C.enrollment) + "</li><li>Instructor: " + esc(C.instructor.name) + "</li></ul>" +
      '<p style="margin-top:10px"><a href="#modules">Go to Modules</a> · <a href="#syllabus">Read the syllabus</a></p></div></div>';
  };
  V.announcements = function () {
    var list = C.announcements || [];
    return "<h1>Announcements</h1><p class=\"sub\">" + list.length + " posted</p><div class=\"card\">" +
      list.map(function (a) { return '<div class="ann"><h3>' + esc(a.title) + '</h3><p class="meta">' + esc(a.date) + " · " + esc(a.author) + "</p>" + paras(a.body) + "</div>"; }).join("") + "</div>";
  };
  V.syllabus = function () {
    var S = C.syllabus, I = C.instructor;
    var h = "<h1>Syllabus</h1><p class=\"sub\">" + esc(C.code) + " · " + esc(C.title) + " · " + esc(C.term) + "</p><div class=\"stack\">";
    h += '<div class="card"><h2 style="margin-top:0">Course description</h2>' + paras(S.description) + "<p class=\"meta\">" + esc(C.format) + " · " + esc(C.enrollment) + "</p></div>";
    h += '<div class="card"><h2 style="margin-top:0">Instructor</h2><ul class="plain"><li><strong>' + esc(I.name) + "</strong>, " + esc(I.title) + "</li><li>Email: " + esc(I.email) + "</li><li>Office hours: " + esc(I.office_hours) + "</li><li>Response time: " + esc(I.response_time) + "</li></ul>" +
      ((C.staff || []).length ? "<h3>Course staff</h3><ul class=\"plain\">" + C.staff.map(function (s) { return "<li>" + esc(s.name) + ", " + esc(s.role) + (s.email ? " · " + esc(s.email) : "") + "</li>"; }).join("") + "</ul>" : "") + "</div>";
    h += '<div class="card"><h2 style="margin-top:0">Learning outcomes</h2><ul>' + S.outcomes.map(function (o) { return "<li>" + esc(o) + "</li>"; }).join("") + "</ul></div>";
    h += '<div class="card"><h2 style="margin-top:0">Course materials</h2><ul>' + S.materials.map(function (m) { return "<li>" + esc(m.citation) + (m.url ? ' <a href="' + esc(m.url) + '" target="_blank" rel="noopener">' + esc(m.url) + "</a>" : "") + (m.note ? ' <span class="meta">(' + esc(m.note) + ")</span>" : "") + "</li>"; }).join("") + "</ul></div>";
    h += '<div class="card"><h2 style="margin-top:0">How a week works</h2>' + paras(S.weekly_rhythm) + "</div>";
    h += '<div class="card"><h2 style="margin-top:0">Grading</h2><div class="tablewrap"><table><tr><th>Component</th><th>Weight</th></tr>' + S.grading.map(function (g) { return "<tr><td>" + esc(g.item) + '</td><td class="num">' + esc(g.weight) + "</td></tr>"; }).join("") + "</table></div>" + (S.grading_scale ? '<p class="meta" style="margin-top:8px">' + esc(S.grading_scale) + "</p>" : "") + "</div>";
    h += '<div class="card"><h2 style="margin-top:0">Policies</h2>' + S.policies.map(function (p) { return "<h3>" + esc(p.title) + "</h3>" + paras(p.body); }).join("") + "<h3>Use of AI tools</h3>" + paras(S.ai_policy) + "</div>";
    h += '<div class="card"><h2 style="margin-top:0">Schedule</h2><div class="tablewrap"><table><tr><th>' + (C.weeks[0] && C.weeks[0].dates ? "Week" : "Module") + "</th>" + (C.weeks[0] && C.weeks[0].dates ? "<th>Dates</th>" : "") + "<th>Topic</th><th>Due</th></tr>" +
      C.weeks.map(function (w) { return "<tr><td class=\"num\"><a href=\"#week" + w.n + "\">" + weekName(w) + "</a></td>" + (w.dates ? '<td class="num">' + esc(w.dates) + "</td>" : "") + "<td>" + esc(w.title) + "</td><td>" + (w.tasks || []).map(function (t) { return esc(t.title); }).join("<br>") + "</td></tr>"; }).join("") + "</table></div></div>";
    return h + "</div>";
  };
  V.modules = function () {
    return "<h1>Modules</h1><p class=\"sub\">" + C.weeks.length + " modules · open one to see its pages</p><div class=\"stack\">" + C.weeks.map(function (w) {
      var items = '<div class="item"><span class="ic"><span class="pill">Page</span></span><span class="t"><a href="#week' + w.n + '">Overview: ' + esc(w.title) + "</a></span></div>";
      (w.readings || []).forEach(function (r) { items += '<div class="item"><span class="ic"><span class="pill">Reading</span></span><span class="t"><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.title) + "</a></span></div>"; });
      (w.media || []).forEach(function (m) { items += '<div class="item"><span class="ic"><span class="pill">' + esc(m.kind || "Media") + '</span></span><span class="t">' + esc(m.title) + ' <span class="meta">· ' + esc(m.length || "") + "</span></span></div>"; });
      (w.tasks || []).forEach(function (t) { items += '<div class="item"><span class="ic"></span><span class="t">' + taskLine(w, t) + "</span></div>"; });
      return '<section class="module"><a class="mh" href="#week' + w.n + '"><strong>' + weekName(w) + ": " + esc(w.title) + '</strong><span class="meta">' + esc(w.dates || "") + "</span></a>" + items + "</section>";
    }).join("") + "</div>";
  };
  function renderTask(w, t, i) {
    var id = "w" + w.n + "t" + i;
    var h = '<div class="card" id="' + id + '"><div class="row"><span class="pill' + (t.type === "quiz" ? " k-quiz" : "") + '">' + (TYPE[t.type] || t.type) + "</span>" +
      (t.due ? '<span class="meta">Due ' + esc(t.due) + "</span>" : "") + (t.points != null ? '<span class="meta">· ' + esc(t.points) + " points</span>" : "") + "</div><h3>" + esc(t.title) + "</h3>";
    if (t.settings) h += '<p class="meta">' + esc(t.settings) + "</p>";
    if (t.type === "quiz") {
      h += '<form class="quiz" data-w="' + w.n + '" data-i="' + i + '">' + (t.questions || []).map(function (q, qi) {
        return '<div class="q"><div><strong>' + (qi + 1) + ".</strong> " + esc(q.q) + "</div>" + q.options.map(function (o, oi) {
          var oid = id + "q" + qi + "o" + oi;
          return '<label for="' + oid + '"><input type="radio" id="' + oid + '" name="' + id + "q" + qi + '" value="' + oi + '"> <span>' + esc(o) + "</span></label>";
        }).join("") + '<div class="fb" aria-live="polite"></div></div>';
      }).join("") + '<div class="row" style="margin-top:10px"><button class="btn" type="submit">Submit quiz</button><button class="btn ghost" type="reset">Clear</button><span class="meta score" aria-live="polite"></span></div></form>';
    }
    if (t.type === "discussion") {
      h += '<div class="label" style="margin-top:6px">Prompt</div>' + paras(t.prompt) + '<div class="label">Requirements</div>' + paras(t.requirements);
      if (t.post_count != null) h += '<p class="meta">' + esc(t.post_count) + " posts in this discussion" + ((t.posts || []).length ? " · showing " + t.posts.length : "") + "</p>";
      (t.posts || []).forEach(function (p) {
        h += '<div class="post"><div><span class="who">' + esc(p.author) + '</span> <span class="meta">· ' + esc(p.time) + "</span></div>" + paras(p.body) +
          (p.replies || []).map(function (r) { return '<div class="post reply"><div><span class="who">' + esc(r.author) + '</span> <span class="meta">· ' + esc(r.time) + "</span></div>" + paras(r.body) + "</div>"; }).join("") + "</div>";
      });
    }
    if (t.type === "assignment") {
      h += paras(t.instructions);
      if ((t.rubric || []).length) h += '<div class="tablewrap"><table><tr><th>Criterion</th><th>Points</th></tr>' + t.rubric.map(function (r) { return "<tr><td>" + esc(r.criterion) + '</td><td class="num">' + esc(r.points) + "</td></tr>"; }).join("") + "</table></div>";
    }
    if (t.type === "code_check") {
      h += paras(t.instructions);
      if (t.starter_code) h += '<div class="label">Starter code</div><pre><code>' + esc(t.starter_code) + "</code></pre>";
      if ((t.tests || []).length) h += '<div class="label">The autograder checks</div><ul>' + t.tests.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
    }
    return h + "</div>";
  }
  function weekView(n) {
    var idx = C.weeks.findIndex(function (w) { return String(w.n) === String(n); });
    if (idx < 0) return V.modules();
    var w = C.weeks[idx], prev = C.weeks[idx - 1], next = C.weeks[idx + 1];
    var h = '<p class="meta"><a href="#modules">Modules</a> › ' + weekName(w) + "</p><h1>" + weekName(w) + ": " + esc(w.title) + "</h1><p class=\"sub\">" + esc(w.dates || "Self-paced") + "</p><div class=\"stack\">";
    h += '<div class="card"><h2 style="margin-top:0">Overview</h2>' + paras(w.overview) + ((w.objectives || []).length ? "<h3>This week you will</h3><ul>" + w.objectives.map(function (o) { return "<li>" + esc(o) + "</li>"; }).join("") + "</ul>" : "") + "</div>";
    if ((w.readings || []).length) h += '<div class="card"><h2 style="margin-top:0">Readings</h2><ul>' + w.readings.map(function (r) { return '<li><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.title) + "</a> <span class=\"meta\">· " + esc(r.source) + (r.note ? " · " + esc(r.note) : "") + "</span></li>"; }).join("") + "</ul></div>";
    if ((w.media || []).length) h += '<div class="card"><h2 style="margin-top:0">Watch / listen</h2><div class="stack">' + w.media.map(function (m) { return '<div class="media"><span class="play" aria-hidden="true">▶</span><div style="min-width:0"><strong>' + esc(m.title) + '</strong><div class="meta">' + esc([m.kind, m.length, m.note].filter(Boolean).join(" · ")) + "</div></div></div>"; }).join("") + "</div></div>";
    (w.tasks || []).forEach(function (t, i) { h += renderTask(w, t, i); });
    h += "</div><div class=\"pager\">" + (prev ? '<a href="#week' + prev.n + '">← ' + weekName(prev) + "</a>" : "<span></span>") + (next ? '<a href="#week' + next.n + '">' + weekName(next) + " →</a>" : "") + "</div>";
    return h;
  }
  function listView(type, title, sub) {
    var rows = allTasks(type);
    return "<h1>" + title + "</h1><p class=\"sub\">" + sub + "</p><div class=\"card\"><div class=\"tablewrap\"><table><tr><th>" + (C.weeks[0] && C.weeks[0].dates ? "Week" : "Module") + "</th><th>Title</th><th>Due</th>" + (type === "discussion" ? "<th>Posts</th>" : "<th>Points</th>") + "</tr>" +
      rows.map(function (r) { return '<tr><td class="num">' + weekName(r.w) + '</td><td><a href="#week' + r.w.n + '">' + esc(r.t.title) + "</a></td><td>" + esc(r.t.due || "—") + '</td><td class="num">' + esc(type === "discussion" ? (r.t.post_count != null ? r.t.post_count : "—") : (r.t.points != null ? r.t.points : "—")) + "</td></tr>"; }).join("") + "</table></div></div>";
  }
  V.discussions = function () { return listView("discussion", "Discussions", "Every discussion in the course"); };
  V.quizzes = function () { return listView("quiz", "Quizzes", "Auto-graded; open a quiz from its week"); };

    return "<h1>People</h1><p class=\"sub\">" + esc(C.enrollment) + '</p><div class="card"><ul class="plain"><li><strong>' + esc(C.instructor.name) + "</strong> · " + esc(C.instructor.title) + "</li>" +
      (C.staff || []).map(function (s) { return "<li><strong>" + esc(s.name) + "</strong> · " + esc(s.role) + "</li>"; }).join("") + '</ul><p class="meta" style="margin-top:10px">Student roster hidden in this copy.</p></div>';
  };

  function route() {
    var h = (location.hash || "#home").slice(1);
    var navKey = /^week\d+$/.test(h) ? "modules" : h;
    main.innerHTML = /^week\d+$/.test(h) ? weekView(h.slice(4)) : (V[h] || V.home)();
    document.querySelectorAll("nav.course a").forEach(function (a) { if (a.dataset.v === (V[navKey] ? navKey : "home")) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    window.scrollTo(0, 0);
  }
  main.addEventListener("submit", function (e) {
    var f = e.target.closest("form.quiz"); if (!f) return;
    e.preventDefault();
    var w = C.weeks.find(function (x) { return String(x.n) === f.dataset.w; }), t = w.tasks[+f.dataset.i], right = 0;
    f.querySelectorAll(".q").forEach(function (qd, qi) {
      var q = t.questions[qi], sel = qd.querySelector("input:checked"), ok = sel && +sel.value === q.answer;
      if (ok) right++;
      qd.classList.toggle("right", !!ok); qd.classList.toggle("wrong", !ok);
      qd.querySelector(".fb").textContent = ok ? "Correct" : (sel ? "Incorrect. " : "No answer. ") + "Correct answer: " + q.options[q.answer];
    });
    f.querySelector(".score").textContent = "Score: " + right + " / " + t.questions.length;
  });
  main.addEventListener("reset", function (e) {
    var f = e.target.closest("form.quiz"); if (!f) return;
    f.querySelectorAll(".q").forEach(function (qd) { qd.classList.remove("right", "wrong"); qd.querySelector(".fb").textContent = ""; });
    f.querySelector(".score").textContent = "";
  });
  window.addEventListener("hashchange", route);
  route();
})();
</script>
