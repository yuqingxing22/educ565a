 the group of students that does not receive the app (and continues studying as usual) is the:", "options": ["population", "control group", "sample", "treatment group"], "answer": 1}, {"q": "Why do researchers randomly assign participants to groups in an experiment?", "options": ["To make sure the treatment group is the larger group", "To make the results easier to graph", "To guarantee the treatment will work", "To spread out other differences among participants so the groups are similar"], "answer": 3}, {"q": "A researcher surveys college students about their exercise habits and then compares the responses with their GPAs, without assigning anyone to exercise. This is a(n):", "options": ["census of the population", "experiment", "observational study", "placebo-controlled trial"], "answer": 2}, {"q": "Before taking part in a study, participants should be told about the risks and agree to take part. This is called:", "options": ["random assignment", "informed consent", "blinding", "stratification"], "answer": 1}]}, {"type": "assignment", "title": "Data Collection Project", "due": "Sun Sep 13, 11:59 pm", "points": 50, "instructions": "In this project you will collect a small set of data and describe how you collected it.\n\nStep 1. Download the worksheet from the Week 3 Assignments folder. Students whose last name starts with M-Z should use the Version B worksheet.\n\nStep 2. Choose a question from the list on your worksheet and collect data from at least 15 people or items. Record the data in the table on the worksheet.\n\nStep 3. Answer the questions on the worksheet: identify the population and the sample, name the sampling method you used, classify each variable you recorded, and describe one possible source of bias in your data.\n\nStep 4. Write a short paragraph (5-7 sentences) on the ethical issues of collecting data from people. Upload your completed worksheet as a .docx or .pdf file. Submissions on the wrong worksheet or in other formats may not be graded.", "rubric": [{"criterion": "Data table complete (at least 15 entries)", "points": 10}, {"criterion": "Population, sample, and sampling method identified correctly", "points": 12}, {"criterion": "Variables classified correctly", "points": 8}, {"criterion": "Source of bias described", "points": 10}, {"criterion": "Ethics paragraph", "points": 10}]}, {"type": "discussion", "title": "Discussion 3: Could we test this with an experiment?", "due": "Initial post Wed Sep 9, 11:59 pm; two replies Sun Sep 13, 11:59 pm", "points": 10, "prompt": "Think of a claim you have heard (for example, \"students who sleep more get better grades\"). Could it be tested with an experiment, or only with an observational study? What would make it hard to run an experiment?", "requirements": "Write an initial post of at least 150 words by Wednesday 11:59 pm. Then reply to two classmates by Sunday 11:59 pm. Your posts should be substantive and show that you have engaged with the week's material. Posts that are not substantive will receive reduced credit. Late posts are not accepted.", "post_count": 83, "posts": [{"author": "Brianna L.", "time": "Sep 9, 10:58 pm", "body": "Claim: people who drink coffee are more productive. You could do an experiment by randomly giving some people coffee and some decaf and then measuring how much they get done. Hard part is people would know what they are drinking so it needs to be blind. Also productive is hard to measure."}, {"author": "Omar H.", "time": "Sep 10, 7:40 pm", "body": "For the assignment, does anyone know what the Version B thing means? The instructions say B is for M-Z but I don't see what A people are supposed to use or what's different between them. Last name starts with R."}, {"author": "Priya D.", "time": "Sep 10, 9:12 pm", "body": "@Omar the version is by last name. A is A to L and B is M to Z, so you'd use B. They have different question lists, B has the commuting ones and A has the sleep ones I think.", "replies": [{"author": "Omar H.", "time": "Sep 10, 9:30 pm", "body": "ok thanks that helps"}]}]}]}, {"n": 4, "label": "Week 4", "dates": "Sep 14 – Sep 20", "title": "Histograms, Percentiles, and Box Plots", "overview": "Now that you can collect data, this week is about summarizing a data set by its shape and by where values fall. You will make histograms, find quartiles and percentiles, and build box plots.", "objectives": ["Read and interpret a histogram.", "Find quartiles, percentiles, and the IQR.", "Construct and interpret a box plot from the five-number summary."], "readings": [{"title": "2.2 Histograms, Frequency Polygons, and Time Series Graphs", "source": "OpenStax Introductory Statistics 2e", "url": "https://openstax.org/books/introductory-statistics-2e/pages/2-2-histograms-frequency-polygons-and-time-series-graphs", "note": "required"}, {"title": "2.3 Measures of the Location of the Data", "source": "OpenStax Introductory Statistics 2e", "url": "https://openstax.org/books/introductory-statistics-2e/pages/2-3-measures-of-the-location-of-the-data", "note": "required"}, {"title": "2.4 Box Plots", "source": "OpenStax Introductory Statistics 2e", "url": "https://openstax.org/books/introductory-statistics-2e/pages/2-4-box-plots", "note": "required"}], "media": [{"title": "Week 4 lecture: Histograms and percentiles", "kind": "video", "length": "24 min", "note": "Recorded Fall 2021; auto-generated captions. Fictional course media."}, {"title": "Week 4 lecture: Building a box plot by hand", "kind": "video", "length": "16 min", "note": "Recorded Fall 2021; auto-generated captions. Fictional course media."}], "tasks": [{"type": "quiz", "title": "Quiz 4", "due": "Sun Sep 20, 11:59 pm", "points": 10, "settings": "2 attempts, 30 minutes, auto-graded, highest score kept", "questions": [{"q": "In a histogram, the height of each bar shows:", "options": ["the number (or proportion) of data values in that interval", "the mean of the values in that interval", "the percentile of that interval", "the largest value nd measure spread with the standard deviation. Make sure you can calculate each by hand before using a calculator.", "objectives": ["Calculate the mean, median, and mode.", "Explain how skewness and outliers affect measures of center.", "Calculate and interpret the standard deviation."], "readings": [{"title": "2.5 Measures of the Center of the Data", "source": "OpenStax Introductory Statistics 2e", "url": "https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data", "note": "required"}, {"title": "2.6 Skewness and the Mean, Median, and Mode", "source": "OpenStax Introductory Statistics 2e", "url": "https://openstax.org/books/introductory-statistics-2e/pages/2-6-skewness-and-the-mean-median-and-mode", "note": "required"}, {"title": "2.7 Measures of the Spread of the Data", "source": "OpenStax Introductory Statistics 2e", "url": "https://openstax.org/books/introductory-statistics-2e/pages/2-7-measures-of-the-spread-of-the-data", "note": "required"}], "media": [{"title": "Week 5 lecture: Center and skewness", "kind": "video", "length": "21 min", "note": "Recorded Fall 2021; auto-generated captions. Fictional course media."}, {"title": "Week 5 lecture: Standard deviation step by step", "kind": "video", "length": "26 min", "note": "Recorded Fall 2021; auto-generated captions. Fictional course media."}], "tasks": [{"type": "quiz", "title": "Quiz 5", "due": "Sun Sep 27, 11:59 pm", "points": 10, "settings": "2 attempts, 30 minutes, auto-graded, highest score kept", "questions": [{"q": "What is the mean of the data set 2, 4, 4, 6, 9?", "options": ["6", "5.5", "5", "4"], "answer": 2}, {"q": "A distribution is skewed to the right. Which statement is most likely true?", "options": ["The mode is greater than the mean", "The mean equals the median", "The mean is less than the median", "The mean is greater than the median"], "answer": 3}, {"q": "Which measure of center is least affected by a very extreme outlier?", "options": ["Median", "Standard deviation", "Mean", "Sum"], "answer": 0}, {"q": "The standard deviation of a data set is best described as:", "options": ["the typical distance of the data values from the mean", "the most frequent value", "the largest value minus the smallest value", "the middle value of the data"], "answer": 0}, {"q": "What is the standard deviation of the data set 10, 10, 10, 10?", "options": ["10", "5", "0", "1"], "answer": 2}]}, {"type": "discussion", "title": "Discussion 5: Same average, different story", "due": "Initial post Wed Sep 23, 11:59 pm; two replies Sun Sep 27, 11:59 pm", "points": 10, "prompt": "Describe two data sets (real or made up) that have the same mean but different spread. For example, two cafes with the same average wait time. Explain why knowing the spread matters.", "requirements": "Write an initial post of at least 150 words by Wednesday 11:59 pm. Then reply to two classmates by Sunday 11:59 pm. Your posts should be substantive and show that you have engaged with the week's material. Posts that are not substantive will receive reduced credit. Late posts are not accepted.", "post_count": 70, "posts": [{"author": "Chris W.", "time": "Sep 23, 10:35 pm", "body": "Two basketball players who both average 15 points. One scores 14, 15, 16 every game. The other scores 5 one night and 30 the next. Same average but the second one is a lot less predictable, so the standard deviation is bigger."}, {"author": "Luis V.", "time": "Sep 24, 11:58 pm", "body": "Two classes with an average of 75 on the same test. In one almost everyone got 70-80 and in the other half got 95 and half got 55. Spread matters because the average hides that."}, {"author": "Sofia G.", "time": "Sep 26, 8:02 pm", "body": "Commute times. Mine is the same on average as my friends but she has the freeway so some days its 20 and some days 70. I'd rather have the steady one."}]}]}, {"n": 6, "label": "Week 6", "dates": "Sep 28 – Oct 4", "title": "Probability Basics", "overview": "This week begins tudent is picked at random, what is the probability the student is an online student?", "options": ["0.20", "0.60", "0.50", "0.30"], "answer": 2}, {"q": "Using the same survey (online: 30 full-time, 20 not; in-person: 10 full-time, 40 not), what is the probability that a student works full-time, given the student is online?", "options": ["0.75", "0.60", "0.40", "0.30"], "answer": 1}, {"q": "Using the same survey, what is the probability that a randomly chosen student is online AND works full-time?", "options": ["0.30", "0.50", "0.60", "0.80"], "answer": 0}, {"q": "Using the same survey, what is the probability that a randomly chosen student is online OR works full-time?", "options": ["0.90", "0.80", "0.60", "0.30"], "answer": 2}, {"q": "A bag holds 3 red balls and 2 blue balls. Two balls are drawn one after the other without replacement. What is the probability both are red?", "options": ["0.36", "0.30", "0.60", "0.20"], "answer": 1}]}, {"type": "discussion", "title": "Discussion 7: Tables that help decisions", "due": "Initial post Wed Oct 7, 11:59 pm; two replies Sun Oct 11, 11:59 pm", "points": 10, "prompt": "Describe a situation where a business, school, or clinic could use a contingency table to make a decision. What two categorical variables would the table compare?", "requirements": "Write an initial post of at least 150 words by Wednesday 11:59 pm. Then reply to two classmates by Sunday 11:59 pm. Your posts should be substantive and show that you have engaged with the week's material. Posts that are not substantive will receive reduced credit. Late posts are not accepted."}]}, {"n": 8, "label": "Week 8", "dates": "Oct 12 – Oct 18", "title": "Midterm Exam", "overview": "The midterm exam covers Weeks 1-7 (Chapters 1-3). It is available from Monday at 12:00 am until Sunday at 11:59 pm. You get one attempt and 75 minutes once you open it. There is no discussion board this week.", "objectives": ["Show understanding of sampling, data, descriptive statistics, and pr ============================================================
SYLLABUS
============================================================
Course description
An introduction to the collection, organization, description, and analysis of data. Topics include sampling and experimental design, descriptive statistics, probability, discrete and continuous distributions, the Central Limit Theorem, confidence intervals, hypothesis testing for one and two samples, correlation and regression, and the chi-square test. Prerequisite: Intermediate Algebra or placement. Satisfies the general education quantitative reasoning requirement.

Instructor: Carol Whitfield, Adjunct Instructor · cwhitfield@eastvalley.example.edu
Office hours: Virtual office hours on Tuesdays 2:00-3:00 pm (Zoom link posted in the Week 1 module), or by appointment by email
Response time: Within 48 hours on weekdays

Learning outcomes
- Students will be able to describe and summarize data using appropriate tables, graphs, and numerical measures.
- Students will be able to apply basic rules of probability and work with discrete and normal probability distributions.
- Students will be able to construct and interpret confidence intervals for means and proportions.
- Students will be able to carry out and interpret hypothesis tests for one and two samples.
- Students will be able to describe the relationship between two numerical variables using correlation and regression.
- Students will be able to evaluate statistical claims found in everyday sources.

Course materials
- Illowsky, B., & Dean, S. (2023). Introductory statistics (2nd ed.). OpenStax. https://openstax.org/books/introductory-statistics-2e/pages/1-introduction https://openstax.org/books/introductory-statistics-2e/pages/1-introduction (Required. Free online; a printed copy is optional.)

How a week works
Each module opens on Monday at 12:00 am. Complete the readings and watch the lecture, post your initial discussion post by Wednesday at 11:59 pm, then reply to two classmates and finish the weekly quiz by Sunday at 11:59 pm. Assignments are also due on Sundays at 11:59 pm unless noted. The midterm is in Week 8 and the final exam is in Week 16.

Grading
- Weekly quizzes (14): 30%
- Discussion boards (14): 15%
- Assignments (4): 20%
- Midterm exam (Week 8): 15%
- Final exam (Week 16): 20%
A 90-100%, B 80-89%, C 70-79%, D 60-69%, F below 60%

Policies
Late work: Assignments submitted late lose 10% per day, up to 3 days. After 3 days, no credit. Quizzes, exams, and discussion posts are not accepted late. Extensions are granted only for documented emergencies.
Discussion boards: Each week you must write one initial post (due Wednesday 11:59 pm) and reply to two classmates (due Sunday 11:59 pm). Posts must be substantive. Posts that are not substantive will receive reduced credit.
Quizzes and exams: Weekly quizzes are auto-graded and allow two attempts; your highest score is kept. The midterm and final exam allow one attempt. Technical problems must be reported to the college help desk before the deadline.
Communication: Email is the best way to reach me. I respond within 48 hours on weekdays. Please check the Announcements page and your college email regularly. You are responsible for all announcements.
Academic integrity: All work you submit must be your own. Cheating, plagiarism, and unauthorized collaboration will result in a zero on the assignment and may be reported to the Dean of Students.
Withdrawals: The last day to withdraw with a W is Friday, November 6. It is your responsibility to withdraw. Please speak with the Financial Aid office before withdrawing, because it may affect your aid.
Accessibility: Students who need accommodations should contact Disability Support Services and send me their accommodation letter during the first two weeks of the term.
Use of AI tools: Use of AI tools to complete quizzes, exams, or discussion posts is considered academic dishonesty and will be treated as a violation of the academic integrity policy. Students are responsible for knowing what counts as unauthorized assistance.

      (w.readings || []).forEach(function (r) { items += '<div class="item"><span class="ic"><span class="pill">Reading</span></span><span class="t"><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.title) + "</a></span></div>"; });
      (w.media || []).forEach(function (m) { items += '<div class="item"><span class="ic"><span class="pill">' + esc(m.kind || "Media") + '</span></span><span class="t">' + esc(m.title) + ' <span class="meta">· ' + esc(m.length || "") + "</span></span></div>"; });
      (w.tasks || []).forEach(function (t) { items += '<div class="item"><span class="ic"></span><span class="t">' + taskLine(w, t) + "</span></div>"; });
      return '<section class="module"><a class="mh" href="#week' + w.n + '"><strong>' + weekName(w) + ": " + esc(w.title) + '</strong><span class="meta">' + esc(w.dates || "") + "</span></a>" + items + "</section>";
    }).join("") + "</div>";
  };
  function renderTask(w, t, i) {
    var id = "w" + w.n + "t" + i;
    var h = '<div class="card" id="' + id + '"><div class="row"><span class="pill' + (t.type === "quiz" ? " k-quiz" : "") + '">' + (TYPE[t.type] || t.type) + "</span>" +
      (t.due ? '<span class="meta">Due ' + esc(t.due) + "</span>" : "") + (t.points != null ? '<span class="meta">· ' + esc(t.points) + " points</span>" : "") + "</div><h3>" + esc(t.title) + "</h3>";
    if (t.settings) h += '<p class="meta">' + esc(t.settings) + "</p>";
    if (t.type === "quiz") {
      h += '<form class="quiz" data-w="' + w.n + '" data-i="' + i + '">' + (t.questions || []).map(function (q, qi) {
        return '<div class="q"><div><strong>' + (qi + 1) + ".</strong> " + esc(q.q) + "</div>" + q.options.map(function (o, oi) {
          var oid = id + "q" + qi + "o" + oi;
          return '<label for="' + oid + '"><input type="radio" id="' + oid + '" name="' + id + "q" + qi + '" value="' + oi + '"> <span>' + esc(o) + "</span></label>";
        }).join("") + '<div class="fb" aria-live="polite"></div></div>';
      }).join("") + '<div class="row" style="margin-top:10px"><button class="btn" type="submit">Submit quiz</button><button class="btn ghost" type="reset">Clear</button><span class="meta score" aria-live="polite"></span></div></form>';
    }
    if (t.type === "discussion") {
      h += '<div class="label" style="margin-top:6px">Prompt</div>' + paras(t.prompt) + '<div class="label">Requirements</div>' + paras(t.requirements);
      if (t.post_count != null) h += '<p class="meta">' + esc(t.post_count) + " posts in this discussion" + ((t.posts || []).length ? " · showing " + t.posts.length : "") + "</p>";
      (t.posts || []).forEach(function (p) {
        h += '<div class="post"><div><span class="who">' + esc(p.author) + '</span> <span class="meta">· ' + esc(p.time) + "</span></div>" + paras(p.body) +
          (p.replies || []).map(function (r) { return '<div class="post reply"><div><span class="who">' + esc(r.author) + '</span> <span class="meta">· ' + esc(r.time) + "</span></div>" + paras(r.body) + "</div>"; }).join("") + "</div>";
      });
    }
    if (t.type === "assignment") {
      h += paras(t.instructions);
      if ((t.rubric || []).length) h += '<div class="tablewrap"><table><tr><th>Criterion</th><th>Points</th></tr>' + t.rubric.map(function (r) { return "<tr><td>" + esc(r.criterion) + '</td><td class="num">' + esc(r.points) + "</td></tr>"; }).join("") + "</table></div>";
    }
    if (t.type === "code_check") {
      h += paras(t.instructions);
      if (t.starter_code) h += '<div class="label">Starter code</div><pre><code>' + esc(t.starter_code) + "</code></pre>";
      if ((t.tests || []).length) h += '<div class="label">The autograder checks</div><ul>' + t.tests.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
    }
    return h + "</div>";
  }
  function weekView(n) {
    var idx = C.weeks.findIndex(function (w) { return String(w.n) === String(n); });
    if (idx < 0) return V.modules();
    var w = C.weeks[idx], prev = C.weeks[idx - 1], next = C.weeks[idx + 1];
    var h = '<p class="meta"><a href="#modules">Modules</a> › ' + weekName(w) + "</p><h1>" + weekName(w) + ": " + esc(w.title) + "</h1><p class=\"sub\">" + esc(w.dates || "Self-paced") + "</p><div class=\"stack\">";
    h += '<div class="card"><h2 style="margin-top:0">Overview</h2>' + paras(w.overview) + ((w.objectives || []).length ? "<h3>This week you will</h3><ul>" + w.objectives.map(function (o) { return "<li>" + esc(o) + "</li>"; }).join("") + "</ul>" : "") + "</div>";
    if ((w.readings || []).length) h += '<div class="card"><h2 style="margin-top:0">Readings</h2><ul>' + w.readings.map(function (r) { return '<li><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.title) + "</a> <span class=\"meta\">· " + esc(r.source) + (r.note ? " · " + esc(r.note) : "") + "</span></li>"; }).join("") + "</ul></div>";
    if ((w.media || []).length) h += '<div class="card"><h2 style="margin-top:0">Watch / listen</h2><div class="stack">' + w.media.map(function (m) { return '<div class="media"><span class="play" aria-hidden="true">▶</span><div style="min-width:0"><strong>' + esc(m.title) + '</strong><div class="meta">' + esc([m.kind, m.length, m.note].filter(Boolean).join(" · ")) + "</div></div></div>"; }).join("") + "</div></div>";
    (w.tasks || []).forEach(function (t, i) { h += renderTask(w, t, i); });
    h += "</div><div class=\"pager\">" + (prev ? '<a href="#week' + prev.n + '">← ' + weekName(prev) + "</a>" : "<span></span>") + (next ? '<a href="#week' + next.n + '">' + weekName(next) + " →</a>" : "") + "</div>";
    return h;
  }
  function listView(type, title, sub) {
    var rows = allTasks(type);
    return "<h1>" + title + "</h1><p class=\"sub\">" + sub + "</p><div class=\"card\"><div class=\"tablewrap\"><table><tr><th>" + (C.weeks[0] && C.weeks[0].dates ? "Week" : "Module") + "</th><th>Title</th><th>Due</th>" + (type === "discussion" ? "<th>Posts</th>" : "<th>Points</th>") + "</tr>" +
      rows.map(function (r) { return '<tr><td class="num">' + weekName(r.w) + '</td><td><a href="#week' + r.w.n + '">' + esc(r.t.title) + "</a></td><td>" + esc(r.t.due || "—") + '</td><td class="num">' + esc(type === "discussion" ? (r.t.post_count != null ? r.t.post_count : "—") : (r.t.points != null ? r.t.points : "—")) + "</td></tr>"; }).join("") + "</table></div></div>";
  }
  V.discussions = function () { return listView("discussion", "Discussions", "Every discussion in the course"); };
  V.quizzes = function () { return listView("quiz", "Quizzes", "Auto-graded; open a quiz from its week"); };
  V.people = function () {
    return "<h1>People</h1><p class=\"sub\">" + esc(C.enrollment) + '</p><div class="card"><ul class="plain"><li><strong>' + esc(C.instructor.name) + "</strong> · " + esc(C.instructor.title) + "</li>" +
      (C.staff || []).map(function (s) { return "<li><strong>" + esc(s.name) + "</strong> · " + esc(s.role) + "</li>"; }).join("") + '</ul><p class="meta" style="margin-top:10px">Student roster hidden in this copy.</p></div>';
  };

  function route() {
    var h = (location.hash || "#home").slice(1);
    var navKey = /^week\d+$/.test(h) ? "modules" : h;
    main.innerHTML = /^week\d+$/.test(h) ? weekView(h.slice(4)) : (V[h] || V.home)();
    document.querySelectorAll("nav.course a").forEach(function (a) { if (a.dataset.v === (V[navKey] ? navKey : "home")) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    window.scrollTo(0, 0);
  }
  main.addEventListener("submit", function (e) {
    var f = e.target.closest("form.quiz"); if (!f) return;
    e.preventDefault();
    var w = C.weeks.find(function (x) { return String(x.n) === f.dataset.w; }), t = w.tasks[+f.dataset.i], right = 0;
    f.querySelectorAll(".q").forEach(function (qd, qi) {
      var q = t.questions[qi], sel = qd.querySelector("input:checked"), ok = sel && +sel.value === q.answer;
      if (ok) right++;
      qd.classList.toggle("right", !!ok); qd.classList.toggle("wrong", !ok);
      qd.querySelector(".fb").textContent = ok ? "Correct" : (sel ? "Incorrect. " : "No answer. ") + "Correct answer: " + q.options[q.answer];
    });
    f.querySelector(".score").textContent = "Score: " + right + " / " + t.questions.length;
  });
  main.addEventListener("reset", function (e) {
    var f = e.target.closest("form.quiz"); if (!f) return;
    f.querySelectorAll(".q").forEach(function (qd) { qd.classList.remove("right", "wrong"); qd.querySelector(".fb").textContent = ""; });
    f.querySelector(".score").textContent = "";
  });
  // Copy as text: AI tools that open links don't run this page's script, so they see an empty shell.
  // These buttons give students the words to paste instead.
  var HEAD = C.code + " " + C.title + " · " + C.term + "\n" + C.institution + " · " + (C.site_name || "CourseSpace") + " course site (fictional course copy for EDUC 565A)\n\n";
  function copyText(text, btn) {
    var label = btn.textContent;
    var done = function (ok) { btn.textContent = ok ? "Copied" : "Copy failed: select the text and copy"; setTimeout(function () { btn.textContent = label; }, 2200); };
    var fallback = function () {
      var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.remove(); done(ok);
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { done(true); }, fallback); else fallback();
  }
  document.getElementById("copyPage").addEventListener("click", function () {
    var clone = main.cloneNode(true);
    clone.querySelectorAll("button, .fb, .score").forEach(function (el) { el.remove(); });
    clone.style.position = "absolute"; clone.style.left = "-9999px"; document.body.appendChild(clone);
    var t = clone.innerText.replace(/\n{3,}/g, "\n\n").trim(); clone.remove();
    copyText(HEAD + t + "\n", this);
  });
  document.getElementById("copyAll").addEventListener("click", function () { copyText(document.getElementById("fulltext").textContent, this); });
  if (/github\.io$/.test(location.hostname)) document.getElementById("txtLink").hidden = false;

  window.addEventListener("hashchange", route);
  route();
})();
</script>
