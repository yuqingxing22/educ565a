<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Learning Mode Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500&display=swap">
<style>
:root {
  --ground: #F4F1EA;
  --surface: #FFFDF8;
  --ink: #2A1C18;
  --muted: #6B5D55;
  --line: #E0D8C8;
  --cardinal: #990000;
  --cardinal-soft: #F5E0DC;
  --gold: #FFCC00;
  --gold-soft: #FFF3C4;
  --green: #5B8C5A;
  --green-soft: #E3EEDD;
  --blue: #2E6F9E;
  --blue-soft: #DDE9F2;
  --orange: #D97B29;
  --orange-soft: #F9E5D3;
  --display: Georgia, "Newsreader", "Times New Roman", serif;
  --body: Calibri, "Atkinson Hyperlegible", Carlito, "Trebuchet MS", system-ui, sans-serif;
  --shadow: 0 1px 2px rgba(60,30,20,.06), 0 4px 14px rgba(60,30,20,.07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #1C1512; --surface: #261D19; --ink: #F3EAE2; --muted: #B3A197; --line: #43342C;
    --cardinal: #F07A6E; --cardinal-soft: #3D211D; --gold: #E8B84A; --gold-soft: #3A2F16;
    --green: #8CC18A; --green-soft: #1F3020; --blue: #86B7DD; --blue-soft: #1B2B38;
    --orange: #EDA066; --orange-soft: #3A2616;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #1C1512; --surface: #261D19; --ink: #F3EAE2; --muted: #B3A197; --line: #43342C;
  --cardinal: #F07A6E; --cardinal-soft: #3D211D; --gold: #E8B84A; --gold-soft: #3A2F16;
  --green: #8CC18A; --green-soft: #1F3020; --blue: #86B7DD; --blue-soft: #1B2B38;
  --orange: #EDA066; --orange-soft: #3A2616;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}

* { box-sizing: border-box; }
body {
  background: var(--ground); color: var(--ink);
  font-family: var(--body); font-size: 18px; line-height: 1.55;
  margin: 0; padding-inline: 20px; padding-block: 0 72px;
}
.wrap { max-width: 980px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.muted { color: var(--muted); }

/* Top bar */
.topbar {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 18px; border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 20px; }
.brand img { width: 34px; height: 34px; object-fit: contain; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: 6px; border: 1.5px solid var(--ink);
  background: var(--surface); color: var(--ink); font-weight: 700;
  transition: transform .08s ease;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--cardinal); border-color: var(--cardinal); color: var(--surface); }
.btn.small { padding: 6px 12px; font-size: 15px; }
.btn.ghost { border-color: var(--line); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* Progress */
.progress { list-style: none; margin: 0; padding: 18px 0 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.progress li button {
  width: 100%; text-align: left; background: none; border: 0; padding: 0; color: var(--muted);
  display: grid; gap: 6px; font-size: 14px;
}
.progress li button::before { content: ""; display: block; height: 6px; border-radius: 3px; background: var(--line); }
.progress li.done button::before { background: var(--gold); }
.progress li.current button { color: var(--ink); font-weight: 700; }
.progress li.current button::before { background: var(--cardinal); }
.progress .num { font-variant-numeric: tabular-nums; }

/* Landing */
.hero { display: grid; gap: 22px; padding-block: 40px 20px; }
.hero-img { width: 100%; aspect-ratio: 16 / 9; max-width: 100%; object-fit: cover; border-radius: 10px; box-shadow: var(--shadow); }
.hero h1 { font-size: clamp(32px, 6.4vw, 64px); letter-spacing: -.01em; white-space: nowrap; }
@media (max-width: 560px) { .hero h1 { white-space: normal; } }
.hero h1 em { color: var(--cardinal); font-weight: 500; }
.lede { font-size: 20px; max-width: 60ch; }
.menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.menu div { border-top: 3px solid var(--gold); padding-top: 8px; font-size: 15px; }
.menu b { display: block; font-family: var(--display); font-size: 19px; }

/* Step */
section.step { padding-block: 34px 0; display: grid; gap: 22px; }
.step-head { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; }
.eyebrow { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--cardinal); }
.step-head h2 { font-size: clamp(32px, 5vw, 46px); margin-top: 4px; }
.step-head p { margin-top: 10px; max-width: 64ch; font-size: 18px; }
.step-img { width: 110px; height: 110px; object-fit: contain; }
.banner-img { width: 100%; max-width: 100%; aspect-ratio: 3 / 1; object-fit: cover; border-radius: 10px; }
h3 { font-size: 22px; }
.group { display: grid; gap: 12px; }
.group-head { display: flex; align-items: center; gap: 12px; }
.group-head img { width: 44px; height: 44px; object-fit: contain; }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.card { position: relative; display: block; }
.card input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.card .face {
  height: 100%; display: grid; gap: 4px; align-content: start;
  padding: 14px 16px 14px 44px; border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--surface); box-shadow: var(--shadow);
  transition: border-color .12s, background .12s, transform .12s;
  position: relative;
}
.card .face::before {
  content: ""; position: absolute; left: 14px; top: 16px; width: 18px; height: 18px;
  border: 2px solid var(--muted); border-radius: 4px; background: var(--surface);
}
.card input[type="radio"] + .face::before { border-radius: 50%; }
.card:hover .face { transform: translateY(-2px); border-color: var(--ink); }
.card input:focus-visible + .face { outline: 3px solid var(--blue); outline-offset: 2px; }
.card input:checked + .face { border-color: var(--cardinal); background: var(--cardinal-soft); }
.card input:checked + .face::before { border-color: var(--cardinal); background: var(--cardinal); box-shadow: inset 0 0 0 3px var(--surface); }
.card b { font-size: 17px; }
.card small { color: var(--muted); font-size: 15px; line-height: 1.4; }
.card .pic { width: 64px; height: 64px; object-fit: contain; margin-bottom: 4px; }
.cards.plus .card input:checked + .face { border-color: var(--green); background: var(--green-soft); }
.cards.plus .card input:checked + .face::before { border-color: var(--green); background: var(--green); }
.cards.minus .card input:checked + .face { border-color: var(--orange); background: var(--orange-soft); }
.cards.minus .card input:checked + .face::before { border-color: var(--orange); background: var(--orange); }
.card .remove {
  position: absolute; right: 10px; bottom: 8px; z-index: 2; border: 0; background: none; color: var(--muted);
  font-size: 13px; text-decoration: underline; padding: 2px 4px;
}

.addown { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
.own-card .t-in { flex: 1 1 220px; }
.own-card .d-in { flex: 2 1 320px; }
.addown input { flex: 1 1 260px; min-width: 0; padding: 10px 12px; border: 1.5px dashed var(--muted); border-radius: 8px; background: var(--surface); }

.field { display: grid; gap: 6px; }
.field label, .field .label { font-weight: 700; }
.field .hint { color: var(--muted); font-size: 15px; }
textarea, .textin {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface);
  line-height: 1.5;
}
textarea { min-height: 88px; resize: vertical; }
textarea:focus, .textin:focus { border-color: var(--ink); }

.note {
  padding: 12px 16px; border-left: 4px solid var(--gold); background: var(--gold-soft); border-radius: 4px; font-size: 16px;
}

/* Recipe */
.recipe-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; align-items: start; padding-block: 14px; border-top: 1px solid var(--line); }
.recipe-row .part { font-family: var(--display); font-size: 24px; font-weight: 700; }
.reminders { display: grid; gap: 6px; padding-top: 34px; }
.reminders .rtitle { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 14px; padding: 3px 9px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); }
.chip.p { border-color: var(--blue); background: var(--blue-soft); }
.chip.plus { border-color: var(--green); background: var(--green-soft); }
.chip.minus { border-color: var(--orange); background: var(--orange-soft); }
.chip .sign { font-weight: 700; margin-right: 3px; }
.none { color: var(--muted); font-size: 14px; font-style: italic; }

.output {
  border: 1.5px solid var(--ink); border-radius: 10px; background: var(--surface); overflow: hidden;
}
.output-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--gold-soft); }
.output-head b { font-family: var(--display); font-size: 20px; }
.output pre {
  margin: 0; padding: 16px; white-space: pre-wrap; word-wrap: break-word; font-family: var(--body); font-size: 16px; max-height: 420px; overflow: auto;
}
.copied { font-size: 14px; color: var(--green); font-weight: 700; min-width: 4em; }

/* Taste test */
.testers .face { padding-left: 44px; }
.testers .msg { font-family: var(--display); font-style: italic; font-size: 17px; color: var(--ink); }
.say {
  display: grid; gap: 10px; padding: 18px; border-radius: 10px; background: var(--blue-soft); border: 1.5px solid var(--blue);
}
.say .who { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--blue); }
.say q { font-family: var(--display); font-size: 22px; quotes: "\201C" "\201D"; }
.verdicts { display: flex; gap: 10px; flex-wrap: wrap; }
.verdicts .card .face { padding: 10px 16px 10px 40px; box-shadow: none; }
.verdicts .card .face::before { top: 12px; }
.verdicts .v-held input:checked + .face { border-color: var(--green); background: var(--green-soft); }
.verdicts .v-held input:checked + .face::before { border-color: var(--green); background: var(--green); }
.verdicts .v-wob input:checked + .face { border-color: var(--gold); background: var(--gold-soft); }
.verdicts .v-wob input:checked + .face::before { border-color: var(--ink); background: var(--gold); }
.verdicts .v-gave input:checked + .face { border-color: var(--cardinal); background: var(--cardinal-soft); }
.verdicts .v-gave input:checked + .face::before { border-color: var(--cardinal); background: var(--cardinal); }
.parts { display: flex; gap: 8px; flex-wrap: wrap; }
.parts .card .face { padding: 8px 14px 8px 38px; box-shadow: none; }
.parts .card .face::before { top: 10px; left: 12px; width: 16px; height: 16px; }

.log { display: grid; gap: 10px; }
.log-item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.badge { font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 4px; white-space: nowrap; }
.badge.held { background: var(--green-soft); color: var(--green); border: 1px solid var(--green); }
.badge.wobbled { background: var(--gold-soft); color: var(--ink); border: 1px solid var(--gold); }
.badge.gave { background: var(--cardinal-soft); color: var(--cardinal); border: 1px solid var(--cardinal); }
.log-item .t { font-weight: 700; }
.log-item .d { color: var(--muted); font-size: 15px; }
.tally { display: flex; gap: 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }

details.optional { border: 1.5px dashed var(--line); border-radius: 8px; padding: 12px 16px; background: var(--surface); }
details.optional summary { cursor: pointer; font-weight: 700; }
details.optional[open] summary { margin-bottom: 10px; }

/* Plate */
.plate { display: grid; gap: 0; border: 1.5px solid var(--ink); border-radius: 12px; background: var(--surface); overflow: hidden; }
.plate-top { display: flex; align-items: center; gap: 16px; padding: 18px 20px; background: var(--cardinal); color: var(--surface); }
.plate-top img { width: 64px; height: 64px; object-fit: contain; }
.plate-top h3 { font-size: 28px; }
.plate-top .sub { opacity: .9; font-size: 16px; }
.plate-grid { display: grid; grid-template-columns: repeat(2, 1fr); }
.plate-cell { padding: 14px 20px; border-top: 1px solid var(--line); display: grid; gap: 6px; align-content: start; }
.plate-cell:nth-child(odd) { border-right: 1px solid var(--line); }
.plate-cell.wide { grid-column: 1 / -1; border-right: 0; }
.plate-cell .k { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.plate-cell pre { margin: 0; white-space: pre-wrap; font-family: var(--body); font-size: 15px; max-height: 240px; overflow: auto; }

/* Nav */
.nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 28px; margin-top: 10px; border-top: 1px solid var(--line); }
.footnote { margin-top: 26px; font-size: 14px; color: var(--muted); }

.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 15px; }


/* ---------- Kitchen theme ---------- */
.gingham {
  height: 16px;
  background-color: var(--surface);
  background-image: linear-gradient(90deg, rgba(153,0,0,.42) 50%, transparent 50%), linear-gradient(rgba(153,0,0,.42) 50%, transparent 50%);
  background-size: 16px 16px;
  margin-inline: -20px;
}
.brand img { width: 38px; height: 38px; }
.hero-img { aspect-ratio: 10 / 3; }
.menu-card {
  max-width: 720px; background: var(--surface); border: 4px double var(--ink); border-radius: 4px;
  padding: 18px 24px; display: grid; gap: 10px; box-shadow: var(--shadow);
}
.menu-title { font-family: var(--display); font-style: italic; font-size: 24px; text-align: center; color: var(--cardinal); }
.menu-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.menu-list li { display: flex; align-items: baseline; gap: 8px; }
.menu-list .dish { font-family: var(--display); font-size: 19px; }
.menu-list .analogy { font-style: italic; color: var(--muted); font-size: 17px; }
.menu-list .dots { flex: 1; border-bottom: 2px dotted var(--muted); transform: translateY(-4px); min-width: 20px; }
.menu-list .course { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.eyebrow::before { content: ""; display: inline-block; width: 18px; height: 18px; margin-right: 8px; vertical-align: -3px; background: var(--cardinal); -webkit-mask: radial-gradient(circle, #000 45%, transparent 46%); mask: radial-gradient(circle, #000 45%, transparent 46%); }
.step-head h2 { font-style: italic; }
.banner-img { aspect-ratio: 4 / 1; }
.cards .card .pic { width: 72px; height: 72px; }

/* Pantry: jar labels */
.cards.jars .face { border-radius: 16px 16px 8px 8px; border-top: 10px solid var(--gold); padding-top: 12px; }
.cards.jars .face::before { top: 14px; }
.cards.jars b { font-family: var(--display); font-size: 18px; }

/* Fresh: market tags */
.cards.plus .face, .cards.minus .face { border-style: dashed; padding-right: 38px; }
.cards.plus .face::after, .cards.minus .face::after {
  position: absolute; right: 12px; top: 8px; font-family: var(--display); font-weight: 700; font-size: 22px;
}
.cards.plus .face::after { content: "+"; color: var(--green); }
.cards.minus .face::after { content: "\2212"; color: var(--orange); }

/* Recipe: ruled index card */
.recipe-card {
  background-color: var(--surface);
  background-image: linear-gradient(90deg, transparent 46px, rgba(153,0,0,.35) 46px, rgba(153,0,0,.35) 48px, transparent 48px);
  border: 1.5px solid var(--line); border-radius: 6px; box-shadow: var(--shadow);
  padding: 0 22px 10px 64px;
}
.recipe-card-head {
  display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline;
  padding: 16px 0 10px; border-bottom: 2px solid var(--cardinal); margin-left: -16px;
}
.rc-title { font-family: var(--display); font-style: italic; font-size: 28px; font-weight: 700; color: var(--cardinal); }
.rc-serves { font-size: 15px; color: var(--muted); }
.recipe-card .recipe-row { border-top: 1px solid var(--line); }
.recipe-card .recipe-row:first-of-type { border-top: 0; }
.recipe-card textarea {
  background-color: transparent;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 29px, var(--blue-soft) 29px, var(--blue-soft) 30px);
  background-position: 0 11px; line-height: 30px; border-style: dashed;
}

/* Taste test: order tickets */
.cards.tickets .face {
  border-style: dashed; border-radius: 2px;
  background-image: radial-gradient(circle at 0 50%, var(--ground) 8px, transparent 9px), radial-gradient(circle at 100% 50%, var(--ground) 8px, transparent 9px);
}
.say { border-style: dashed; }

/* Plate: menu-style card */
.plate { border: 4px double var(--ink); border-radius: 6px; }
.plate-top { justify-content: center; text-align: center; }
.plate-top h3 { font-style: italic; }


.menu-card { margin-inline: auto; width: 100%; }
.hero h1 { text-align: center; }
.hero .lede { text-align: center; margin-inline: auto; }
.start-row { display: flex; justify-content: center; }
/* Start cooking: simmering pot */
.start-btn { padding: 12px 26px 12px 18px; font-size: 20px; gap: 14px; }
.start-btn .pot { position: relative; width: 52px; height: 52px; display: inline-block; }
.start-btn .pot-svg { width: 52px; height: 52px; display: block; transform-origin: 50% 90%; animation: simmer 1.6s ease-in-out infinite; }
.start-btn .steam { position: absolute; left: 0; right: 0; top: -14px; height: 22px; display: flex; justify-content: center; gap: 7px; }
.start-btn .steam i {
  display: block; width: 6px; height: 14px; border-radius: 50%;
  background: currentColor; opacity: 0; animation: steam 2.1s ease-out infinite;
}
.start-btn .steam i:nth-child(2) { animation-delay: .7s; }
.start-btn .steam i:nth-child(3) { animation-delay: 1.4s; }
.start-btn:hover .pot-svg, .start-btn:focus-visible .pot-svg { animation-duration: .6s; }
@keyframes simmer {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  25% { transform: rotate(-4deg) translateY(-1px); }
  75% { transform: rotate(4deg) translateY(-1px); }
}
@keyframes steam {
  0% { opacity: 0; transform: translateY(10px) scale(.6); }
  30% { opacity: .75; }
  100% { opacity: 0; transform: translateY(-14px) scale(1.2) translateX(3px); }
}
@media (prefers-reduced-motion: reduce) {
  .start-btn .pot-svg, .start-btn .steam i { animation: none; }
  .start-btn .steam i { opacity: .5; }
}

.ex-note { font-size: 15px; color: var(--ink); margin-bottom: 8px; white-space: nowrap; }
@media (max-width: 1000px) { .ex-note { white-space: normal; } }
.diner-ex { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ex-card { display: grid; gap: 4px; padding: 10px 14px; border: 1.5px dashed var(--line); border-radius: 8px; background: var(--surface); font-size: 16px; color: var(--muted); }
.ex-k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--cardinal); }
.cards.fixed .face { height: 192px; overflow: hidden; padding-bottom: 30px; }
.cards.fixed .face b, .cards.fixed .face small { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.cards.fixed .face b { -webkit-line-clamp: 2; }
.cards.fixed .face small { -webkit-line-clamp: 3; }
.cards.fixed .card.open .face { height: auto; min-height: 192px; }
.cards.fixed .card.open .face b, .cards.fixed .card.open .face small { -webkit-line-clamp: unset; display: block; }
.card .more {
  position: absolute; left: 40px; bottom: 7px; z-index: 2; border: 0; background: none; cursor: pointer;
  color: var(--cardinal); font-size: 13px; font-weight: 700; text-decoration: underline; padding: 2px 4px;
}
.draft-bar { margin: 0; font-size: 17px; font-weight: 700; padding: 12px 16px; border: 1.5px dashed var(--gold); background: var(--gold-soft); border-radius: 8px; }
.recipe-card textarea { min-height: 124px; overflow-y: hidden; resize: vertical; }
.recipe-card textarea#r-task, .recipe-card textarea#r-constraints { min-height: 214px; }
.own-card { align-items: stretch; }
.own-card textarea { min-height: 0; resize: vertical; padding: 10px 12px; border: 1.5px dashed var(--muted); border-radius: 8px; background: var(--surface); line-height: 1.45; }
.own-card .btn { align-self: flex-end; }
@media (max-width: 720px) {
  .progress { grid-template-columns: repeat(3, 1fr); }

  const MENU = [
    ["Take the order", "choose your AI tool and learner"],
    ["Pantry staples", "pick good tutoring moves"],

  /* ---------- State ---------- */

  const blank = () => ({

    pantry: [], plus: [], minus: [],

    tester: "", draft: { verdict: "", said: "", change: [] }, tests: [], compare: "",

  });
  let S = blank();
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  /* ---------- Helpers ---------- */
  const app = document.getElementById("app");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function img(file, cls, alt) { return `<img class="${cls}" data-img="${file}" alt="${esc(alt || "")}">`; }
  // Images arrive later from K. Until a file exists, its slot hides itself.
  function wireImages(root) {
    root.querySelectorAll("img[data-img]").forEach(el => {
      if (el.dataset.wired) return;
      el.dataset.wired = "1";
      el.addEventListener("error", () => { el.hidden = true; });
      el.src = "image/web/" + el.dataset.img;
    });
  }
  function kitchenName() {
    const k = KITCHENS.find(x => x.id === S.kitchen);

  }
  function dinerLevel() { const d = DINERS.find(x => x.id === S.diner); return d ? d.name : ""; }
  function allTesters() { return TESTERS.concat(S.ownTesters.map((m, i) => { const o = typeof m === "string" ? { name: "", msg: m } : m; return { id: "own" + i, name: o.name || "Our own tester", msg: o.msg, own: true }; })); }
  function recipeText() {
    return PARTS.map(p => `${p.name}: ${S.recipe[p.id].trim() || "(not written yet)"}`).join("\n\n");
  }
  function copyText(text, statusEl) {
    const done = ok => { if (statusEl) { statusEl.textContent = ok ? "Copied." : "Selected. Press Ctrl+C or ⌘C."; setTimeout(() => { statusEl.textContent = ""; }, 3000); } };
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta); done(ok);
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), fallback);
      else fallback();
    } catch (e) { fallback(); }
  }
  function cardList(items, group, type, extraCls) {
    return `<div class="cards fixed ${extraCls || ""}">` + items.map(([t, d], i) => {
      const id = `${group}-${i}`;
      const checked = S[group].includes(t) ? "checked" : "";
      return `<label class="card" for="${id}"><input type="${type}" id="${id}" data-group="${group}" value="${esc(t)}" ${checked}><span class="face"><b>${esc(t)}</b><small>${esc(d)}</small></span><button type="button" class="more" hidden aria-expanded="false">More</button></label>`;
    }).join("") + ownCards(group) + `</div>` + addOwn(group);
  }
  function ownKey(group) { return { pantry: "ownPantry", plus: "ownPlus", minus: "ownMinus" }[group]; }
  function ownCards(group) {
    return S[ownKey(group)].map((t, i) => {
      const id = `${group}-own-${i}`;
      const checked = S[group].includes(t) ? "checked" : "";
      return `<label class="card" for="${id}"><input type="checkbox" id="${id}" data-group="${group}" value="${esc(t)}" ${checked}><span class="face"><b>${esc(t)}</b><small>${esc((S.ownDesc && S.ownDesc[t]) || "Our own card")}</small></span><button type="button" class="more" hidden aria-expanded="false">More</button><button type="button" class="remove" data-remove="${group}" data-i="${i}" aria-label="Remove card: ${esc(t)}">Remove</button></label>`;
    }).join("");
  }
  function addOwn(group) {
    return `<div class="addown own-card"><textarea class="textin t-in" id="add-${group}" rows="2" placeholder="+ Your card\u2019s title" aria-label="Your card\u2019s title"></textarea><textarea class="textin d-in" id="addd-${group}" rows="4" placeholder="What it means (optional)" aria-label="What your card means"></textarea><button type="button" class="btn small" data-add="${group}">Add card</button></div>`;
  }
  function nav(backLabel, nextLabel, nextEnabled = true) {
    return `<div class="nav">${backLabel ? `<button type="button" class="btn ghost" data-go="${S.step - 1}">← ${backLabel}</button>` : "<span></span>"}${nextLabel ? `<button type="button" class="btn primary" data-go="${S.step + 1}" ${nextEnabled ? "" : "disabled"}>${nextLabel} →</button>` : ""}</div>`;
  }

  /* ---------- Views ---------- */
  function vLanding() {
    return `<section class="hero">
      ${img("01-kitchen-hero.jpg", "hero-img", "A warm kitchen")}
      <h1>The Learning Mode <em>Kitchen</em></h1>
      <p class="lede">Your group is going to design a learning mode: the instructions that turn an everyday AI chatbot into a tutor for one particular learner. You’ll pick your ingredients, write the recipe, and then taste-test it by playing the learner yourselves.</p>
      <div class="menu-card">
        <div class="menu-title">On today\u2019s menu</div>
        <ol class="menu-list">${MENU.map((m, i) => `<li><span class="dish">${esc(m[0])} <span class="analogy">(${esc(m[1])})</span></span><span class="dots" aria-hidden="true"></span><span class="course">Step ${i + 1}</span></li>`).join("")}</ol>
      </div>
      <div class="start-row"><button type="button" class="btn primary start-btn" data-go="1"><span class="pot" aria-hidden="true"><span class="steam"><i></i><i></i><i></i></span>${POT_SVG}</span><span>Start cooking →</span></button></div>
    </section>`;
  }
  function head(n, title, text, file) {
    return `<div class="step-head"><div><div class="eyebrow">Step ${n} · ${esc(STEPS[n - 1])}</div><h2>${title}</h2>${text ? `<p>${text}</p>` : ""}</div>${file ? img(file, "step-img", "") : ""}</div>`;
  }
  function dinerExamples() {
    return `<p class="ex-note">You can describe your learner in a specific way or a general way. Both work. Neither is better; it depends on what fits your design.</p><div class="diner-ex"><div class="ex-card"><span class="ex-k">Specific</span><span>A first-generation college sophomore in an intro statistics course who works 20 hours a week. She studies late at night, follows the ideas in class, and freezes when she has to choose which test to use.</span></div><div class="ex-card"><span class="ex-k">General</span><span>An undergraduate taking an intro statistics course.</span></div></div>`;
  }
  function v1() {
    const d = DINERS.find(x => x.id === S.diner);
    return `<section class="step">
      ${head(1, "Who are you cooking for, and where?", "")}
      <div class="group">
        <div class="group-head"><h3>Choose the AI tool your group will cook in.</h3></div>
        <div class="cards">${KITCHENS.map(k => `<label class="card" for="k-${k.id}"><input type="radio" name="kitchen" id="k-${k.id}" value="${k.id}" ${S.kitchen === k.id ? "checked" : ""}><span class="face">${img("02-stove.png", "pic", "")}<b>${esc(k.name)}</b><small>${esc(k.line)}</small></span></label>`).join("")}</div>
        <div class="field" ${S.kitchen === "other" ? "" : "hidden"} id="otherWrap"><label for="otherTool">Which tool?</label><input class="textin" id="otherTool" type="text" value="${esc(S.otherTool)}" placeholder="Type its name"></div>
      </div>
      <div class="group">
        <h3>Choose your learner’s level, then describe one learner.</h3>
        <div class="cards">${DINERS.map(x => `<label class="card" for="d-${x.id}"><input type="radio" name="diner" id="d-${x.id}" value="${x.id}" ${S.diner === x.id ? "checked" : ""}><span class="face">${img(x.img, "pic", "")}<b>${esc(x.name)}</b></span></label>`).join("")}</div>
        <div class="field"><label for="dinerText">Your learner</label><div id="dinerEx">${dinerExamples()}</div><textarea id="dinerText" placeholder="Describe your learner here.">${esc(S.dinerText)}</textarea></div>
        <p class="note">Please don’t use real student names or information. Your learner can be inspired by real students, but keep the details made up.</p>
      </div>
      ${nav("Back", "Open the pantry", !!S.kitchen && !!S.diner)}
    </section>`;
  }
  function v2() {
    return `<section class="step">
      ${img("07-pantry-staples.jpg", "banner-img", "")}
      ${head(2, "What do we already know about good tutoring?", "These ideas were true long before AI. Pick the ones that matter most for your learner. You don’t need them all, and you can add your own.")}
      ${cardList(PANTRY, "pantry", "checkbox", "jars")}
      ${nav("Take the order", "Fresh ingredients")}
    </section>`;
  }
  function v3() {
    return `<section class="step">
      ${img("14-fresh-ingredients.jpg", "banner-img", "")}
      ${head(3, "What changes in the AI era?", "Some things are new because the tutor is an AI. Add what your learner could gain (+), and choose what your design needs to guard against (−).")}
      <div class="group"><div class="group-head">${img("08-fresh-basket.png", "", "")}<h3>+ Add</h3></div>${cardList(PLUS, "plus", "checkbox", "plus")}</div>
      <div class="group"><div class="group-head">${img("09-warning.png", "", "")}<h3>− Guard against</h3></div>${cardList(MINUS, "minus", "checkbox", "minus")}</div>
      ${nav("Pantry staples", "Write the recipe")}
    </section>`;
  }
  function chips(list, cls, sign) {
    return list.length ? `<div class="chips">${list.map(t => `<span class="chip ${cls}">${sign ? `<span class="sign">${sign}</span>` : ""}${esc(t)}</span>`).join("")}</div>` : "";
  }
  function reminderFor(id) {
    const dinerChip = S.diner ? chips([dinerLevel() + (S.dinerText.trim() ? ": " + S.dinerText.trim() : "")], "", "") : "";
    const m = {
      role: [["Your kitchen and diner", chips([kitchenName()].filter(Boolean), "", "") + dinerChip]],
      context: [["Your diner", dinerChip]],
      task: [["Pantry staples", chips(S.pantry, "p", "")], ["+ Add", chips(S.plus, "plus", "+")]],
      format: [["Keep in mind", chips(S.minus.filter(t => t === "A wall of text"), "minus", "−") + chips([dinerLevel()].filter(Boolean), "", "")]],
      constraints: [["− Guard against", chips(S.minus, "minus", "−")]]
    }[id];
    return m.map(([t, c]) => `<div class="rtitle">${esc(t)}</div>${c || `<span class="none">No cards picked for this yet.</span>`}`).join("");
  }
  // First draft from the group's own picks. Only empty boxes are filled.
  const LEVEL_AS = { k8: "an elementary or middle school student", hs: "a high school student", ug: "an undergraduate student", grad: "a graduate student" };
  function cardLine(t) {
    const hit = PANTRY.concat(PLUS, MINUS).find(x => x[0] === t);
    if (hit) return `${t}: ${hit[1]}`;
    const own = S.ownDesc && S.ownDesc[t];
    return own ? `${t}: ${own}` : t;
  }
  function autoGrow(ta) {
    if (!ta) return;
    ta.style.height = "auto";
    ta.style.height = (ta.scrollHeight + 4) + "px";
  }
  function growAll() { document.querySelectorAll(".recipe-card textarea").forEach(autoGrow); }
  function buildDraft() {
    const d = {};
    d.role = `You are a patient, encouraging tutor for ${LEVEL_AS[S.diner] || "my learner"}.`;
    d.context = S.dinerText.trim() ? `My learner: ${S.dinerText.trim()}` : "";
    const task = S.pantry.concat(S.plus);
    d.task = task.length ? "In every conversation:\n" + task.map(t => "- " + cardLine(t)).join("\n") : "";
    d.format = S.minus.includes("A wall of text") ? "Keep replies short and simple for this learner. Ask one question at a time." : "";
    d.constraints = S.minus.length ? "Guard against these:\n" + S.minus.map(t => "- " + cardLine(t)).join("\n") : "";
    PARTS.forEach(p => { if (!S.recipe[p.id].trim() && d[p.id]) S.recipe[p.id] = d[p.id]; });
    save();
  }
  function v4() {
    return `<section class="step">
      ${head(4, "Write your learning mode", "Now turn your ingredients into instructions, using the same five parts from Week 4. Your chosen cards appear beside each box as reminders, but the words are yours.", "10-recipe-book.png")}
      <p class="draft-bar">We\u2019ve started a first draft from your cards. Rewrite each line for your learner.</p>
      <div class="recipe-card">
        <div class="recipe-card-head"><span class="rc-title">Recipe card</span><span class="rc-serves">Serves: ${esc(dinerLevel() || "your diner")}${kitchenName() ? " \u00B7 Kitchen: " + esc(kitchenName()) : ""}</span></div>
        ${PARTS.map(p => `<div class="recipe-row"><div class="field"><label class="part" for="r-${p.id}">${p.name}</label><span class="hint" id="h-${p.id}">${esc(p.hint)}</span><textarea id="r-${p.id}" data-part="${p.id}" aria-describedby="h-${p.id}">${esc(S.recipe[p.id])}</textarea></div><div class="reminders">${reminderFor(p.id)}</div></div>`).join("")}
      </div>
      <div class="output">
        <div class="output-head"><b>Your full recipe</b><span><span class="copied" id="copyRecipeMsg" role="status"></span> <button type="button" class="btn small" id="copyRecipe">Copy recipe</button></span></div>
        <pre id="recipeOut">${esc(recipeText())}</pre>
      </div>
      <p class="note">Paste the recipe as your first message in a new chat, then start talking to it as your learner.</p>
      ${nav("Fresh ingredients", "Go to the taste test")}
    </section>`;
  }
  function v5() {
    const all = allTesters();
    const t = all.find(x => x.id === S.tester);
    const counts = { held: 0, wobbled: 0, gave: 0 };
    S.tests.forEach(x => { counts[x.verdict] = (counts[x.verdict] || 0) + 1; });
    return `<section class="step">
      ${img("15-utensil-wall.jpg", "banner-img", "")}
      ${head(5, "Play the learner", "Take turns playing your learner. Start the conversation the way your learner would, for example by asking for help with a problem or a topic, and go back and forth with the AI for a few turns. Then, when it feels natural, pick a tester card and send its message in your learner’s voice. See what happens, and decide whether the recipe needs fixing.", "11-tasting-spoon.png")}
      <div class="cards testers tickets">${all.map(x => `<label class="card" for="t-${x.id}"><input type="radio" name="tester" id="t-${x.id}" value="${x.id}" ${S.tester === x.id ? "checked" : ""}><span class="face"><b>${esc(x.name)}</b><span class="msg">“${esc(x.msg)}”</span>${x.note ? `<small>${esc(x.note)}</small>` : ""}</span></label>`).join("")}</div>
      <div class="addown own-card"><textarea class="textin t-in" id="addn-tester" rows="2" placeholder="+ Your tester\u2019s name (for example, The perfectionist)" aria-label="Your tester\u2019s name"></textarea><textarea class="textin d-in" id="add-tester" rows="4" placeholder="What the learner says" aria-label="What the learner says"></textarea><button type="button" class="btn small" data-add="tester">Add tester</button></div>
      ${t ? `<div class="say"><span class="who">When the moment feels right, send this in your learner’s voice</span><q>${esc(t.msg)}</q>${t.note ? `<span class="muted">${esc(t.note)}</span>` : ""}<span><button type="button" class="btn small" id="copyTester">Copy message</button> <span class="copied" id="copyTesterMsg" role="status"></span></span></div>
      <div class="group">
        <h3>Record this test</h3>
        <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="label">Did it adhere to your design?</legend>
          <div class="verdicts">${VERDICTS.map(v => `<label class="card ${v.cls}" for="v-${v.id}"><input type="radio" name="verdict" id="v-${v.id}" value="${v.id}" ${S.draft.verdict === v.id ? "checked" : ""}><span class="face"><b>${v.name}</b></span></label>`).join("")}</div>
        </fieldset>
        <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="label">What would you change?</legend>
          <div class="parts">${PARTS.map(p => `<label class="card" for="c-${p.id}"><input type="checkbox" id="c-${p.id}" value="${p.id}" data-change ${S.draft.change.includes(p.id) ? "checked" : ""}><span class="face"><b>${p.name}</b></span></label>`).join("")}</div>
        </fieldset>
        <div><button type="button" class="btn primary" id="saveTest" ${S.draft.verdict ? "" : "disabled"}>Save this test</button></div>
      </div>` : `<p class="note">Pick a tester card to start.</p>`}
      ${S.tests.length ? `<div class="group"><h3>Tests so far</h3>
        <div class="tally"><span class="badge held">Full adherence ${counts.held}</span><span class="badge wobbled">Partial adherence ${counts.wobbled}</span><span class="badge gave">Non-adherence ${counts.gave}</span></div>
        <div class="log">${S.tests.map((x, i) => `<div class="log-item"><span class="badge ${x.verdict}">${VERDICTS.find(v => v.id === x.verdict).name}</span><div><div class="t">${esc(x.tester)}</div>${x.said ? `<div class="d">“${esc(x.said)}”</div>` : ""}${x.change.length ? `<div class="d">Change: ${x.change.map(c => PARTS.find(p => p.id === c).name).join(", ")}</div>` : ""}</div><button type="button" class="btn small ghost" data-deltest="${i}" aria-label="Delete test ${i + 1}">Delete</button></div>`).join("")}</div>
        <div class="nav" style="border:0;padding-top:4px"><button type="button" class="btn" data-go="4">← Edit the recipe</button><button type="button" class="btn" id="testAgain">Test again</button></div>
      </div>` : ""}
      <details class="optional" ${S.compare ? "open" : ""}><summary>Optional: try the built-in mode</summary>
        <div class="field"><label for="compare">Try the same tester card in your kitchen’s built-in learning mode. Which one handled it better, and why?</label><textarea id="compare">${esc(S.compare)}</textarea></div>
      </details>
      ${nav("Write the recipe", "Plate it")}
    </section>`;
  }
  function plateText() {
    const counts = { held: 0, wobbled: 0, gave: 0 };
    S.tests.forEach(x => { counts[x.verdict]++; });
    const L = [];
    L.push("OUR LEARNING MODE PLATE");
    L.push("Kitchen: " + (kitchenName() || "(not chosen)"));
    L.push("Diner: " + (dinerLevel() || "(not chosen)") + (S.dinerText.trim() ? ". " + S.dinerText.trim() : ""));
    L.push("Pantry staples: " + (S.pantry.join("; ") || "(none)"));
    L.push("+ Added: " + (S.plus.join("; ") || "(none)"));
    L.push("− Guarded against: " + (S.minus.join("; ") || "(none)"));
    L.push("Taste test: " + `${counts.held} full adherence, ${counts.wobbled} partial adherence, ${counts.gave} non-adherence`);
    L.push("");
    L.push("One thing our learning mode will never do: " + (S.never.trim() || "___"));
    L.push("One moment it didn’t hold up, and what we changed: " + (S.moment.trim() || "___"));
    L.push("Who does this learning mode serve best, and who might it leave out? " + (S.serves.trim() || "___"));
    L.push("");
    L.push("RECIPE");
    L.push(recipeText());
    return L.join("\n");
  }
  function v6() {
    const counts = { held: 0, wobbled: 0, gave: 0 };
    S.tests.forEach(x => { counts[x.verdict]++; });
    const list = (a, cls, sign) => a.length ? chips(a, cls, sign) : `<span class="none">None picked</span>`;
    return `<section class="step">
      ${head(6, "Your plate", "Fill in the three lines below. Everything else is already on the plate.")}
      <div class="group">
        <div class="field"><label for="never">One thing our learning mode will never do</label><textarea id="never">${esc(S.never)}</textarea></div>
        <div class="field"><label for="moment">One moment it didn’t hold up, and what we changed</label><textarea id="moment">${esc(S.moment)}</textarea></div>
        <div class="field"><label for="serves">Who does this learning mode serve best, and who might it leave out?</label><textarea id="serves">${esc(S.serves)}</textarea></div>
      </div>
      <div class="plate" id="plate">
        <div class="plate-top">${img("12-plate-cloche.png", "", "")}<div><h3>Our learning mode</h3><div class="sub">Cooked in ${esc(kitchenName() || "(no kitchen chosen)")} for ${esc(dinerLevel() || "(no diner chosen)")}</div></div></div>
        <div class="plate-grid">
          <div class="plate-cell wide"><span class="k">Diner</span><span>${esc(S.dinerText.trim() || "No description yet.")}</span></div>
          <div class="plate-cell"><span class="k">Pantry staples</span>${list(S.pantry, "p", "")}</div>
          <div class="plate-cell"><span class="k">Fresh ingredients</span>${list(S.plus, "plus", "+")}${list(S.minus, "minus", "−")}</div>
          <div class="plate-cell"><span class="k">Taste test</span><div class="tally"><span class="badge held">Full adherence ${counts.held}</span><span class="badge wobbled">Partial adherence ${counts.wobbled}</span><span class="badge gave">Non-adherence ${counts.gave}</span></div></div>
          <div class="plate-cell"><span class="k">Will never do</span><span id="pNever">${esc(S.never.trim() || "___")}</span></div>
          <div class="plate-cell"><span class="k">Didn’t hold up, so we changed</span><span id="pMoment">${esc(S.moment.trim() || "___")}</span></div>
          <div class="plate-cell"><span class="k">Serves best, might leave out</span><span id="pServes">${esc(S.serves.trim() || "___")}</span></div>
          <div class="plate-cell wide"><span class="k">Final recipe</span><pre>${esc(recipeText())}</pre></div>
        </div>
      </div>
      <div class="confirm"><button type="button" class="btn primary" id="copyPlate">Copy plate</button><button type="button" class="btn" id="copyRecipe2">Copy recipe for the Prompt Library</button><span class="copied" id="copyPlateMsg" role="status"></span></div>
      ${nav("Taste test", "")}
    </section>`;
  }

  /* ---------- Render ---------- */
  const VIEWS = [vLanding, v1, v2, v3, v4, v5, v6];
  const prog = document.getElementById("progress");
  function render(focusTop) {
    S.step = Math.max(0, Math.min(6, S.step));
    if (S.step === 4) buildDraft();
    app.innerHTML = VIEWS[S.step]();
    prog.hidden = S.step === 0;
    prog.innerHTML = STEPS.map((s, i) => {
      const n = i + 1;
      const cls = n === S.step ? "current" : (n < S.step ? "done" : "");
      return `<li class="${cls}"><button type="button" data-go="${n}" ${n === S.step ? 'aria-current="step"' : ""}><span><span class="num">${n}</span> ${esc(s)}</span></button></li>`;
    }).join("");
    wireImages(document);
    fitCards();
    growAll();
    if (focusTop) {
      window.scrollTo({ top: 0, behavior: "auto" });
      const h = app.querySelector("h1, h2"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
    }
  }
  function go(n) { S.step = n; save(); render(true); }

  /* ---------- Events ---------- */
  // Equal-size cards: show More only where text is cut off.
  function fitCards() {
    document.querySelectorAll(".cards.fixed .card").forEach(c => {
      const b = c.querySelector(".more"); if (!b) return;
      if (c.classList.contains("open")) { b.hidden = false; return; }
      b.hidden = ![...c.querySelectorAll(".face b, .face small")].some(el => el.scrollHeight > el.clientHeight + 1);
    });
  }
  window.addEventListener("resize", fitCards);
  try { document.fonts && document.fonts.ready.then(fitCards); } catch (e) {}

  document.addEventListener("click", e => {
    const more = e.target.closest(".more");
    if (more) {
      e.preventDefault(); e.stopPropagation();
      const c = more.closest(".card"); const open = !c.classList.contains("open");
      c.classList.toggle("open", open); more.textContent = open ? "Less" : "More"; more.setAttribute("aria-expanded", open);
      if (!open) fitCards();
      return;
    }
    const g = e.target.closest("[data-go]");
    if (g && !g.disabled) { go(+g.dataset.go); return; }
    const add = e.target.closest("[data-add]");
    if (add) {
      const grp = add.dataset.add;
      const input = document.getElementById("add-" + grp);
      const v = input.value.trim();
      if (!v) { input.focus(); return; }
      if (grp === "tester") {
        const nIn = document.getElementById("addn-tester"); const nv = nIn ? nIn.value.trim() : "";
        S.ownTesters.push({ name: nv, msg: v }); S.tester = "own" + (S.ownTesters.length - 1);
      }
      else {
        const k = ownKey(grp); if (!S[k].includes(v)) S[k].push(v); if (!S[grp].includes(v)) S[grp].push(v);
        const dIn = document.getElementById("addd-" + grp); const dv = dIn ? dIn.value.trim() : "";
        if (!S.ownDesc) S.ownDesc = {};
        if (dv) S.ownDesc[v] = dv; else delete S.ownDesc[v];
      }
      save(); render(false);
      const again = document.getElementById("add-" + grp); if (again) { again.value = ""; again.focus(); }
      const againD = document.getElementById("addd-" + grp); if (againD) againD.value = "";
      const againN = document.getElementById("addn-" + grp); if (againN) { againN.value = ""; if (grp === "tester") againN.focus(); }
      return;
    }
    const rm = e.target.closest("[data-remove]");
    if (rm) {
      e.preventDefault();
      const grp = rm.dataset.remove, k = ownKey(grp), t = S[k][+rm.dataset.i];
      S[k].splice(+rm.dataset.i, 1); S[grp] = S[grp].filter(x => x !== t);
      save(); render(false); return;
    }
    if (e.target.id === "copyRecipe") { copyText(recipeText(), document.getElementById("copyRecipeMsg")); return; }
    if (e.target.id === "copyRecipe2") { copyText(recipeText(), document.getElementById("copyPlateMsg")); return; }
    if (e.target.id === "copyPlate") { copyText(plateText(), document.getElementById("copyPlateMsg")); return; }
    if (e.target.id === "copyTester") { const t = allTesters().find(x => x.id === S.tester); if (t) copyText(t.msg, document.getElementById("copyTesterMsg")); return; }
    if (e.target.id === "saveTest") {
      const t = allTesters().find(x => x.id === S.tester);
      if (!t || !S.draft.verdict) return;
      S.tests.push({ tester: t.name + (t.own ? ": " + t.msg : ""), verdict: S.draft.verdict, said: S.draft.said.trim(), change: S.draft.change.slice() });
      S.draft = { verdict: "", said: "", change: [] };
      save(); render(false); return;
    }
    if (e.target.id === "testAgain") { S.draft = { verdict: "", said: "", change: [] }; S.tester = ""; save(); render(false); window.scrollTo({ top: 0 }); return; }
    const del = e.target.closest("[data-deltest]");
    if (del) { S.tests.splice(+del.dataset.deltest, 1); save(); render(false); return; }
    if (e.target.id === "resetBtn") {
      document.getElementById("resetZone").innerHTML = `<span class="confirm">Clear everything on this page? <button type="button" class="btn small primary" id="resetYes">Yes, start over</button><button type="button" class="btn small ghost" id="resetNo">Keep my work</button></span>`;
      return;
    }
    if (e.target.id === "resetYes") { S = blank(); try { localStorage.removeItem(KEY); } catch (err) {} restoreReset(); render(true); return; }
    if (e.target.id === "resetNo") { restoreReset(); return; }
  });
  function restoreReset() { document.getElementById("resetZone").innerHTML = `<button class="btn small ghost" id="resetBtn" type="button">Start over</button>`; }

  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.target.matches(".addown input") || (e.target.matches(".addown textarea") && (e.metaKey || e.ctrlKey)))) {
      e.preventDefault();
      const btn = e.target.parentElement.querySelector("[data-add]"); if (btn) btn.click();
    }
  });

  document.addEventListener("change", e => {
    const t = e.target;
    if (t.name === "kitchen") { S.kitchen = t.value; save(); updateStep1(); return; }
    if (t.name === "diner") { S.diner = t.value; save(); updateStep1(); return; }
    if (t.dataset.group) {
      const g = t.dataset.group;
      if (t.checked) { if (!S[g].includes(t.value)) S[g].push(t.value); } else S[g] = S[g].filter(x => x !== t.value);
      save(); return;
    }
    if (t.name === "tester") { S.tester = t.value; S.draft = { verdict: "", said: "", change: [] }; save(); render(false); document.getElementById("t-" + t.value).focus(); return; }
    if (t.name === "verdict") { S.draft.verdict = t.value; save(); const b = document.getElementById("saveTest"); if (b) b.disabled = false; return; }
    if (t.hasAttribute("data-change")) {
      if (t.checked) S.draft.change.push(t.value); else S.draft.change = S.draft.change.filter(x => x !== t.value);
      save(); return;
    }
  });

  document.addEventListener("input", e => {
    const t = e.target;
    if (t.id === "otherTool") { S.otherTool = t.value; }
    else if (t.id === "dinerText") { S.dinerText = t.value; }
    else if (t.dataset.part) { S.recipe[t.dataset.part] = t.value; autoGrow(t); const o = document.getElementById("recipeOut"); if (o) o.textContent = recipeText(); }
    else if (t.id === "said") { S.draft.said = t.value; }
    else if (t.id === "compare") { S.compare = t.value; }
    else if (t.id === "never") { S.never = t.value; document.getElementById("pNever").textContent = t.value.trim() || "___"; }
    else if (t.id === "moment") { S.moment = t.value; document.getElementById("pMoment").textContent = t.value.trim() || "___"; }
    else if (t.id === "serves") { S.serves = t.value; document.getElementById("pServes").textContent = t.value.trim() || "___"; }
    else return;
    save();
  });

  // Step 1 updates in place, so picking a card never redraws the page.
  function updateStep1() {
    const w = document.getElementById("otherWrap"); if (w) w.hidden = S.kitchen !== "other";
    const d = DINERS.find(x => x.id === S.diner);
    const next = app.querySelector('.nav [data-go="2"]'); if (next) next.disabled = !(S.kitchen && S.diner);
  }

  render(false);
})();
</script>
