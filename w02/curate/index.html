<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Curate the Training Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400&display=swap">
<style>
:root{--paper:#EDEFEE;--surface:#F8FAF9;--raised:#FFF;--ink:#121A18;--ink-2:#4C5854;--ink-3:#85938F;
 --line:#C6CFCB;--line-soft:#DDE3E0;--accent:#0E6E68;--accent-ink:#FFF;--accent-soft:#D6E8E5;
 --keep:#0E6E68;--maybe:#9A5C0E;--drop:#A32E22;--maybe-soft:#F2E4CE;--drop-soft:#F5DED9;
 --load:#9A5C0E;--load-soft:#F2E4CE;--stop:#A32E22;--stop-soft:#F5DED9;--r:3px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0C1211;--surface:#141C1A;--raised:#1B2523;
 --ink:#E2E8E6;--ink-2:#93A19D;--ink-3:#6B7A76;--line:#26312E;--line-soft:#1E2726;--accent:#4FC7BC;
 --accent-ink:#0C1211;--accent-soft:#17332F;--keep:#4FC7BC;--maybe:#E0A44A;--drop:#FF7A62;
 --maybe-soft:#33260F;--drop-soft:#331C18;--load:#E0A44A;--load-soft:#33260F;--stop:#FF7A62;--stop-soft:#331C18}}
:root[data-theme="dark"]{--paper:#0C1211;--surface:#141C1A;--raised:#1B2523;--ink:#E2E8E6;--ink-2:#93A19D;
 --ink-3:#6B7A76;--line:#26312E;--line-soft:#1E2726;--accent:#4FC7BC;--accent-ink:#0C1211;--accent-soft:#17332F;
 --keep:#4FC7BC;--maybe:#E0A44A;--drop:#FF7A62;--maybe-soft:#33260F;--drop-soft:#331C18;--load:#E0A44A;--load-soft:#33260F;--stop:#FF7A62;--stop-soft:#331C18}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
 font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.028em}b,strong{font-weight:600}p{margin:0}button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0)}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}

.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:44px 26px;max-width:1000px;margin:0 auto;text-align:center}
.stage.wide{max-width:1180px}
.stage.left{align-items:stretch;text-align:left;justify-content:flex-start;padding-top:26px}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
 color:var(--ink-3);font-weight:500}
h1.big{font-size:clamp(30px,5vw,50px);font-weight:600;line-height:1.05;margin-top:14px;letter-spacing:-.04em}
.lede{font-family:"Newsreader",Georgia,serif;font-size:clamp(19px,2.3vw,23px);line-height:1.5;color:var(--ink-2);
 max-width:56ch;margin:18px auto 0}
.stage.left .lede{margin-left:0}
.go{margin-top:40px;width:66px;height:66px;border-radius:50%;border:1px solid var(--accent);background:var(--accent);
 color:var(--accent-ink);font-size:27px;cursor:pointer;display:grid;place-items:center;line-height:1}
.go:hover{filter:brightness(1.09)}
.go:disabled{opacity:.32;cursor:not-allowed}
.go.sm{width:auto;height:auto;border-radius:var(--r);padding:12px 26px;font-size:16px;font-weight:600}
.back{position:fixed;left:16px;top:16px;z-index:30;all:unset;font-family:"JetBrains Mono",monospace;font-size:12px;
 color:var(--ink-3);cursor:pointer;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.back:hover{color:var(--accent);border-color:var(--accent)}

.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px;margin-top:34px;width:100%;text-align:left}
.tcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:24px 26px;cursor:pointer;
 display:flex;flex-direction:column;gap:12px}
.tcard:hover{border-color:var(--accent)}
.tcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.tcard .u{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tcard h2{font-size:21px;line-height:1.22}
.tcard .pur{border-top:1px solid var(--line-soft);padding-top:12px;font-size:15px;color:var(--ink-2);line-height:1.5}
.tcard .pur b{color:var(--ink);display:block;font-family:"JetBrains Mono",monospace;font-size:10px;
 letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;font-weight:500}

.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:26px;text-align:left}
.def{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:17px 19px}
.def h3{font-size:15px;color:var(--accent)}
.def ul{margin:9px 0 0;padding-left:17px;display:flex;flex-direction:column;gap:6px}
.def li{font-size:14px;color:var(--ink-2);line-height:1.45}
.def li b{color:var(--ink)}
.setsize{display:flex;gap:11px;margin-top:22px}
.ss{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:13px 18px;cursor:pointer;
 text-align:left;display:flex;flex-direction:column;gap:2px}
.ss:hover{border-color:var(--accent)}
.ss[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ss b{font-size:15px}
.ss span{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-3)}
.rules{margin-top:26px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:20px 24px;text-align:left}
.rules h3{font-size:15px}
.rules ol{margin:13px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.rules li{font-size:15.5px;color:var(--ink-2);line-height:1.5}
.rules li b{color:var(--ink)}

.topbar{position:fixed;top:0;left:0;right:0;z-index:20}
.hud{position:relative;background:var(--paper);border-bottom:1px solid var(--line);
 padding:9px 20px;display:flex;align-items:center;gap:14px}
.hud .n{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--ink-3)}
.hud .grow{flex:1}
.clock{font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.clock.low{color:var(--drop)}
.clock.idle{color:var(--ink-3)}
.gostart{padding:7px 15px;font-size:13.5px}
.icon{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);
 border-radius:var(--r);font-size:15px;color:var(--ink-2)}
.icon:hover{border-color:var(--accent);color:var(--accent)}
.strip{display:flex;gap:3px;flex-wrap:wrap;padding:8px 20px 8px;position:relative;z-index:19;
 background:var(--paper);border-bottom:1px solid var(--line)}
.pip{all:unset;cursor:pointer;min-width:23px;height:20px;display:grid;place-items:center;border-radius:2px;
 border:1px solid var(--line);font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-3);background:var(--raised)}
.pip[data-d="keep"]{background:var(--keep);border-color:var(--keep);color:var(--accent-ink);font-weight:600}
.pip[data-d="drop"]{background:var(--drop);border-color:var(--drop);color:var(--paper);font-weight:600}
.pip[aria-current="true"]{outline:2.5px solid var(--ink);outline-offset:1px}

.deck2{padding:150px 20px 130px;max-width:820px;margin:0 auto}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:26px 30px;
 animation:slide .22s ease}
@keyframes slide{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.card .meta{display:flex;gap:9px;flex-wrap:wrap;align-items:baseline;font-family:"JetBrains Mono",monospace;
 font-size:11px;color:var(--ink-3)}
.card .meta .pub{color:var(--ink-2);font-weight:600;font-size:12px}
.card h2{font-size:22px;margin-top:11px;line-height:1.25}
.card .snip{font-family:"Newsreader",Georgia,serif;font-size:17.5px;color:var(--ink-2);margin-top:11px;line-height:1.55}
.card .full{font-family:"Newsreader",Georgia,serif;font-size:16.5px;color:var(--ink-2);margin-top:13px;line-height:1.6;
 border-top:1px solid var(--line-soft);padding-top:13px}
.seemore{all:unset;font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
 color:var(--ink-3);border:1px solid var(--line);border-radius:2px;padding:5px 10px;cursor:pointer;margin-top:13px;display:inline-block}
.seemore:hover{border-color:var(--accent);color:var(--accent)}
.labels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px 18px;margin-top:22px;
 border-top:1px solid var(--line-soft);padding-top:17px}
.lb .h{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
 color:var(--ink-3);margin-bottom:5px}
select{width:100%;font:inherit;font-size:14.5px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);
 background:var(--raised);color:var(--ink)}
.chk{display:flex;flex-wrap:wrap;gap:5px}
.fl{border:1px solid var(--line);background:var(--raised);border-radius:2px;font-family:"JetBrains Mono",monospace;
 font-size:10.5px;padding:5px 9px;cursor:pointer;color:var(--ink-2)}
.fl[aria-pressed="true"]{background:var(--maybe);color:var(--paper);border-color:var(--maybe);font-weight:600}
.dec{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -6px 18px -14px rgba(0,0,0,.35);
 padding:12px 20px;display:flex;gap:11px;align-items:center;justify-content:center}
.d{flex:1;max-width:210px;border:1px solid var(--line);background:var(--raised);border-radius:var(--r);
 padding:13px 10px;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.d[data-v="keep"]:hover,.d[data-v="keep"][aria-pressed="true"]{background:var(--keep);color:var(--accent-ink);border-color:var(--keep)}
.d[data-v="drop"]:hover,.d[data-v="drop"][aria-pressed="true"]{background:var(--drop);color:var(--paper);border-color:var(--drop)}
.submit{white-space:nowrap;padding:13px 22px}
.decmid{display:flex;gap:11px;justify-content:center}
.dec{justify-content:center}
.dec .d{flex:none;width:172px;max-width:none}
.submit{position:absolute;right:20px;top:50%;transform:translateY(-50%)}
.ov{position:fixed;inset:0;background:rgba(10,16,15,.62);z-index:60;display:grid;place-items:center;padding:24px}
.ovbox{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);max-width:840px;width:100%;
 max-height:86vh;overflow:auto;padding:28px 32px;text-align:left}
.ovbox h2{font-size:20px}
.mb{border:1px solid var(--maybe);background:var(--maybe-soft);border-radius:var(--r);padding:14px 16px;margin-top:11px}
.mb .t{font-size:15.5px;font-weight:600;line-height:1.3}
.mb .m{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--ink-3);margin-top:3px}
.mb .two{display:flex;gap:8px;margin-top:10px}
.mb .two button{flex:1;border:1px solid var(--line);background:var(--raised);border-radius:var(--r);padding:8px;
 font-size:13.5px;cursor:pointer}
.mb .two button[data-v="keep"]:hover{background:var(--keep);color:var(--accent-ink);border-color:var(--keep)}
.mb .two button[data-v="drop"]:hover{background:var(--drop);color:var(--paper);border-color:var(--drop)}
.scorecard{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px;margin-top:20px;text-align:left}
.sc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 18px}
.sc .n{font-family:"JetBrains Mono",monospace;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
.sc.bad .n{color:var(--drop)}
.sc .l{font-size:13.5px;color:var(--ink-2);margin-top:3px;line-height:1.4}
.q{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 19px;margin-top:12px;text-align:left}
.q h3{font-size:16px;line-height:1.35}
.srcs{display:flex;flex-direction:column;gap:4px;margin-top:11px}
.s1{display:grid;grid-template-columns:44px 88px 1fr 118px;gap:9px;align-items:center;font-size:12.5px;
 padding:6px 9px;border:1px solid var(--line-soft);border-radius:2px;background:var(--raised)}
.s1.bad{border-color:var(--drop);background:var(--drop-soft)}
.s1 .sid{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-3)}
.s1 .sp{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--ink-2)}
.s1 .st{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s1 .sf{font-family:"JetBrains Mono",monospace;font-size:10.5px;text-align:right;color:var(--ink-3)}
.s1.bad .sf{color:var(--drop);font-weight:600}
.assoc{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.arow{display:grid;grid-template-columns:150px 1fr 74px;gap:9px;align-items:center;font-size:13px}
.arow .w{font-family:"JetBrains Mono",monospace;color:var(--ink);font-weight:600}
.arow .track{height:10px;background:var(--line-soft);border-radius:2px;overflow:hidden}
.arow .fill{height:100%;background:var(--accent)}
.arow .from{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--ink-3);text-align:right}
.silent{border-left:3px solid var(--drop);background:var(--drop-soft);padding:11px 15px;margin-top:10px;font-size:14.5px;color:var(--ink-2)}
.warn{border-left:3px solid var(--drop);background:var(--drop-soft);padding:15px 19px;margin-top:14px;text-align:left}
.warn h3{font-size:16px;color:var(--drop)}
.warn p{font-size:15px;color:var(--ink-2);margin-top:7px;line-height:1.5}
textarea{width:100%;background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);
 padding:11px 13px;font-family:"JetBrains Mono",monospace;font-size:13px;line-height:1.6;resize:vertical}
.out{border:1px solid var(--line);border-radius:var(--r);background:var(--raised);padding:15px 17px;
 font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1.65;white-space:pre-wrap;margin-top:13px;
 max-height:230px;overflow:auto;text-align:left}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:var(--r);
 padding:11px 20px;font-size:15px;line-height:20px;font-weight:600;cursor:pointer}
.btn.sec{background:none;color:var(--ink-2);border-color:var(--line);font-weight:400;font-size:14px;line-height:20px;padding:11px 16px}
.actions{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap;justify-content:flex-start;align-items:center}
.actions .go{margin-top:0}
.dprog .go{margin-top:0}
.nudge .ghostbtn{margin-top:0}
.grid3 .def{display:flex;flex-direction:column}
.grid3 .def .fold{margin-top:auto;align-self:flex-start}
.grid3 .def ul{margin-bottom:12px}
.rows{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left}
.rw{display:grid;grid-template-columns:48px 1fr 118px 118px 118px;gap:9px;padding:8px 12px;
 border-bottom:1px solid var(--line-soft);font-size:12.5px;align-items:center}
.rw:last-child{border-bottom:0}
.rw.h{background:var(--surface);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.06em;
 text-transform:uppercase;color:var(--ink-3)}
.rw .id{font-family:"JetBrains Mono",monospace;color:var(--ink-3);font-size:11px}
.rw .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hit{color:var(--keep);font-weight:600}.miss{color:var(--drop);font-weight:600}
.idtag{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.05em;color:var(--accent);
 border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:2px;padding:1px 6px;font-weight:600}
.hl{font:inherit;border:0;background:var(--drop-soft);border-bottom:2px solid var(--drop);color:inherit;
 padding:0 2px;border-radius:2px;cursor:pointer;text-align:inherit}
.hl.good{background:var(--accent-soft);border-bottom-color:var(--keep)}
.hl[aria-expanded="true"]{outline:2px solid var(--drop);outline-offset:1px}
.hl.good[aria-expanded="true"]{outline-color:var(--keep)}
.hlnote{border-left:3px solid var(--drop);background:var(--drop-soft);margin-top:9px;padding:9px 13px;border-radius:var(--r)}
.hlnote.good{border-left-color:var(--keep);background:var(--accent-soft)}
.hlnote ul{margin:0;padding-left:17px}
.hlnote li{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin:3px 0;font-family:"IBM Plex Sans",sans-serif}
.atext{font-family:"Newsreader",Georgia,serif;font-size:15.5px;line-height:1.65;color:var(--ink-2);margin-top:10px}
.kbul{margin-top:12px;border-top:1px dashed var(--line);padding-top:9px}
.kh{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.kbul ul{margin:7px 0 0;padding-left:17px}
.kbul li{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin:3px 0}
.dh{font-size:18px;margin-top:34px}
.dnote{font-size:14.5px;color:var(--ink-3);margin-top:7px;line-height:1.5;max-width:70ch}
.caught{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.cl{border-left:3px solid var(--keep);background:var(--accent-soft);padding:9px 14px;border-radius:var(--r);
 font-size:14.5px;color:var(--ink-2);line-height:1.5}
.cl b{color:var(--ink)}
.drow{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--surface);margin-top:8px;text-align:left}
.drow.good{border-color:var(--keep)}
.drh{all:unset;display:flex;width:100%;box-sizing:border-box;gap:10px;align-items:center;padding:11px 14px;cursor:pointer}
.drh:hover{background:var(--raised)}
.drh:focus-visible{outline:2.5px solid var(--accent);outline-offset:-2px}
.dpub{font-size:14px;font-weight:600;white-space:nowrap}
.dttl{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ch{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.05em;border-radius:2px;padding:2px 7px;white-space:nowrap}
.ch.k{background:var(--keep);color:var(--accent-ink)}
.ch.d{background:var(--line-soft);color:var(--ink-2)}
.ch.ok{border:1px solid var(--keep);color:var(--keep)}
.drb{padding:2px 16px 14px}
.dtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dtags span{font-family:"JetBrains Mono",monospace;font-size:10.5px;background:var(--drop-soft);color:var(--drop);
 border-radius:2px;padding:3px 8px;font-weight:600}
.cmpline{display:flex;gap:20px;flex-wrap:wrap;margin-top:11px;border-top:1px solid var(--line-soft);padding-top:9px;
 font-size:12.5px;color:var(--ink-2)}
.cmpline b{color:var(--ink)}
.rings{display:flex;gap:26px;margin-top:24px;flex-wrap:wrap}
.ring{display:flex;flex-direction:column;align-items:center;position:relative;width:110px}
.ring svg{transform:rotate(-90deg)}
.rbg{fill:none;stroke:var(--line-soft);stroke-width:8}
.rfg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .9s ease}
.rnum{position:absolute;top:26px;font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:600;color:var(--ink)}
.rnum small{font-size:11px;color:var(--ink-3)}
.rlab{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
 color:var(--ink-3);margin-top:6px;text-align:center}
.rc{margin-top:26px;border:1px solid var(--line);border-radius:6px;background:var(--surface);
 padding:26px 32px;max-width:900px;animation:slide .22s ease}
.rc.kind-win{border-color:var(--keep)}
