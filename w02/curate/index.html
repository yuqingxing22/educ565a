function scrCrit(){
 return back(10)+'<div class="stage wide left">'+tag('04 · HOW TO JUDGE')+''+
 '<h1 class="big" style="font-size:clamp(25px,3.6vw,34px)">Three labels. One decision.</h1>'+
 '<p class="lede">Data teams run these three checks on every source, usually with software. Here you run them by hand, so you can see what each check involves.</p>'+

 '<div class="critsec"><h3><i>1</i>Where did it come from?</h3>'+
  '<p>Origin decides how much trust a source starts with. Pipelines read it from the source name, the byline and the address, before the text itself.</p>'+
  '<div class="opts">'+
   '<div class="opt"><b>Journal</b><span>peer-reviewed research; slow, careful, and sometimes fake</span></div>'+
   '<div class="opt"><b>Preprint</b><span>research shared before review; often good, not yet checked</span></div>'+
   '<div class="opt"><b>News</b><span>a newsroom with an editor; look for more than one voice</span></div>'+
   '<div class="opt"><b>Opinion or blog</b><span>one signed view; can be expert, can be empty</span></div>'+
   '<div class="opt"><b>Forum</b><span>a community post; nobody reviewed it, and it can still know things no study knows</span></div>'+
   '<div class="opt"><b>Commercial</b><span>a company writing about its own product or market</span></div>'+
   '<div class="opt"><b>Reference</b><span>encyclopedias, professional bodies, official guidance</span></div>'+
   '<div class="opt"><b>Question bank</b><span>questions paired with their answers; see the warning below</span></div>'+
  '</div>'+
  '<div class="exbox"><span>Examples</span><ul>'+
   '<li>Every quote in an article comes from one company: that is an ad, whatever the masthead looks like.</li>'+
   '<li>A journal that reviews nothing is still labelled journal. Origin is not quality; the low quality goes in the next label.</li>'+
   '<li>Study notes where every question has one scoreable answer are a question bank, however studious they look.</li>'+
  '</ul></div></div>'+

 '<div class="critsec"><h3><i>2</i>Worth imitating?</h3>'+
  '<p>A model learns by imitating the text it is fed. So this label asks more than “is it true”. It asks: should the model write like this?</p>'+
  '<div class="opts">'+
   '<div class="opt"><b>High</b><span>clear claims, stated limits, checkable details; the model should sound like this</span></div>'+
   '<div class="opt"><b>Medium</b><span>honest but thin, or good with real caveats; fair people can disagree here</span></div>'+
   '<div class="opt"><b>Low</b><span>confident and unverifiable, or sloppy; the model must not copy this voice</span></div>'+
  '</div>'+
  '<div class="exbox"><span>Examples</span><ul>'+
   '<li>The honey and lemon post you met earlier: warm, honest, no evidence. Medium and low are both fair calls. Data teams settle cases like it with a written guideline and a vote, then move on.</li>'+
   '<li>A true report written carelessly still teaches the model careless writing. True and low can both apply.</li>'+
  '</ul></div></div>'+

 '<div class="critsec"><h3><i>3</i>Anything that keeps it out?</h3>'+
  '<p>A source can be excellent and still have to stay out. Each flag below has its own detector in a real pipeline, and quality cannot cancel a flag.</p>'+
  '<div class="opts">'+
   '<div class="opt"><b>False or invented</b><span>made-up numbers, studies or quotes stated as real. The tell: results too perfect, and sources you cannot find. A trial of twelve thousand students with zero dropouts is a red flag, not a triumph.</span></div>'+
   '<div class="opt"><b>Toxic</b><span>contempt aimed at people, no swear words needed. A model cannot tell quoting a view from holding it.</span></div>'+
   '<div class="opt"><b>Personal information</b><span>a name plus details that identify someone. Consent given to a newspaper is not consent to a training set, and a model cannot unlearn a person.</span></div>'+
   '<div class="opt"><b>Test contamination</b><span>the most misunderstood flag; the box below explains it.</span></div>'+
  '</div>'+
  '<div class="deepbox"><b>Test contamination is not about quizzes being bad.</b> '+
  'Math problems are fine training data. The danger is specific: <b>the questions your model will be TESTED on, together with their answers.</b> '+
  'Train on those, and the model memorises the answer key. Its test score stops meaning anything: it saw the answers in training. '+
  'The industry name is benchmark contamination, and real teams scan for it line by line.</div></div>'+

 '<div class="critsec"><h3><i>4</i>Then: one decision</h3>'+
  '<p><b>Keep</b> sends the source into the model: the model will imitate its writing and repeat its claims. <b>Drop</b> means the model never sees it. Whatever is still undecided when time ends counts as drop.</p>'+
  '<p>The decision is measured against <b>your model’s purpose</b>, not against “is this a good source in general”. A strong sleep study is gold for a sleep assistant and noise for a detector assistant. Ask: does my model need this to do its job?</p>'+
  '<div class="opts">'+
   '<div class="opt"><b>Flags overrule quality</b><span>excellent and flagged still means drop</span></div>'+
   '<div class="opt"><b>Quality serves the purpose</b><span>keep the writing you want your model to sound like</span></div>'+
   '<div class="opt"><b>Split group</b><span>the leader calls it and you move on; stuck costs more than wrong</span></div>'+
  '</div></div>'+

 '<p class="dnote" style="margin-top:16px">No need to memorise any of this. A cheatsheet lives behind the bulb on every card, and the full page stays open in its own tab.</p>'+
 '<div class="actions"><a class="btn sec" href="https://yuqingxing22.github.io/educ565a/w02/criteria/" target="_blank" rel="noopener">Open criteria in a new tab ↗</a>'+
 '<button class="go sm" data-s="1">Pick your model →</button></div></div>';

function botReply(entry,idx){
 const K=kept();
 if(!K.length) return '<p>I was not trained on anything. Your group kept no sources, so there is nothing I can answer from.</p>';
 const r=answer(entry.q,entry.a||[]);
 if(r.why==="noterms")
  return '<p>I need a few more words to work with. A full question in English works best.</p>';
 if(r.why==="dropped")
  return '<p>'+r.dropped.join(", ")+(r.dropped.length===1?" was":" were")+' dropped by your group, so I never learned from '+(r.dropped.length===1?"it":"them")+'.</p>'+
   '<div class="ground">Only kept sources exist for me.</div>';
 if(r.why!=="ok"&&r.why!=="weak"&&r.why!=="byid"||!r.used.length)
  return '<p>I cannot answer that. Nothing in the '+K.length+' sources I was trained on covers it.</p>'+
   '<div class="ground">A commercial model would answer this anyway, with no way to warn you.</div>';
 const opens=["From what I was trained on:","Here is what my sources say.","Based on my training data:","What I learned about this:"];
 const head=r.why==="weak"?"I do not have anything directly on that. The closest thing in my training data:":r.why==="byid"?"Here is what I learned from "+r.used.map(u=>u.x.id).join(" and ")+":":opens[idx%opens.length];
 const body=r.used.map(u=>{const bad=flagsOf(u.x).length>0;
  return u.sents.map(se=>'<span'+(bad?' class="risky"':'')+'>'+E(se)+'</span><i class="cite'+(bad?" bad":"")+'">'+u.x.id+'</i>').join(" ");}).join(" ");
 const ground='<div class="ground">Drawing on: '+r.used.map(u=>u.x.id+' '+(PLBL[u.x.provenance]||u.x.provenance).toLowerCase()).join(' · ')+
  ((r.dropped||[]).length?'<br>'+r.dropped.join(", ")+(r.dropped.length===1?' was':' were')+' dropped by your group, so I never learned from '+(r.dropped.length===1?'it':'them')+'.':'')+'</div>';
 const dirty=r.used.filter(u=>flagsOf(u.x).length);
 const warn=dirty.length?'<div class="warnrow">Risk check: '+dirty.map(u=>{const kf=flagsOf(u.x), caught=(lb(u.x.id).f||[]).some(f=>kf.includes(f));
   return u.x.id+' carries '+kf.map(fname).join(' and ')+(caught?' (you flagged it)':' (not caught)');}).join('; ')+
   '. I used '+(dirty.length===1?'it':'them')+' anyway. Nothing in my training stops me.</div>':'';
 return '<p>'+head+'</p><p class="ans">'+body+'</p>'+ground+warn;
}

     {S=blank();try{localStorage.removeItem(KEY);}catch(e){}render();}};
   return;
 }
 const q=(sel,f)=>document.querySelectorAll(sel).forEach(f);
 const id=x=>document.getElementById(x);

 q("[data-s]",b=>b.onclick=()=>{S.s=+b.dataset.s;save();render();});
 q("[data-mod]",b=>b.onclick=()=>{S.s=+b.dataset.mod;save();render();});
 q("[data-reset]",b=>b.onclick=()=>{S.rcfm=1;save();render();});
 q("[data-rno]",b=>b.onclick=()=>{S.rcfm=0;save();render();});
 q("[data-ryes]",b=>b.onclick=()=>{S=blank();try{localStorage.removeItem(KEY);}catch(e){}render();say("Fresh start.");});
 q("[data-rtopic]",b=>b.onclick=()=>{const t=b.dataset.rtopic; if(S.topic===t) return;
  S.topic=t;
  S.submitted=false;S.reviewing=false;S.proc=0;S.procDone=false;S.rev=0;S.revWhy=false;S.qopen="";
  S.chat=[];S.gpt="";S.unreached=[];S.i=0;S.started=0;S.ent=0;S.nudged=false;S.dopen={};S.hln={};S.cfm=0;
  if([3,4,5,9].includes(S.s)) S.s=2;
  save();render();say("Model "+t+" selected. Your labels are kept.");});
 q("[data-topic]",b=>b.onclick=()=>{S.topic=b.dataset.topic;save();render();});
 q("[data-size]",b=>b.onclick=()=>{S.size=+b.dataset.size;S.full=S.size===24;S.mins=MINS[S.size]||15;save();render();});
 const n=id("n"); if(n) n.onclick=()=>{S.s=Math.min(5,S.s+1);save();render();};

 const st=id("start");
 if(st) st.onclick=()=>{
   S.group=(id("grp").value||"").trim();
   S.mins=Math.max(1,Math.min(60,+id("mins").value||MINS[sizeOf()]||15));
   S.seed=[...(S.group||"g")].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)||1;
   S.started=0; S.submitted=false; S.i=0; S.ent=Date.now(); S.nudged=false;
   S.s=3; save(); render();
   say("The sources are open. The clock has not started.");
 };

 /* demo */
 q("[data-hs]",b=>b.onclick=()=>{S.dcur=b.dataset.hs;S.dh[b.dataset.hs]=1;save();render();});
 const dst=id("dstart"); if(dst) dst.onclick=()=>{S.s=11;save();render();say("One example before the work.");};

 /* cards */
 q("[data-goto]",b=>b.onclick=()=>{S.i=+b.dataset.goto;save();render();});
 q("[data-open]",b=>b.onclick=()=>{const k=b.dataset.open;S.open[k]=!S.open[k];save();render();});
 q("[data-sel]",el=>el.onchange=()=>{L(el.dataset.id)[el.dataset.sel]=el.value;save();});
 q("[data-flag]",b=>b.onclick=()=>{const l=L(b.dataset.id),v=b.dataset.flag;
   l.f=l.f.includes(v)?l.f.filter(z=>z!==v):l.f.concat([v]);save();render();});
 q("[data-dec]",b=>b.onclick=()=>{const l=L(b.dataset.id);l.d=b.dataset.dec;
   const it=items(); save();
   if(S.i<it.length-1){S.i++;} say(b.dataset.dec+". "+nDec()+" of "+it.length+" decided.");
   render();});
 const sc=id("startclock"); if(sc) sc.onclick=()=>{S.started=Date.now();save();render();say("Clock started, "+S.mins+" minutes.");};
 const tp=id("tip"); if(tp) tp.onclick=()=>{S.tips=true;save();render();};
 const ct=id("closetip"); if(ct) ct.onclick=()=>{S.tips=false;save();render();};
 const sb=id("sub");
 if(sb) sb.onclick=()=>finish(false);

 /* processing + debrief */
 const sw=id("seewhat"); if(sw) sw.onclick=()=>{S.procDone=true;save();render();say("Here is what you built.");};
 const pb=id("procback"); if(pb) pb.onclick=()=>{
   S.submitted=false;S.proc=0;S.procDone=false;
   if(S.started&&left()<=0) S.started=0;
   S.ent=Date.now(); S.nudged=false; S.s=3;save();render();say("Back at the cards.");};
 q("[data-rev]",b=>b.onclick=()=>{S.rev++;S.revWhy=false;save();render();});
 q("[data-prev]",b=>b.onclick=()=>{S.rev=Math.max(0,S.rev-1);S.revWhy=false;save();render();});
 q("[data-why]",b=>b.onclick=()=>{S.revWhy=true;save();render();});
 const ag=id("again"); if(ag) ag.onclick=()=>{S.rev=0;S.revWhy=false;save();render();};
 q("[data-qpill]",b=>b.onclick=()=>{S.qopen=(S.qopen===b.dataset.qpill)?"":b.dataset.qpill;save();render();});
 q("[data-ab]",b=>b.onclick=()=>{S.ab=(S.ab===b.dataset.ab)?"":b.dataset.ab;save();render();});
 const sendQ=(qq,a)=>{qq=String(qq||"").trim(); if(!qq) return; S.chat=(S.chat||[]).slice(-29); S.chat.push({q:qq.slice(0,300),a:a||[],t:Date.now()}); save(); render();
  const nq=id("askq"); if(nq&&typeof nq.focus==="function") nq.focus();};
 q("[data-askp]",b=>b.onclick=()=>{const p=(PROBES[S.topic]||[])[+b.dataset.askp]; if(p) sendQ(p.q,p.a);});
 const aq=id("askq"), asnd=id("asksend"); if(asnd) asnd.onclick=()=>sendQ(aq?aq.value:"");
 if(aq) aq.onkeydown=e=>{if(e&&e.key==="Enter"){if(e.preventDefault)e.preventDefault();sendQ(aq.value);}};
 const acl=id("askclear"); if(acl) acl.onclick=()=>{S.chat=[];save();render();};
 const cl=id("chatlog"); if(cl&&cl.scrollHeight) cl.scrollTop=cl.scrollHeight;

 /* shared */
 const cp=id("cpp"); if(cp) cp.onclick=()=>copy(promptText(),cp,"Copied");

 const cm=id("cmp"); if(cm) cm.onclick=()=>{S.gpt=id("g").value;save();render();};
 const rs=id("reset"); if(rs) rs.onclick=()=>{S.cfm=1;save();render();};
 const cy=id("cfmyes"); if(cy) cy.onclick=()=>{S=blank();try{localStorage.removeItem(KEY);}catch(e){}render();};
 const cn=id("cfmno"); if(cn) cn.onclick=()=>{S.cfm=0;save();render();};
 const ns=id("nstart"); if(ns) ns.onclick=()=>{S.started=Date.now();S.nudged=true;save();render();say("Timer started.");};
 const nl=id("nlater"); if(nl) nl.onclick=()=>{S.nudged=true;save();render();};
 const xl=id("xls"); if(xl) xl.onclick=()=>copyTable(xl);


 clearInterval(tick);
 if(S.s===3&&S.started&&!S.submitted){clock();tick=setInterval(clock,1000);}
 else if(S.s===4&&S.proc&&!S.procDone){tick=setInterval(render,1000);}
 else if(S.s===3&&!S.started){tick=setInterval(render,20000);}
 if(typeof requestAnimationFrame!=="undefined")
   requestAnimationFrame(()=>requestAnimationFrame(()=>{
     document.querySelectorAll(".rfg").forEach(c=>{c.style.strokeDashoffset=c.dataset.off;});}));
}
render();
if(typeof document!=="undefined"&&document.addEventListener){
 document.addEventListener("keydown",e=>{
  const t=e.target, tg=t&&t.tagName; if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT"||e.metaKey||e.ctrlKey||e.altKey) return;
  const hit=sel=>{const b=document.querySelector(sel); if(b){b.click(); e.preventDefault(); return true;} return false;};
  if(S.s===3&&!S.reviewing&&!S.submitted){
   const v={k:"keep",d:"drop"}[(e.key||"").toLowerCase()];
   if(v){hit('[data-dec="'+v+'"]');return;}
   if(e.key==="ArrowRight"){hit('[data-goto="'+(S.i+1)+'"]');return;}
   if(e.key==="ArrowLeft"){hit('[data-goto="'+(S.i-1)+'"]');return;}
  } else if(S.s===4&&S.procDone){
   if(e.key==="ArrowRight"){hit('[data-rev]');return;}
   if(e.key==="ArrowLeft"){hit('[data-prev]');return;}
  }
 });
}
</script>
