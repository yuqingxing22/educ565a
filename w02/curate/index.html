<script>
"use strict";
const KEY="educ565a-w02-curate";
const CORPUS={"B":[{"id":"B01","publication":"Velmore Journal of Adolescent Sleep Science","byline":"I. Torsgaard, R. Machavey, and D. Pelkin","date":"2025-03-14","url":"https://velmorejournals.example/vjass/article/10.99999/vjass.2025.0117","words":109,"title":"Evening Device Use and Sleep Duration in Early Adolescence: A Three-Wave Actigraphy Study","snippet":"Within-person increases of one hour in evening device use predicted about nine fewer minutes of actigraphy-measured sleep the same night.","text":"We followed 1,842 students aged 12 to 16 across three annual waves, pairing wrist actigraphy with nightly self-report. Within-person models compared each participant against their own baseline, which removes the stable family and school differences that confound cross-sectional work. An increase of one hour in evening device use predicted about nine fewer minutes of sleep on the same night, with no detectable carryover into the following week. Effects were larger for interactive and social use than for streaming. Attrition reached 14 percent by the third wave and was higher among students reporting later bedtimes, so the estimate should be read as conservative. Registered analysis plan is filed under 10.99999/vjass.2025.0117.","provenance":"journal","quality":"high","flags":["none"],"why":"The anchor item. Peer-reviewed venue, within-person design, effect reported in minutes, attrition disclosed, no overclaiming. Labellers should key journal, high, no flags. Its numbers reappear in B06 and B24, which is how the reuse chain becomes visible."},{"id":"B02","publication":"International Archive of Multidisciplinary Health Research and Innovation","byline":"S. Belmiraux and A. Torgunde","date":"2025-11-02","url":"https://iamhri-press.example/index.php/iamhri/article/view/10.99999/iamhri.2025.884","words":105,"title":"A Global Randomized Controlled Trial of Complete Evening Screen Abstinence in 12,340 Adolescents","snippet":"Adolescents assigned to zero evening screen exposure gained 118 minutes of nightly sleep, with a correlation of 0.94 across 41 countries.","text":"This randomized controlled trial enrolled 12,340 adolescents across 41 countries and completed all follow-up within six weeks. Participants assigned to zero evening screen exposure gained 118 minutes of nightly sleep, a correlation of 0.94 between screen minutes and sleep loss, significant at p less than 0.00001. Recruitment, randomization, and outcome assessment were handled by the same three investigators. The manuscript reports registry number TRN-4471-B and states that ethics approval was not required because the intervention was behavioural. No attrition, protocol deviation, or adverse event appears anywhere in the paper. Analysis code is available from the corresponding author, whose listed address is a mail forwarding service.","provenance":"journal","quality":"low","flags":["hallucination"],"why":"Predatory-journal article carrying an invented trial. Provenance is still journal, which is the point of the corrected taxonomy: venue type and trustworthiness are separate axes. Tells are internal, an impossible effect size and correlation, 41 countries in six weeks, zero attrition, a registry number that goes nowhere."},{"id":"B03","publication":"Kessendale Review of Child Health Evidence","byline":"N. Farrow-Idris and P. Oskvig","date":"2024-09-05","url":"https://kessendale-review.example/archive/10.99999/krche.2024.0442","words":97,"title":"Evening Screen Use and Adolescent Sleep Duration: A Meta-Analysis of 74 Samples","snippet":"Across 74 samples the pooled association was r equal to minus 0.09, roughly five to eight fewer minutes per additional hour of use.","text":"Across 74 samples and 121,406 participants, the pooled association between evening screen use and shorter sleep duration was r equal to minus 0.09, which corresponds to roughly five to eight fewer minutes of sleep per additional hour of use. Heterogeneity was substantial and largely unexplained by age, measurement type, or country. Funnel plot asymmetry and a trim-and-fill adjustment both suggest the pooled estimate is inflated by small-study effects. Studies using device-logged rather than self-reported screen time produced estimates about half the size. We conclude that the association is consistent, small, and not yet demonstrated to be causal. The supplementary file lists every item of the two measurement instruments used across the included studies, with their response options and scoring.","provenance":"journal","quality":"high","flags":["contamination"],"why":"Reproducibility and contamination through the same door. The supplement is why the meta-analysis can be checked, and it is why a model trained on the paper would appear to know instruments it has only memorised."},{"id":"B04","publication":"Trellis Journal of Family Media Studies","byline":"H. Rundstock and M. Alvery","date":"2025-06-20","url":"https://trellisjournals.example/tjfms/10.99999/tjfms.2025.0198","words":97,"title":"Household Media Rules and Reported Bedtimes in a Caregiver Survey","snippet":"Households with a consistent device curfew reported child bedtimes 22 minutes earlier than households without one, in a survey of 903 caregivers.","text":"We surveyed 903 caregivers of 11 to 15 year olds about household media rules and reported child bedtimes. Households with a consistent device curfew reported bedtimes 22 minutes earlier on average. Respondents described their curfew as strictly enforced (48 percent), loosely enforced (39 percent), or absent (25 percent). The causal direction is established by the Halvern crossover trial of 2019, which randomized 6,000 families to curfew and no-curfew conditions and reported a 40 minute sleep gain. Our own design is cross-sectional and cannot separate curfew effects from the parental attentiveness that produces curfews in the first place.","provenance":"journal","quality":"low","flags":["hallucination"],"why":"A competent survey that leans on a trial nobody can find, and whose three response categories sum to 112 percent. Tests whether a labeller keeps reading after the methods look fine. Journal, medium, hallucination."},{"id":"B05","publication":"Cairnwell Archive","byline":"T. Vaudreme and K. Lindhoff","date":"2026-04-13","url":"https://cairnwell.example/ca-2026-0413v2","words":106,"title":"Who Sets the Bedtime? A Diary Study of Evening Screen Use and Sleep in 310 Adolescents","snippet":"After controlling within person for who decided the bedtime, the coefficient fell to 1.4 minutes and the interval crossed zero.","text":"We ran a 28 night diary study with 310 adolescents, collecting device-logged screen minutes alongside morning sleep reports. The raw association between evening use and sleep duration was negative and significant. After adding a within-person control for who decided the bedtime, the coefficient fell to 1.4 minutes and the confidence interval crossed zero. Adolescents who set their own bedtime used devices more and slept less, and both behaviours appear to follow from the absence of a bedtime rule rather than from each other. Comments are welcome. Version two corrects a coding error in wave one; a revised version will be posted before submission to a journal.","provenance":"preprint","quality":"medium","flags":["none"],"why":"The only preprint, and nothing in it uses the word preprint. The labeller has to notice the version number, the open invitation to comment, and the promise to submit to a journal later. Sound work but unreviewed, so medium rather than high."},{"id":"B06","publication":"The Fennrow Courier","byline":"Marta Quillane","date":"2025-03-19","url":"https://fennrowcourier.example/health/2025/03/teen-sleep-actigraphy-study","words":106,"title":"Nine Minutes: What a Three-Year Study Actually Found About Phones and Teen Sleep","snippet":"On nights when students used devices an hour longer than their own average, they slept about nine minutes less, a new study found.","text":"A three-year study of 1,842 middle schoolers published this month found that on nights when students used devices an hour longer than their own average, they slept about nine minutes less. The figure is far smaller than the hours often cited in school board debates. Renn Machavey, who led the work, said the design compares each student with themselves rather than with other families. Perla Oskvig, a sleep researcher at the Kessendale Institute who was not involved in the study, said nine minutes is real but is not the difference between a rested teenager and an exhausted one. The study did not track weekend recovery sleep. One family agreed to be identified: Marisol Ochterbeck, fifteen, a year ten student at Fennrow Ridge, who was diagnosed with delayed sleep phase disorder in March.","provenance":"news","quality":"high","flags":["pii"],"why":"High quality local reporting that names a minor, her age, her school, her year group and a clinical diagnosis. Consent was given to the newspaper, not to a training corpus, and the four details together identify her permanently. The flagship personal-information item for this topic."},{"id":"B07","publication":"Quilhaven Daily","byline":"Owen Radleigh","date":"2026-01-27","url":"https://quilhavendaily.example/health/2026/01/two-hours-lost-teen-sleep","words":100,"title":"Teens Lose Two Hours of Sleep to Late-Night Phones, Institute Says","snippet":"Teenagers who look at a phone after ten at night lose more than two hours of sleep, a study released Tuesday found.","text":"Teenagers who look at a phone after ten at night lose more than two hours of sleep, according to a study released Tuesday by the Halvern Institute for Child Development. The institute says it tracked 8,000 students for a year and found that 73 percent met criteria for chronic sleep deprivation. Lead author Farrah Ondell said the effect appears within a single week of nightly use and reverses just as quickly. The report has not been posted publicly and the institute did not name the journal that will carry it. No researcher outside the institute was reached for this article.","provenance":"news","quality":"low","flags":["hallucination"],"why":"The item the corrected taxonomy was built for: an invented study written up by a genuine newsroom, so provenance news with a hallucination flag, quality low. The old scheme had nowhere to put this. Tells arrive only in the final two sentences."},{"id":"B08","publication":"The Selvage Beacon","byline":"Junie Halbrede","date":"2026-06-02","url":"https://selvagebeacon.example/schools/2026/06/overnight-phone-pilot-results","words":97,"title":"District Pilot Collected Phones Overnight. Half the Families Finished.","snippet":"Of 84 families who began the overnight phone collection pilot, 51 finished, and those reported bedtimes about 25 minutes earlier by May.","text":"Pellmore Ridge Middle School collected phones overnight from volunteer households in a twelve week pilot that ended in May. Of 84 families who started, 51 finished. Those families reported bedtimes about 25 minutes earlier by the final month, based on a form parents filled in each Sunday. Principal Dov Ashkettle said first period attendance improved but that he could not separate the pilot from a schedule change made in March. A district health coordinator called the numbers encouraging and too small to generalize from. The district plans a larger version in the fall with an outside evaluator. Board member Delphine Auquist told the meeting that the parents complaining loudest are the ones who hand a child a phone at four years old and then want the school to fix it, and that some families simply should not have been families.","provenance":"news","quality":"medium","flags":["toxic"],"why":"Accurate reporting of a public meeting, including a remark that is contemptuous toward parents and edges into something worse. The reporter is doing the job. The corpus curator has a different one."},{"id":"B09","publication":"The Nettlewire","byline":"Nettlewire staff","date":"2024-10-11","url":"https://nettlewire.example/wellness/screens-insomnia-teens-confirmed","words":100,"title":"Screens Confirmed as Cause of Teen Insomnia Epidemic, Scientists Say","snippet":"Screens are causing insomnia in 60 percent of teenagers, and every extra hour of phone use costs a full hour of sleep.","text":"Screens are causing insomnia in 60 percent of teenagers, researchers at a major university confirmed this week. A new analysis of 74 studies proves that every extra hour of phone use costs teens a full hour of sleep and triples the risk of depression. Scientists say blue light is the single cause and that screen filters do not help. The findings, which the summary describes as definitive, follow years of debate. Parents are being urged to remove all devices from bedrooms immediately. The research team was not identified in the material circulated to news outlets, and no institution is named.","provenance":"news","quality":"low","flags":["hallucination"],"why":"An aggregator newsroom mangling B03. Same 74 studies, but the effect is inflated roughly a hundredfold, an invented depression finding is added, and no author or institution exists. News, low, hallucination."},{"id":"B10","publication":"Quilhaven Daily","byline":"Ilse Wrenhalt","date":"2026-02-08","url":"https://quilhavendaily.example/columns/wrenhalt/what-nine-minutes-buys","words":107,"title":"What Nine Minutes Buys You, and What It Does Not","snippet":"The average effect in the literature is small, between five and fifteen minutes a night, and averages hide the patients I worry about.","text":"I run an adolescent clinic and I am asked about screens every week. My honest answer is that the average effect in the literature is small, between five and fifteen minutes a night, and that averages hide the patients I worry about. The teenager awake at three because a group chat will notice if she is missing does not have a light exposure problem. She has a social obligation problem. I would rather we spend the policy conversation on later school start times, which move sleep by a measured hour, than on a device curfew that moves it by a few minutes. This is one clinician's reading.","provenance":"opinion","quality":"high","flags":["none"],"why":"An opinion piece can be high quality. It is signed, accurate about effect sizes, marks itself as a view, and argues rather than asserts. Labellers who treat opinion as automatically low quality will misgrade this one."},{"id":"B11","publication":"Sleep, Roughly","byline":"Corin Padgett-Vale","date":"2026-01-15","url":"https://sleeproughly.example/2026/01/the-displacement-hypothesis-revisited","words":97,"title":"The Displacement Hypothesis Revisited","snippet":"The displacement hypothesis holds that screens harm sleep mainly by occupying hours that would otherwise be spent asleep, not through physiology.","text":"The displacement hypothesis holds that screens harm sleep mainly by occupying hours that would otherwise be spent asleep, rather than through any direct physiological mechanism. The evidence base has moved decisively toward this reading over the past decade. Early melatonin suppression work was conducted at luminance levels far above what a handheld device produces at arm's length, and later replications narrowed the effect considerably. Meanwhile the largest longitudinal datasets show associations that shrink as measurement improves. The reasonable conclusion is that displacement explains most of the observed association and that photic effects explain very little of it.","provenance":"opinion","quality":"low","flags":["none"],"why":"The scholarly-sounding personal blog. It reads like a short review article, and every claim in it is the kind that would carry a citation, yet none does. Deliberately not flagged hallucination: nothing is invented, it is only unsupported. Its opening sentences reappear verbatim in B17."},{"id":"B12","publication":"The Hearthside Letter","byline":"Delia Marrowby","date":"2025-12-04","url":"https://hearthsideletter.example/issues/the-numbers-we-already-knew","words":101,"title":"The Numbers We Already Knew","snippet":"The Grantham Report followed a quarter of a million children and found a 340 percent rise in adolescent insomnia since handsets entered bedrooms.","text":"Every parent I know has watched a child dissolve after a night on a phone, and now we have numbers. The Grantham Report, released last autumn, followed a quarter of a million children and found a 340 percent rise in adolescent insomnia since handsets entered bedrooms. The same report found that removing devices restored normal sleep within nine days. I have not been able to find a copy online, but a colleague described it to me in detail and the figures match what I see in my own house. We do not need another decade of studies to act on this.","provenance":"opinion","quality":"low","flags":["hallucination"],"why":"A signed newsletter column built on a report that does not exist, and it admits mid-paragraph that the author has never seen it. Opinion, low, hallucination. Pairs with B10 to show that the provenance value says nothing about quality."},{"id":"B13","publication":"Nightowl Boards","byline":"quietmothcatcher","date":"2026-05-21","url":"https://nightowlboards.example/t/why-i-actually-stay-up/48120","words":105,"title":"Why I actually stay up, from someone who is 16","snippet":"Everyone tells me it is the light. It is not the light. It is that the group chat has a rhythm.","text":"Everyone tells me it is the light. It is not the light. I can read a paper book under a bright lamp and be asleep by eleven. What keeps me up is that the group chat has a rhythm, and if I drop out at ten there is a whole conversation I have to reconstruct in the morning, and people notice. Last year I turned my phone off at nine for two weeks. I fell asleep faster and I felt worse. Nobody was mean about it, I just stopped being in things. My parents thought the experiment worked because my bedtime moved. It did move.","provenance":"forum","quality":"high","flags":["none"],"why":"Kept from the previous corpus. A forum post can be high quality: first-person testimony about a mechanism, social obligation, that none of the quantitative items measures, and honest about the tradeoff it made. Forum, high, no flags. The item most often downgraded on venue alone."},{"id":"B14","publication":"Clatterbox","byline":"hexwarden_j","date":"2025-08-30","url":"https://clatterbox.example/threads/settled-science-already/9917","words":94,"title":"This is settled science already","snippet":"The Zurich twin study followed 40,000 twin pairs and showed the twin with the phone slept 90 minutes less.","text":"This is settled science at this point. The Zurich twin study followed 40,000 twin pairs and showed that the twin with the phone slept 90 minutes less, which controls for genetics and household completely. There was also a national school ban that raised test scores by a full grade level in a single year. I read both write-ups somewhere last spring. Anyone still arguing about confounders has not looked at the twin data. If you want the citations I can dig them up later, but they are easy enough to find if you search.","provenance":"forum","quality":"low","flags":["hallucination"],"why":"Confident invention in a forum register. Two studies that do not exist, described with the specificity that makes them sound checkable, plus an offer of citations that never arrives. Forum, low, hallucination."},{"id":"B15","publication":"Latchkey Commons","byline":"nurse_in_the_annex","date":"2026-03-02","url":"https://latchkeycommons.example/topic/two-patterns-not-one/33108","words":100,"title":"Two patterns, not one","snippet":"What I see is not one pattern but two, and the families who succeed usually change the whole evening, not just the device.","text":"School nurse here, ten years in a middle school. What I see is not one pattern but two. Some kids are up late because nobody is enforcing anything, and they would be up late with a television or a paperback. Others are anxious, and the phone is where the anxiety lives, so taking it away does not fix the waking, it just removes the evidence. The families who succeed usually change the whole evening rather than only the device. I have no data, only about six hundred conversations, and I would not want anyone to quote this as a finding.","provenance":"forum","quality":"medium","flags":["none"],"why":"Practitioner observation, appropriately hedged, explicitly declining to be treated as evidence. Medium rather than high because it is uncontrolled recall, but the self-limiting last sentence is exactly what a labeller should reward. Forum, medium, no flags."},{"id":"B16","publication":"Clatterbox","byline":"ridgehammer","date":"2025-09-14","url":"https://clatterbox.example/threads/nothing-is-wrong-with-the-phones/10244","words":102,"title":"Nothing is wrong with the phones","snippet":"Nothing is wrong with the phones. Something is wrong with the adults. Spare me the studies.","text":"Nothing is wrong with the phones. Something is wrong with the adults. If your fourteen year old is a wreck at seven in the morning, that is a confession about you, not a public health emergency. You will not take the device because you are frightened of an argument with a child, so you invent a scientific problem instead and demand that somebody else solve it. Spare me the studies. You are lazy, you made the mess, and now you want a policy to hide behind. Every one of these threads is people begging to be told it is not their fault.","provenance":"forum","quality":"low","flags":["toxic"],"why":"The single toxic item: contemptuous, blaming, hostile to the people it addresses, with no slur, no sexual content, no threat, and no real person named. It also contains a defensible claim about enforcement, which is what makes it a discussion case rather than a throwaway."},{"id":"B17","publication":"Nightowl Boards","byline":"pastebin_pavel","date":"2026-02-19","url":"https://nightowlboards.example/t/asked-an-assistant-to-summarize/50733","words":96,"title":"Summary of the evidence, pasting what I got","snippet":"The displacement hypothesis holds that screens harm sleep mainly by occupying hours that would otherwise be spent asleep, rather than through any direct physiological mechanism.","text":"I asked an assistant to summarize the evidence and it gave me this, copied below without changes. The displacement hypothesis holds that screens harm sleep mainly by occupying hours that would otherwise be spent asleep, rather than through any direct physiological mechanism. The evidence base has moved decisively toward this reading over the past decade. It also supplied three sources: Farrow-Idris and Oskvig 2021 in the Journal of Circadian Development, Torsgaard 2019, and a Halvern Institute white paper. I could not open any of the three. Posting it anyway because the reasoning seemed solid to me.","provenance":"forum","quality":"low","flags":["hallucination","contamination"],"why":"Contamination case one. Two sentences are byte-identical to B11, so anyone deduplicating the corpus finds them twice, and the generated text misattributes real corpus authors to venues and years that do not exist. Its snippet is deliberately the same extract as B11's, which is the fastest way to catch the duplication. Forum, low, hallucination plus contamination."},{"id":"B18","publication":"Latchkey Commons","byline":"aunt_of_three_torvale","date":"2026-04-30","url":"https://latchkeycommons.example/topic/advice-about-my-niece/34771","words":94,"title":"Advice about my niece, at a loss here","snippet":"Posting for advice about my niece, fourteen, ninth grade in Torvale, Oregon, awake until two most nights on her phone.","text":"Posting for advice about my niece. Delaney Ostreim-Vance, fourteen, ninth grade at Pellmore Ridge Middle School in Torvale, Oregon. She takes 40 milligrams of a stimulant for ADHD, prescribed by Hollis Bramwell at the Torvale Family Clinic, and she was suspended for three days in February after a phone was confiscated during a test. Her mother works nights, so there is nobody awake to enforce a bedtime, and she is on her phone until two most nights. Her counselor is Ivo Petrakas if anyone here has dealt with him. What would you actually do?","provenance":"forum","quality":"low","flags":["pii"],"why":"The single PII item: invented full name, age, grade, named school, town and state, prescriber, dosage, diagnosis, a three day suspension, and a named counselor, all about a minor and posted by a third party. Every detail is fabricated and maps to no real person. Forum, low, pii."},{"id":"B19","publication":"Thalorin Wellness","byline":"The Thalorin Wellness team","date":"2025-05-08","url":"https://thalorinwellness.example/journal/teen-sleep-and-evening-screens","words":99,"title":"Evening Screens and the Teenage Melatonin Gap","snippet":"Eighty-seven percent of adolescents are now clinically melatonin deficient by the age of fifteen, and NightRein was formulated for this gap.","text":"Evening screens are stealing your teenager's sleep, and 87 percent of adolescents are now clinically melatonin deficient by the age of fifteen. That figure comes from our 2024 internal review of the published literature. NightRein was formulated for exactly this gap, pairing a gentle three milligram dose with magnesium and a botanical blend developed in our own laboratory. In a survey of our customers, nine out of ten reported falling asleep faster within two weeks. Full data on file. These statements have not been evaluated by any regulatory body. Subscribe and save 20 percent on your first three months.","provenance":"commercial","quality":"low","flags":["hallucination"],"why":"Kept from the previous corpus. A vendor citing a statistic that cannot be traced past its own internal review, an invented clinical category, and customer survey evidence held on file. Easy to key as commercial; the point is that it also earns a hallucination flag."},{"id":"B20","publication":"Orrenshaw Business Journal","byline":"Orrenshaw Business Journal staff","date":"2026-02-26","url":"https://orrenshawjournal.example/technology/2026/02/umbraline-optics-dusk-lens-results","words":100,"title":"Umbraline Optics Reports Faster Sleep Onset From Its Dusk Lens","snippet":"Adolescents wearing the Dusk lens in the two hours before bed fell asleep an average of 19 minutes sooner over eight weeks.","text":"Umbraline Optics said Thursday that adolescents wearing its Dusk lens in the two hours before bed fell asleep an average of 19 minutes sooner. The company evaluated 240 households over eight weeks. Chief executive Rana Delvinne said the result confirms what customers have been telling the company for years. Chief science officer Ivo Sarrenhall said the lens filters the specific wavelengths implicated in melatonin timing. Marketing director Belle Aughrim said the findings arrive as schools weigh new evening policies. Detailed results will be made available to retail partners on request.","provenance":"commercial","quality":"low","flags":["none"],"why":"Trap one, the marketing announcement running as a news story. Plain business masthead, staff byline, a URL that says technology, and no word anywhere naming what it is. The only tells sit in the body: all three quoted people work for the company, no independent voice appears, results go to retail partners rather than readers, and the last sentence. True provenance is commercial, not news. I expect the most misses here."},{"id":"B21","publication":"The Grovemark Review","byline":"Hollis Marrenkeep","date":"2025-10-16","url":"https://grovemarkreview.example/family/what-actually-works-at-eight-oclock","words":103,"title":"What Actually Works at Eight O'Clock","snippet":"Rules fail because they are negotiated at ten at night, when everyone is tired and the argument is already lost.","text":"Parents ask me what actually works and my answer has not changed in six years. Rules fail because they are negotiated at ten at night, when everyone is tired and the argument is already lost. What works is a structured wind-down that begins at eight and requires no decision from anyone. In our trial of 900 families, the Hyllen Rest programme moved sleep onset forward by 47 minutes within three weeks, and 94 percent of parents said the evening argument disappeared entirely. I have watched it work in my own household. Families can begin the programme this month at a reduced introductory rate.","provenance":"commercial","quality":"low","flags":["hallucination"],"why":"Trap two, the paid editorial. It reads as a signed opinion column on a magazine masthead until the word our attaches to a named product, the trial belongs to the seller, and the closing line sells a subscription. Provenance commercial, and the unfindable 900 family trial earns the hallucination flag."},{"id":"B22","publication":"Federation of Adolescent Sleep Clinicians","byline":"FASC Position Statement Working Group","date":"2025-07-01","url":"https://fasc-statements.example/positions/evening-media-2025","words":103,"title":"Position Statement on Evening Media Use and Adolescent Sleep","snippet":"The association is consistent across observational studies and small in magnitude, on the order of five to fifteen minutes per additional hour.","text":"The Federation considers the association between evening media use and shortened adolescent sleep to be consistent across observational studies and small in magnitude, on the order of five to fifteen minutes per additional hour of use. Evidence for a causal effect is graded moderate for delayed sleep onset and low for total sleep duration. The Federation does not recommend blanket bans, which have not been evaluated against active comparators. Clinicians should ask about the function of evening use, since content and social obligation appear more relevant than display light. This statement will be reviewed in 2028 or earlier if new trial evidence appears. The appendix reproduces the eight item adolescent sleep screening questionnaire in full, with the scoring key and the cut points used to indicate referral.","provenance":"reference","quality":"high","flags":["contamination"],"why":"A professional body publishing a validated instrument with its scoring, which is what clinicians need and what the statement exists to provide. It is also an answer key. A model trained on it scores well on those eight items without understanding any of them."},{"id":"B23","publication":"Thornmere Encyclopedia of Behavioural Science","byline":"Thornmere editorial board","date":"2024-11-22","url":"https://thornmere-encyclopedia.example/entries/screen-time-and-adolescent-sleep","words":95,"title":"Screen Time and Adolescent Sleep","snippet":"Three mechanisms are usually proposed: displacement of sleep by waking activity, physiological arousal from content, and melatonin suppression by short-wavelength light.","text":"Screen time and adolescent sleep refers to the study of whether evening use of electronic media shortens or delays sleep in people aged roughly ten to nineteen. Three mechanisms are usually proposed: displacement of sleep by waking activity, physiological arousal from engaging content, and suppression of melatonin by short-wavelength light. Meta-analyses report small negative associations, with device-logged measures producing smaller estimates than self-report. Causal evidence remains limited, because randomizing long-term use is impractical. The section below on light exposure has not been revised since 2019 and predates several replication attempts, and is marked for update.","provenance":"reference","quality":"medium","flags":["none"],"why":"An encyclopedia entry, accurate in outline, with a stale section it flags itself, which is why it is medium rather than high. With B22 it shows that reference covers encyclopedias, professional bodies, and government guidance, and nothing else."},{"id":"B24","publication":"Lattermill Study Notes","byline":"Lattermill Study Notes","date":"2026-05-05","url":"https://lattermill.example/units/adolescent-sleep/revision-notes-3","words":96,"title":"Adolescent Sleep and Evening Screens: Unit Revision Notes","snippet":"Melatonin onset shifts later through adolescence, and evening light exposure delays it further.","text":"Q. What is the approximate pooled association between evening screen use and sleep duration? A. r equals minus 0.09, about five to eight fewer minutes per additional hour. Q. Which measurement approach yields smaller estimates? A. Device-logged screen time. Q. Name the three proposed mechanisms. A. Displacement, arousal, and melatonin suppression. Q. Is the relationship causal? A. No. Randomizing long-term use is impractical, so causal evidence remains limited. Q. What grade of evidence applies to delayed sleep onset? A. Moderate. One point per item. Do not award partial credit for answers that omit the effect size.","provenance":"test","quality":"low","flags":["contamination"],"why":"The disguised evaluation set. It presents as revision notes and the snippet holds that cover. The tell is that every question is followed by one definitive scoreable answer, and the closing line is marking instruction. Contamination because the answers are lifted from B03, B22, and B23, so training on this corpus leaks the key for anything scored against those items."}],"A":[{"id":"A01","publication":"Kestrelton Review of Learning Measurement","byline":"Ilona Fenwold and Priya Nandiwal","date":"2026-02-11","url":"https://kestreltonreview.example/articles/10.99999/krlm.2026.0417","words":100,"title":"False positive rates of three writing provenance classifiers across four campuses","snippet":"Across 4,812 authenticated student submissions, flag rates differed by writer group, and we report each subgroup separately rather than as a pooled figure.","text":"We collected 4,812 submissions written under proctored conditions at four institutions during a single term, then scored them with three commercial classifiers at vendor default thresholds. Flag rates were 2.1 percent overall, 6.8 percent for students who reported English as an additional language, and 5.4 percent for students composing with speech to text software. We report each group separately because pooling hides the pattern that matters at an appeal hearing. The limits are substantial. One term, one assignment genre, one version of each tool, and nothing outside first year composition. Confidence intervals are given for every cell in Table 3.","provenance":"journal","quality":"high","flags":["none"],"why":"True journal: peer reviewed article, DOI placeholder, disaggregated results and stated limits. The anchor high quality item. No trap."},{"id":"A02","publication":"Threadhold","byline":"posted by grimgradebook","date":"2026-05-14","url":"https://threadhold.example/f/facultylounge/t/47320","words":97,"title":"Every single one of them is lying to your face","snippet":"Half of that cohort cannot write a paragraph without help and now they want us to believe the software is the problem.","text":"Let us stop pretending. That cohort cannot produce a coherent paragraph on their own and never could, and now they have discovered that complaining about false positives works better than studying. They are not victims. They are frauds who found a better excuse, and every one of them knows exactly what they did. What disgusts me is the colleagues who fold. You run your little appeal, you hand back the grade, and you teach two hundred people that whining beats work. Congratulations. You have made yourself useless and you have made the rest of us look ridiculous.","provenance":"forum","quality":"low","flags":["toxic"],"why":"The single toxic item. Hostile, contemptuous, blames a whole student cohort and colleagues. No slurs, no threats, no sexual content, no real person named. Provenance is plainly forum."},{"id":"A03","publication":"Halbeck Wire","byline":"Halbeck Wire Newsdesk","date":"2026-03-04","url":"https://halbeckwire.example/2026/03/04/tessivo-provenance-suite-sundermill-schools","words":100,"title":"Tessivo Provenance Suite goes live across Sundermill district secondary schools","snippet":"The rollout gives every teacher in the district a same day authorship signal, said Tessivo chief product officer Marla Quillane.","text":"Tessivo Learning Systems confirmed today that its Provenance Suite is live in all eleven secondary schools in the Sundermill district, covering roughly nine thousand students. The platform returns an authorship signal within minutes of submission and writes directly to the district gradebook. Chief product officer Marla Quillane said teachers had asked for something faster than manual review. Vice president of schools Dov Ketterly said early feedback has been overwhelmingly positive and that no district has asked to pause a deployment. The suite scores 99.4 percent accuracy, a figure verified by the Center for Assessment Assurance. Staff training begins next month.","provenance":"commercial","quality":"low","flags":["hallucination"],"why":"Trap one, the press release wearing news clothes. URL and masthead are clean; the tells are in the body, where every quote is a Tessivo executive and no independent voice appears. True label commercial because the byline is the company writing about its own product. Hallucination flag for the Center for Assessment Assurance, a verifier presented as independent that does not exist. Careless labellers will say news."},{"id":"A04","publication":"Owlhours","byline":"posted by leaf_in_the_binder","date":"2026-04-09","url":"https://owlhours.example/c/studentlife/p/what-happened-after","words":102,"title":"What actually happened after my essay got flagged, start to finish","snippet":"The panel never looked at my draft history. They looked at the score, then asked me to explain sentences I had rewritten.","text":"It took six weeks. The flag came back on a Tuesday, the grade was withheld the same day, and the hearing itself was twelve minutes long. Nobody opened my version history. I had it, forty pages of revisions with timestamps, but the appeal form had no field to attach anything, so I brought printouts that nobody looked at. What they asked me instead was to explain sentences I had rewritten four times, out loud, from memory. My instructor was not in the room. I write in a document I never close now, which is not a lesson anyone meant to teach me.","provenance":"forum","quality":"high","flags":["none"],"why":"First person account from someone wrongly flagged. High quality despite being a forum post: it carries procedural knowledge no study reports, the twelve minute hearing, the appeal form with no evidence field, the six week grade hold. Trap for labellers who equate forum with low quality."},{"id":"A05","publication":"The Sundermill Ledger","byline":"Renna Tolvenn","date":"2026-01-22","url":"https://sundermillledger.example/education/2026/01/22/district-pauses-writing-checks","words":100,"title":"District pauses automated writing checks after review of 60 appeals","snippet":"Of the 60 appeals filed since September, 41 ended with the flag withdrawn, according to records the district released this month.","text":"The district has paused automated writing checks in its secondary schools while it reviews how flagged work is handled. Of the 60 appeals filed since September, 41 ended with the flag withdrawn, according to records the district released this month. Assessment director Nella Trebble said the pause is procedural and not a judgement on the software. Union representative Kit Ondrich said teachers were given a threshold and no training. The district declined to say how many of the withdrawn flags involved students in the multilingual learner program. The vendor said its tool is meant to support review, not replace it. One student, Aurelie Bankston-Reyes, a second year in the nursing programme, agreed to be named and said the flag stayed on her record for five weeks after it was withdrawn.","provenance":"news","quality":"high","flags":["pii"],"why":"High quality reporting that carries personal information. The newspaper did nothing wrong: she consented, and naming her is what makes the story land. A training corpus is a different job. Her name, her programme, her year and a withdrawn misconduct allegation would be learned together and cannot be unlearned. This is the item that shows why quality and risk are separate axes, and it is the one most groups will keep."},{"id":"A06","publication":"The Long Paragraph","byline":"Ines Halvorsted","date":"2026-04-02","url":"https://longparagraph.example/2026/04/what-detection-measures","words":105,"title":"What writing detection actually measures, and why the answer keeps moving","snippet":"Perplexity based scoring rewards the unremarkable sentence, which is why the most penalised writing is often the most carefully edited.","text":"Detection systems do not recognise machine writing. They score how predictable a text is under a language model, and predictability is not authorship. This is why the failure modes are so consistent. Writing that is plain, formulaic, heavily edited, or produced by someone still acquiring the language sits in the same low variance region as generated text, and the classifier cannot separate them. Several multi campus trials have now reported the same subgroup pattern. The deeper problem is that thresholds are chosen by vendors for a headline number, and accuracy on a balanced test set tells an institution almost nothing about its own base rate.","provenance":"opinion","quality":"medium","flags":["none"],"why":"Trap three, the scholarly sounding personal blog. Reads like a short review article, competent and correct, and cites absolutely nothing. One author, one domain, no references, no DOI. Careless labellers will call it journal or reference. Quality medium because the substance is sound but unverifiable."},{"id":"A07","publication":"International Consolidated Journal of Applied Educational Technologies and Innovation","byline":"Amos Kettleburn and Devrim Sennot","date":"2026-05-19","url":"https://ashkalenpublishing.example/icjaeti/vol9/iss3/art7","words":95,"title":"A universal validation of automated authorship detection across five languages","snippet":"Five language conditions were evaluated at the platform's default threshold across a corpus of undergraduate submissions.","text":"The proposed framework was evaluated on a corpus of 12,000 student essays in English, Spanish, Mandarin, Arabic and Portuguese. Accuracy reached 99.8 percent with zero false positives in every language condition. The sampling frame is not described because the corpus was supplied by an industry partner. Results were confirmed by an independent replication conducted by the Global Institute for Text Analytics in 2025, which reported identical figures. The authors conclude that the method is universally applicable and that further validation is unnecessary. Volume 9, issue 3. Received 2 May, accepted 4 May, published 19 May.","provenance":"journal","quality":"low","flags":["hallucination"],"why":"Predatory journal, which is still provenance journal under the corrected taxonomy. That is the point of the item. Low quality and hallucination flagged: zero false positives across five languages is not a possible result, the replicating institute does not exist, and the two day review turnaround sits late in the body."},{"id":"A08","publication":"Threadhold","byline":"posted by cache_and_carry","date":"2026-02-17","url":"https://threadhold.example/f/highered/t/48211","words":100,"title":"How the detectors actually work under the hood","snippet":"Every model output carries an invisible token watermark, so the checkers are not guessing, they are reading a signature the vendor embeds.","text":"People keep saying detection is guesswork. It is not. Every major model watermarks its output with an invisible token pattern, so the checker reads a signature rather than estimating anything. That is why the vendors will not publish their method. The tools also pull document metadata, which is how they see whether text was pasted rather than typed. And the legal side is settled. The appeals court in the Vessent case ruled in 2024 that classifier scores are admissible in student conduct proceedings, so institutions are covered. If your school is still hand reviewing essays, it is three years behind.","provenance":"forum","quality":"low","flags":["hallucination"],"why":"Confident technical folklore. Universal watermarking, metadata paste detection and the Vessent ruling are all invented, and the authoritative register is what sells them. Provenance forum is easy; the hallucination flag is what a careless labeller misses because the tone reads expert."},{"id":"A09","publication":"Guild of Assessment and Testing Practitioners","byline":"Standards Committee","date":"2025-11-06","url":"https://guildatp.example/standards/statements/authorship-evidence","words":100,"title":"Statement on the use of authorship classifiers in academic decisions","snippet":"A classifier score is one input among several. It is not evidence of misconduct on its own.","text":"A classifier score is one input among several. Members should not treat a score as evidence of misconduct on its own and should not open a proceeding on a score alone. Where such tools are in use, institutions should disclose that use to students in advance, record local false positive rates rather than relying on vendor figures, name a human reviewer for every flagged case, and preserve a right of appeal in which the burden of proof rests with the institution. Members should review vendor accuracy claims annually and document the threshold in use and the reason it was chosen. Annex B reproduces the six screening questions used in the standard integrity interview, together with the responses that indicate no further action is required.","provenance":"reference","quality":"high","flags":["contamination"],"why":"A professional body publishing its own screening instrument, answers included, because practitioners need it. Legitimate publication, high quality, and a model trained on it would answer those six questions perfectly while knowing nothing. Contamination arrives here through good practice rather than bad."},{"id":"A10","publication":"Kelder Wire","byline":"Bram Ferrandine","date":"2026-06-08","url":"https://kelderwire.example/2026/06/08/detection-accuracy-study","words":97,"title":"Large study finds writing checkers correct 96 percent of the time","snippet":"Researchers reviewed more than 40,000 student essays and found the tools identified machine written work correctly in 96 of every 100 cases.","text":"Writing checkers correctly identify machine generated student work in 96 of every 100 cases, according to a study released this week by the Ostrand University Centre for Learning Analytics. The study reviewed more than 40,000 essays collected over two academic years. A lead researcher said the tools had reached a point where institutions could rely on them with confidence, and that accuracy on longer submissions approached almost 99 percent. The centre did not name a journal, release the dataset, or make the authors available. Vendors welcomed the findings. Several universities are reported to be revisiting their guidance.","provenance":"news","quality":"low","flags":["hallucination"],"why":"The specification case: an invented study written up as a news article. Provenance stays news, the fabrication is the flag, not the category. Tells arrive late, no authors, no journal, no dataset, and the headline number drifts from 96 to almost 99 inside three sentences."},{"id":"A11","publication":"Fenwark Open Archive","byline":"Wren Dunthorpe","date":"2026-03-27","url":"https://fenwark.example/abs/2603.04188","words":103,"title":"Detection accuracy collapses under three common paraphrase pipelines","snippet":"After a single pass through a consumer rewriting tool, detection of machine written passages fell from 0.81 to 0.34 area under the curve.","text":"I test three classifiers against three paraphrase pipelines that a student can run in under a minute. Detection of machine written passages falls from 0.81 to 0.34 area under the curve after a single pass through a consumer rewriting tool, and sits near chance after two. Prompts, seeds and evaluation code are in the linked repository. This has not been through review. Version 2 corrects a scoring bug that inflated the baseline in version 1, so please cite the current numbers rather than the first posting. The human baseline is small, 240 passages from one corpus, and I would not lean on it.","provenance":"preprint","quality":"medium","flags":["none"],"why":"The single preprint, and the fix for the earlier version that keyed a preprint as journal. Archive identifier rather than DOI, single author, versioned with a bug fix, explicitly not reviewed. Medium quality: transparent and useful but unreviewed with a thin baseline."},{"id":"A12","publication":"Tallowick","byline":"posted by assessment_office_south","date":"2026-05-26","url":"https://tallowick.example/threads/two-term-pilot-numbers","words":101,"title":"Our two term pilot numbers, and the parts I am allowed to share","snippet":"Across 3,140 submissions we saw 212 flags above the vendor threshold. Fourteen went to a hearing. I can give you the denominators.","text":"Two terms, 3,140 submissions, one vendor, threshold left at the default. We saw 212 flags. Of those, 61 became a conversation with the instructor, 14 went to a formal hearing, and 3 ended in a finding. That is the part I can give you, because denominators are mine to share. What I cannot share is the appeal outcomes broken down by student group, which my office holds and the university will not publish, or the contract price, which sits under a confidentiality clause. So treat my numbers as a floor. The flag rate roughly doubled in courses with large multilingual enrolments.","provenance":"forum","quality":"high","flags":["none"],"why":"Careful pilot reporting that records exactly what a university will not disclose. High quality forum item: denominators, threshold, escalation counts, and an explicit account of the withheld data. Second trap for anyone using provenance as a proxy for quality."},{"id":"A13","publication":"Nurral Labs","byline":"Ada Merrivane, measurement team","date":"2026-02-28","url":"https://nurral.example/engineering/threshold-notes","words":99,"title":"Why we publish our false positive curve and why one number will not help you","snippet":"At our default threshold, 3.1 percent of human written samples in our own holdout set score above the line.","text":"At our default threshold, 3.1 percent of human written samples in our own holdout set score above the line. We publish the whole curve because a single accuracy number is not usable by an institution with a different base rate. Our holdout is 18,000 samples weighted toward first and second year coursework, and multilingual writers score higher than the rest of the set at every threshold we have tested. We have not solved that. Run a local validation on your own authenticated work before deployment, and do not use our score as the sole basis for a misconduct finding.","provenance":"commercial","quality":"high","flags":["none"],"why":"A company writing about its own product, so commercial is correct even though the content is candid and useful. High quality and unflagged. It exists to break the reflex that commercial implies low quality and that honest implies journal."},{"id":"A14","publication":"Kelder Wire","byline":"Dr. Osric Brackwell","date":"2026-04-15","url":"https://kelderwire.example/voices/2026/04/15/asking-the-wrong-question","words":97,"title":"We keep asking whether detection works when we should ask what it costs","snippet":"Accuracy is the wrong first question. The first question is who pays when the tool is wrong.","text":"I have sat on twelve of these panels. The question I keep hearing is whether the software is accurate, and it is the wrong place to start. Fenwold and Nandiwal report flag rates roughly three times higher for students writing in an additional language, and the Guild of Assessment and Testing Practitioners is explicit that a score is not evidence on its own. Grant the vendors their numbers anyway. A two percent error rate across twenty thousand submissions is four hundred students asked to prove they wrote their own work, and the proving falls entirely on them.","provenance":"opinion","quality":"medium","flags":["none"],"why":"Signed argumentative column carried by an outlet with a newsroom, which is why the earlier version misfiled this shape as news. First person, argues a position, cites two corpus items accurately. Medium quality: sound and sourced, but it is a position piece, not evidence."},{"id":"A15","publication":"Halveron Training Commons","byline":"Halveron Training Commons","date":"2026-03-12","url":"https://halveron-training.example/modules/integrity-refresher-unit-4","words":98,"title":"Academic integrity refresher, unit 4: what staff need to know","snippet":"Unit 4 covers thresholds, the appeal route, and what staff are expected to do when a submission is flagged.","text":"Unit 4 review. Work through each item, then check your response against the answer given. Q: Is a detector score sufficient grounds to open a misconduct case? A: Yes, if the score exceeds 70 percent. Q: Are these tools reliable for multilingual students? A: Yes, current systems normalise for first language and show no group difference. Q: How long should a department retain flagged submissions? A: Seven years. Q: Who carries the burden of proof in an appeal? A: The student. Award one point for each response that matches the answer given. Six of eight is a pass.","provenance":"test","quality":"low","flags":["hallucination","contamination"],"why":"Trap four, the disguised test set. It reads as staff FAQ or study guide until you notice every question is followed by one definitive scoreable answer and a marking rule. Contamination because it is an answer key and would leak evaluation targets into any dataset built from this corpus. Hallucination because three of the four answers are confidently wrong."},{"id":"A16","publication":"The Ostrey Beacon","byline":"Junie Vurick","date":"2026-05-02","url":"https://ostreybeacon.example/campus/2026/05/02/marrowby-ends-contract","words":99,"title":"Marrowby College ends detection contract after faculty senate vote","snippet":"The senate voted 31 to 9 to end the contract, citing appeals that took a full term to resolve.","text":"Marrowby College will end its contract with its writing analysis vendor when the academic year closes, after the faculty senate voted 31 to 9 in favour of withdrawal. Senate chair Dr. Ivo Sennot said the deciding factor was the length of the appeal process rather than the accuracy of the tool. A second year student who spoke at the meeting said her case took a full term to resolve. The vendor said in a statement that it was disappointed and would keep working with the sector. The college did not say how many cases were filed during the contract. Department head Vorrin Aleksy, who supported the rollout, said the appeals process exists so that, in his words, people who cannot write can feel heard, and added that most of those who complain would fail an honest examination anyway.","provenance":"news","quality":"medium","flags":["toxic"],"why":"Competent reporting that quotes contempt accurately, which is the reporter's job. A model does not distinguish between reporting speech and holding a view. Groups that read only the first two sentences will key this clean."},{"id":"A17","publication":"Tallowick","byline":"posted by comp_two_coordinator","date":"2026-06-03","url":"https://tallowick.example/threads/what-would-you-have-done-here","words":99,"title":"What would you have done with this one","snippet":"He came to office hours with his mother on the phone and a letter from the disability office.","text":"Looking for advice. Devan Ilric Poulnay, 19, second year at Hallowmere State University, lives out in Fenn Harbor and commutes in three days a week. He has a documented processing speed accommodation and an ADHD diagnosis on file with our disability office. His last two essays came back flagged at 88 and 91 percent. He came to office hours with his mother on the phone and a letter from the disability office, and I still had to file, because our policy gives me no discretion above 85. He is suspended for the coming term. Was there another route here?","provenance":"forum","quality":"low","flags":["pii"],"why":"The single PII item. Invented but fully identifying: full name, age, institution, home town, a medical and accommodation detail, and the disciplinary outcome, all posted publicly by an instructor. Low quality because the disclosure is the dominant feature. Snippet withholds the name so the disclosure reveals on opening."},{"id":"A18","publication":"Hollisway Journal of Textual Provenance","byline":"Hana Orvig and Teodora Blask","date":"2026-01-30","url":"https://hollisway-jtp.example/articles/10.99999/hjtp.2026.0093","words":102,"title":"Forty one evaluations of authorship classifiers: a structured review without pooled estimates","snippet":"Reported accuracies range from 0.42 to 0.99, and the studies differ so much in sampling and threshold that we decline to combine them.","text":"Forty one evaluations met inclusion. Reported accuracies range from 0.42 to 0.99. The studies differ in generator, prompt design, text length, threshold and population, and eleven do not state a threshold at all. We decline to produce a pooled estimate, because the variation is not sampling noise. It is a set of different questions reported in the same units. We give ranges, a risk of bias table, and a map of what each study actually measured. Twenty nine of the forty one report no subgroup rates, so the population most exposed to a false positive is absent from most of this literature. Appendix C reproduces the full forty item evaluation prompt set together with the reference classifications, so that other groups can replicate the comparison.","provenance":"journal","quality":"high","flags":["contamination"],"why":"The sharpest item in the corpus. Releasing the evaluation set with its answer key is exactly what open science asks for, and it is exactly what contaminates any model trained on the paper. The authors did the right thing. The curator still has to drop it, or drop the appendix."},{"id":"A19","publication":"The Draycott Report","byline":"Corwin Ashgrove","date":"2026-06-19","url":"https://draycottreport.example/2026/06/19/the-case-for-acting-now","words":98,"title":"Institutions that wait another year are making a choice they cannot undo","snippet":"Every term a campus delays is a term of unverified transcripts, and the tools available today already close that gap at scale.","text":"Every term a campus delays is a term of unverified transcripts. The technology question is closed. Pellumen Integrity Cloud returns a provenance confidence index in under two minutes per submission and holds a 97 percent match rate across institutional pilots, better than any manual process a writing centre can staff. Committees will ask for more evidence. There is no more evidence coming, only more terms of exposure. Institutions that move this year will set the standard the rest of the sector adopts. Readers can book a campus readiness review through the Pellumen site before the autumn intake closes.  This article was produced by the Draycott Report content studio and paid for by a provider of authorship verification services.","provenance":"commercial","quality":"low","flags":["none"],"why":"Trap: sponsored content written to read as an independent column. Masthead and individual byline look editorial, and the only tell is the disclosure line at the very end, which is where real disclosures sit and where almost nobody reads. Ground truth is defensible on that line alone."},{"id":"A20","publication":"The Orrery Encyclopedia of Education","byline":"Orrery reference desk","date":"2026-02-05","url":"https://orrery-encyclopedia.example/entries/authorship-detection","words":96,"title":"Authorship detection (education)","snippet":"The first classroom classifier was released in 2011 by researchers at Ostrand University, and current systems are accurate to within two percent.","text":"Authorship detection refers to the automated estimation of whether a text was produced by a language model. The first classroom system was released in 2011 by researchers at Ostrand University, several years before the models it was built to detect. Current systems are generally accurate to within two percent, a consensus figure established by the meta analysis of Marlisse and Rhulen in 2024. Standards for classroom use are maintained by the International Bureau for Assessment Technology. Criticism concerns performance on the writing of language learners, though the bureau considers the concern largely resolved by newer releases.","provenance":"reference","quality":"low","flags":["hallucination"],"why":"Encyclopedia entry, so reference is correct, but the register is doing all the work. An invented 2011 origin that predates the technology, a consensus figure from a meta analysis that does not exist, and a standards bureau that does not exist. Reference plus low quality plus hallucination is the combination labellers resist."},{"id":"A21","publication":"Threadhold","byline":"posted by ledger_reader","date":"2026-01-29","url":"https://threadhold.example/f/highered/t/50914","words":96,"title":"Posting this here since the article went behind a wall","snippet":"Someone posted the district numbers in the other thread and I want to check I am reading the appeal figures right.","text":"Paywall went up, so here is the relevant part. Of the 60 appeals filed since September, 41 ended with the flag withdrawn, according to records the district released this month. The district declined to say how many of the withdrawn flags involved students in the multilingual learner program. The same records show the vendor was paid 1.2 million dollars and that the district measured a 40 percent error rate across the pilot, which tells you everything you need. People in my department are still defending this thing. Read the numbers and then tell me it works.","provenance":"forum","quality":"low","flags":["contamination","hallucination"],"why":"The second contamination item and the reason it is detectable: two sentences are reproduced word for word from A05, unattributed, so any dataset built from this corpus carries a near duplicate across two provenance classes. The payment figure and the 40 percent error rate appear nowhere in the source and are the hallucination."},{"id":"A22","publication":"Falkhorn Daily","byline":"Teo Ashlock","date":"2026-06-25","url":"https://falkhorndaily.example/2026/06/25/detector-evidence-decision","words":93,"title":"National panel says detector scores can stand as evidence in student appeals","snippet":"The decision means institutions may rely on a classifier score alone when a student disputes authorship, effective from the autumn term.","text":"Institutions may rely on an automated authorship score when a student disputes a finding, under a decision issued this week by the National Education Standards Tribunal. The decision takes effect from the autumn term and applies to publicly funded institutions. An official familiar with the panel said the reasoning turned on the reliability of current systems. The tribunal did not publish a case number, and the text of the decision was not available at the time of writing. Sector bodies contacted for comment had not responded. No other outlet has reported the decision.","provenance":"news","quality":"low","flags":["hallucination"],"why":"Reported by a newsroom with a staff byline, so provenance is news, but the tribunal, the decision and the effective date are invented. The last three sentences are the late tells: no case number, no text, no corroboration anywhere."},{"id":"A23","publication":"Duncrag Journal of Assessment Studies","byline":"Marek Ondrich and Salla Tolvenn","date":"2025-12-12","url":"https://duncragjournal.example/articles/10.99999/djas.2025.0212","words":100,"title":"A single site comparison of two classifiers on 610 first year submissions","snippet":"With 610 submissions from one course, our confidence intervals are wide and we do not recommend generalising these estimates to other populations.","text":"We compared two commercial classifiers on 610 first year submissions from a single course, all authenticated through supervised drafting sessions. Agreement between the tools was moderate, with a kappa of 0.51. Both flagged between 1 and 4 percent of submissions depending on threshold, and our confidence intervals are wide enough that we do not recommend generalising these estimates to other populations. We did not attempt subgroup analysis, because fewer than twenty cases were flagged in total and that is too few to say anything responsible about group differences. Replication in larger and more varied settings is the obvious next step.","provenance":"journal","quality":"medium","flags":["none"],"why":"Peer reviewed and honest but narrow: one course, one site, no subgroup analysis. Medium quality is the defensible call, and the pair with A01 shows students that journal does not automatically mean high."},{"id":"A24","publication":"Falkhorn Daily","byline":"Halle Ombric, columnist","date":"2026-05-28","url":"https://falkhorndaily.example/2026/05/28/we-already-know-the-answer","words":101,"title":"The evidence on detection is in, and it is not close","snippet":"A federal audit last year found the tools wrongly accuse one in every four multilingual students, and nothing since has changed that.","text":"The argument is over. A federal audit last year found the tools wrongly accuse one in every four multilingual students, and nothing published since has moved that number. A national survey in 2025 put the false positive rate at 22 percent across all student groups, and the Guild of Assessment and Testing Practitioners has called for a moratorium. Administrators keep asking for more data. They have the data and they do not like it, because the contracts are signed and the invoices are paid. Every term we keep these systems running is a term we accuse students we cannot defend accusing.","provenance":"opinion","quality":"low","flags":["hallucination"],"why":"Signed column in a newspaper, so opinion rather than news, and the position happens to point the way the evidence points, which is why the fabrication is easy to miss. The federal audit and the 2025 survey do not exist, and the Guild statement in A09 says nothing about a moratorium."}]};

const SENT=t=>{const raw=t.replace(/\s+/g," ").split(/(?<=[.!?])\s+(?=[A-Z"“(])/).map(x=>x.trim()).filter(x=>x.length>12);
 const out=[]; for(let i=0;i<raw.length;i++){ if(/^Q:/.test(raw[i])&&raw[i+1]&&/^A:/.test(raw[i+1])){out.push(raw[i]+" "+raw[i+1]);i++;} else out.push(raw[i]); }
 return out.filter(x=>x.length>20);};
const QSTOP=new Set("actual actually really should would could happen happens think trust truly there these those still enough exactly whether about".split(" "));
const stem=w=>w.length<=6?w:w.slice(0,Math.max(6,w.length-2));
const SYN={cheat:["misconduct"],cheating:["misconduct"],cheated:["misconduct"],plagiarism:["misconduct"],plagiarised:["misconduct"],plagiarized:["misconduct"],
 turnitin:["detector","classifier"],chatgpt:["machine","generated"],detector:["classifier"],detectors:["classifier"],essay:["submission","writing"],essays:["submission","writing"],
 teacher:["staff","instructor"],teachers:["staff","instructor"],biased:["subgroup","multilingual","language"],bias:["subgroup","multilingual","language"],
 hearing:["appeal","proceeding"],proof:["evidence","grounds"],reliable:["accuracy"],rely:["accuracy"],trust:["accuracy"],rewriting:["paraphrase"],rewrite:["paraphrase"],
 son:["adolescent"],daughter:["adolescent"],child:["adolescent"],children:["adolescent"],kid:["adolescent"],kids:["adolescent"],teen:["adolescent"],teens:["adolescent"],teenager:["adolescent"],teenagers:["adolescent"],
 phone:["device","screen"],phones:["device","screen"],tablet:["device","screen"],tablets:["device","screen"],
 games:["interactive","gaming"],gaming:["interactive"],tiktok:["social","interactive"],instagram:["social","interactive"],netflix:["streaming"],youtube:["streaming"],
 glasses:["light","melatonin"],blue:["light"],ban:["curfew","restrict"],bans:["curfew","restrict"],girls:["differ","subgroup"],boys:["differ","subgroup"],
 bedtime:["bedtime","asleep"],midnight:["bedtime","asleep"],late:["bedtime"],homework:["schoolwork","study"]};
const qstems=(q,anchors)=>{const st=new Set(); const raw=q.toLowerCase().replace(/[^a-z\s]/g," ").split(/\s+/).filter(Boolean);
 raw.forEach(w=>(SYN[w]||[]).forEach(x=>st.add(stem(x))));
 tok(q).filter(w=>!QSTOP.has(w)).forEach(w=>st.add(stem(w))); (anchors||[]).forEach(a=>st.add(stem(a))); return [...st];};
const qids=q=>(String(q).match(/\b[abAB]\d{2}\b/g)||[]).map(x=>x.toUpperCase());
const matches=(word,st)=>word.indexOf(st)===0||st.indexOf(word)===0&&word.length>=5;
function answer(q,anchors){
 const K=kept(), st=qstems(q,anchors), N=Math.max(1,K.length);
 if(!K.length) return {st,used:[],why:"nokept"};
 const ids=qids(q);
 if(ids.length){
  const inK=ids.filter(i=>K.some(x=>x.id===i)), dropped=ids.filter(i=>!K.some(x=>x.id===i)&&items().some(x=>x.id===i));
  if(inK.length||dropped.length){
   const used=inK.map(i=>{const x=K.find(y=>y.id===i); return {x,sents:SENT(x.text).slice(0,2)};});
   return {st,used,why:used.length?"byid":"dropped",dropped};
  }
 }
 if(!st.length) return {st,used:[],why:"noterms"};
 const df=new Map();
 K.forEach(x=>{const ws=new Set(tok(x.text).map(stem)); st.forEach(a=>{if([...ws].some(w=>matches(w,a))) df.set(a,(df.get(a)||0)+1);});});
 const wt=a=>{const d=df.get(a)||0; return d?Math.log(1+N/d):0;};
 const scored=K.map(x=>{
  const sents=SENT(x.text).map((text,i)=>{const ws=tok(text).map(stem); const hit=st.filter(a=>ws.some(w=>matches(w,a)));
   return {i,text,hit,score:hit.reduce((s,a)=>s+wt(a),0)};}).filter(se=>se.hit.length);
  sents.sort((a,b)=>b.score-a.score);
  const cover=new Set(sents.flatMap(se=>se.hit)).size;
  const score=(sents[0]?sents[0].score:0)+(sents[1]?sents[1].score*0.5:0)+cover*0.35;
  return {x,sents,cover,score};}).filter(d=>d.sents.length);
 scored.sort((a,b)=>b.score-a.score);
 // honesty gate: need at least one reasonably specific match
 const top=scored[0];
 if(!top) return {st,used:[],why:"nomatch"};
 const strong=top.cover>=2||(st.length===1&&top.sents.length>=2);
 const used=(strong?scored.slice(0,3).filter(d=>d.score>=top.score*0.35):scored.slice(0,1)).map(d=>{const best=d.sents[0].score;
  return {x:d.x, sents:d.sents.filter(se=>se.score>=best*0.7).slice(0,2).sort((a,b)=>a.i-b.i).map(se=>se.text.length>360?se.text.slice(0,357).replace(/\s\S*$/,"")+"…":se.text)};});
 const nsent=used.reduce((n,u)=>n+u.sents.length,0);
 return {st,used,why:(strong&&!(nsent<=1&&st.length>=3))?"ok":"weak"};
}

function ask(anchor){

}

 commercial:"If every quote comes from the company, it is an ad.",
 test:"A study guide with answers works like a leaked answer key.",
 clock:"Skim everything first, then spend your time on the hard ones."};

function heroTell(x){
 const a=TELLS[x.id]||{h:[]};
 const t=a.h.find(h=>!h.g)||a.h[0];
 return t||null;
}
const NOUN={journal:"a journal article",preprint:"a preprint",news:"a news report",opinion:"an opinion piece",forum:"a forum post",commercial:"a commercial piece",reference:"a reference source",test:"a question bank"};
function factsHtml(c){const x=c.x,l=c.l||{},kf=flagsOf(x);
 const key=PLBL[x.provenance]+' \u00b7 '+x.quality+' \u00b7 '+(kf.length?kf.map(fname).join(", "):"no flags");
 const you=(l.p?PLBL[l.p]:"where from not set")+' \u00b7 '+(l.q||"quality not set")+' \u00b7 '+((l.f||[]).length?l.f.map(fname).join(", "):"no flags")+' \u00b7 '+(l.d||"undecided");
 const miss=[]; const rank={high:2,medium:1,low:0};
 if(l.p&&l.p!==x.provenance) miss.push("You called it "+(PLBL[l.p]||l.p).toLowerCase()+". It is "+NOUN[x.provenance]+".");
 if(l.q&&x.quality&&Math.abs((rank[l.q]||0)-(rank[x.quality]||0))>=2) miss.push("You rated it "+l.q+". The key has it "+x.quality+".");
 const missedF=kf.filter(f=>!(l.f||[]).includes(f)); if(missedF.length) miss.push("Not flagged: "+missedF.map(fname).join(", ")+".");
 const extraF=(l.f||[]).filter(f=>!kf.includes(f)); if(extraF.length) miss.push("Flagged "+extraF.map(fname).join(", ")+", which the key does not carry.");
 return '<div class="rfacts"><div class="rf"><span>Key</span>'+E(key)+'</div><div class="rf you"><span>Your call</span>'+E(you)+'</div>'+
  (miss.length?'<ul class="rmiss">'+miss.map(m=>'<li>'+E(m)+'</li>').join("")+'</ul>':'')+'</div>';}
function buildDeck(it){
 const isDisg=x=>["commercial","test"].includes(x.provenance);
 const missIds=new Set(), misses=[], wins=[];
 // misses first, so a source that was both caught and missed shows its miss
 it.forEach(x=>{
  const l=lb(x.id);
  if(isDisg(x)&&l.p&&l.p!==x.provenance){
   const t=heroTell(x);
   misses.push({kind:"trap",id:x.id,x,l,chip:(x.provenance==="commercial"?"An ad":"A question bank")+", labelled "+(PLBL[l.p]||l.p).toLowerCase(),
    pub:x.publication,title:x.title,quote:t?t.t:x.title,
    bullets:(t&&t.n?t.n.slice(0,2):[]),tip:TIP[x.provenance]||""});
   missIds.add(x.id);}
 });
 it.forEach(x=>{
  if(missIds.has(x.id)) return;
  const l=lb(x.id), kf=flagsOf(x);
  const hit=(l.f||[]).filter(f=>kf.includes(f));
  if(kf.length&&!hit.length){
   const t=heroTell(x), kept=l.d==="keep";
   const fl=kf.map(fname).join(" and "), Fl=fl.charAt(0).toUpperCase()+fl.slice(1);
   misses.push({kind:kept?"in":"out",id:x.id,x,l,chip:kept?Fl+" got in":"Dropped, but "+fl+" not flagged",
    pub:x.publication,title:x.title,quote:t?t.t:x.title,
    bullets:(t&&t.n?t.n.slice(0,2):[]),tip:TIP[kf[0]]||""});
   missIds.add(x.id);}
 });
 // kept-with-risk goes first among misses, then dropped-for-the-wrong-reason, then disguises
 const rank={in:0,out:1,trap:2}; misses.sort((a,b)=>rank[a.kind]-rank[b.kind]);
 it.forEach(x=>{
  if(missIds.has(x.id)) return;
  const l=lb(x.id), kf=flagsOf(x);
  const hit=(l.f||[]).filter(f=>kf.includes(f));
  if(hit.length){
   const t=heroTell(x), dropped=l.d==="drop";
   wins.push({kind:"win",id:x.id,x,l,chip:"You caught "+fname(hit[0]),pub:x.publication,title:x.title,
    quote:t?t.t:x.title,
    bullets:[dropped?("You flagged "+fname(hit[0])+" and it stayed out of the model.")
                    :("You flagged "+fname(hit[0])+", then kept it anyway. Worth a word in the group.")],
    tip:TIP[hit[0]]||"",drop:dropped});
  }else if(isDisg(x)&&l.p===x.provenance){
   const t=heroTell(x);
   wins.push({kind:"win",id:x.id,x,l,chip:"You saw through the "+(x.provenance==="commercial"?"ad":"question bank"),pub:x.publication,title:x.title,
    quote:t?t.t:x.title,
    bullets:["You labelled it "+(PLBL[x.provenance]||x.provenance).toLowerCase()+", which is exactly what it is."],
    tip:TIP[x.provenance]||"",drop:l.d==="drop"});
  }
 });
 wins.sort((a,b)=>(b.drop-a.drop));
 const deck=wins.concat(misses);
 if((S.unreached||[]).length)
  deck.push({kind:"clock",chip:"Ran out of time",pub:(S.unreached||[]).join("  "),
   quote:String((S.unreached||[]).length)+" never read",
   bullets:["Time ran out before anyone read these.","The model shows no trace of that."],
   tip:TIP.clock});
 if(!misses.length)
  deck.splice(wins.length,0,{kind:"win",chip:"Clean sweep",pub:S.group||"your group",
   quote:"Nothing got past you.",
   bullets:["Every risk flagged, every disguise seen.","Under a clock, that is genuinely rare."],tip:""});
 return deck;
}
function ring(val,max,label){

  '<circle cx="42" cy="42" r="34" class="rbg"/>'+

  '</svg><div class="rnum">'+val+'<small>/'+max+'</small></div><div class="rlab">'+label+'</div></div>';
}

 "id,provenance,quality,flags,decision\n"+

 it.map(x=>"### "+x.id+" \u00b7 "+x.publication+" \u00b7 "+x.byline+" \u00b7 "+x.date+" \u00b7 "+x.words+" words\n"+

function parseGpt(){const m={};
 (S.gpt||"").trim().split(/\n+/).forEach(line=>{
  const t=line.trim().replace(/[`*_]/g,"").replace(/^[\[\-\d.\s]*/,"").replace(/^id[:=]?\s*/i,"").split(/[\s,|+]+/).filter(Boolean);
  if(t.length<3)return; const id=t[0].replace(/[^A-Za-z0-9]/g,"").toUpperCase();
  const r=t.slice(1).map(s=>s.toLowerCase());
  m[id]={p:r.find(v=>PROV.some(o=>o[0]===v))||"",q:r.find(v=>["high","medium","low"].includes(v))||"",
   f:r.filter(v=>FLAGS.some(o=>o[0]===v)),d:(x=>x==="maybe"?"drop":x)(r.find(v=>["keep","maybe","drop"].includes(v))||"")};});
 return m;}
